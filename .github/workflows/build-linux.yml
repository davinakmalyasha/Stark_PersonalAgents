# Builds the Linux deploy unit for the VPS runner: the stark-server binary
# (x86_64, glibc matched to the deploy OS). The VPS never compiles — it
# downloads this artifact and runs it.
#
# Trigger: manual, or every push to master. The desktop master feed and the
# VPS deploy therefore follow the same commits; docs-only pushes redeploy the
# current server harmlessly.
# Runner is Ubuntu 24.04: its glibc is older than the VPS's 26.04, and glibc
# is forward-compatible — so the binary runs on 26.04. (Building on 26.04
# would break the other way.) 24.04 is also the guaranteed runner label.

name: build-linux

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (stable, per backend-rs/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs -> target

      # stark-voice -> cpal -> alsa-sys needs the ALSA headers on Linux.
      # (Runtime needs libasound2t64 on the VPS too — handled at deploy.)
      - name: System deps (Linux audio headers)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Contract sanity (frozen v6 tool contract)
        working-directory: backend-rs
        run: cargo test -p stark-contract

      - name: Build stark-server (release)
        working-directory: backend-rs
        run: cargo build --release -p stark-server

      - name: Package deploy unit
        run: |
          mkdir -p pkg/opt/stark
          cp backend-rs/target/release/stark-server pkg/opt/stark/stark-server
          chmod +x pkg/opt/stark/stark-server
          tar -czf stark-linux-x86_64.tar.gz -C pkg opt
          tar -tzf stark-linux-x86_64.tar.gz | head -8
          ls -la stark-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: stark-linux-x86_64
          path: stark-linux-x86_64.tar.gz
          retention-days: 7
