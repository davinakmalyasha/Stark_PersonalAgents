[workspace]
resolver = "2"
members = [
    "crates/stark-contract",
    "crates/stark-config",
    "crates/stark-policy",
    "crates/stark-providers",
    "crates/stark-tools",
    "crates/stark-sandbox",
    "crates/stark-store",
    "crates/stark-core",
    "crates/stark-server",
    "crates/stark-voice",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["multipart", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
dashmap = "6"
dotenvy = "0.15"
eventsource-stream = "0.2.3"
futures-util = "0.3"
globset = "0.4"
http = "1"
httpdate = "1"
ignore = "=0.4.30"
notify = "8"
nucleo = { git = "https://github.com/helix-editor/nucleo.git", rev = "4253de9faabb4e5c6d81d946a5e35a90f87347ee" }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
reqwest013 = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "rustls", "http2", "stream"] }
rmcp = { version = "3.10", default-features = false, features = ["client", "macros", "transport-child-process", "transport-streamable-http-client-reqwest", "auth"] }
schemars = "0.8.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "json", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "11"
uuid = { version = "1", features = ["v4", "serde"] }

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
