name: rune-validate

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop-rune/**"
      - ".github/workflows/rune-validate.yml"
  pull_request:
    paths:
      - "desktop-rune/**"
      - ".github/workflows/rune-validate.yml"

jobs:
  rune:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-rune
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rune -> target
      - run: cargo fmt -p stark-theme -p stark-kit -p stark-rune-app -p stark-rune-web -p stark-launcher -- --check
      - run: cargo clippy -p stark-rune-app --features rune-real --all-targets -- -D warnings
      - run: cargo clippy -p stark-launcher --all-targets -- -D warnings
      - run: cargo test -p stark-rune-app --features rune-real
      - run: cargo test -p stark-launcher
      - run: cargo test
      # Native tests never compile the wasm path (SystemTime panics and
      # native-only transport fns slipped through twice). This is the gate.
      - run: cargo check -p stark-rune-web --target wasm32-unknown-unknown
