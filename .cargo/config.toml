# Match Hex's transcribe.cpp build on the desktop server:
# - static MSVC runtime, so a clean PC needs no Visual C++ Redistributable
# - Vulkan shaders only for the quantized types Parakeet Q8_0 uses
# - no MUL_MAT_ID shader (the model does not use it)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
CMAKE_ARGS = "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DGGML_NATIVE=OFF -DGGML_VULKAN_SHADER_TYPES=f32,f16,q8_0,q5_0 -DGGML_VULKAN_MUL_MAT_ID=OFF"
