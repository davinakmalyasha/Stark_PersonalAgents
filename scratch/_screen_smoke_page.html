<!DOCTYPE html>
<html><body><script>
  window.__frame = '';
  window.__error = '';
  window.__timing = '';
  (async () => {
    try {
      const t0 = performance.now();
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 5 }, audio: false });
      const tStart = performance.now();
      const video = document.createElement('video');
      video.srcObject = stream;
      video.muted = true;
      await video.play();
      await new Promise((r) => setTimeout(r, 800));
      const canvas = document.createElement('canvas');
      const scale = Math.min(1, 1280 / video.videoWidth);
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);
      const tEncode0 = performance.now();
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      window.__frame = canvas.toDataURL('image/jpeg', 0.72) + '|' + canvas.width + 'x' + canvas.height;
      const tEncode1 = performance.now();
      window.__timing = JSON.stringify({
        getDisplayMedia_ms: Math.round(tStart - t0),
        encode_ms: Math.round(tEncode1 - tEncode0),
        jpeg_b64_len: window.__frame.length,
      });
      stream.getTracks().forEach((t) => t.stop());
    } catch (e) {
      window.__error = (e && e.message) ? e.message : String(e);
    }
  })();
</script></body></html>
