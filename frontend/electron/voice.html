<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
body {
  background: transparent;
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  overflow: hidden;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  --accent: #b6c2d4;
  --accent-soft: rgba(182, 194, 212, 0.28);
  --accent-bg: rgba(182, 194, 212, 0.1);
}
body.state-listening { --accent: #9fc1f0; --accent-soft: rgba(159, 193, 240, 0.3); --accent-bg: rgba(159, 193, 240, 0.1); }
body.state-thinking { --accent: #c3b3e8; --accent-soft: rgba(195, 179, 232, 0.3); --accent-bg: rgba(195, 179, 232, 0.1); }
body.state-processing { --accent: #b18be8; --accent-soft: rgba(177, 139, 232, 0.34); --accent-bg: rgba(177, 139, 232, 0.12); }
body.state-speaking { --accent: #9be1e6; --accent-soft: rgba(155, 225, 230, 0.32); --accent-bg: rgba(155, 225, 230, 0.1); }
body.state-muted   { --accent: #6b7686; --accent-soft: rgba(107, 118, 134, 0.25); --accent-bg: rgba(107, 118, 134, 0.08); }
body.state-error   { --accent: #f2a0a0; --accent-soft: rgba(242, 160, 160, 0.35); --accent-bg: rgba(242, 160, 160, 0.12); }

.container {
  position: relative;
  width: 100%;
  height: 100%;
  background: transparent;
  border: 0;
  border-radius: 0;
  padding: 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  box-shadow: none;
  -webkit-app-region: drag;
  transition: border-color 0.5s ease, border-radius 0.25s ease;
  overflow: hidden;
}
.main-row { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 100%; height: 100%; flex-shrink: 0; }
.container::before {
  content: '';
  position: absolute;
  top: 0; left: 6%; right: 6%;
  height: 1px;
  display: none;
  pointer-events: none;
}
body.state-listening .container,
body.state-thinking .container,
body.state-processing .container,
body.state-speaking .container { border-color: transparent; }
body.state-error .container { border-color: rgba(242, 160, 160, 0.4); animation: errFade 0.9s ease 2; }
@keyframes errFade { 50% { border-color: rgba(242, 160, 160, 0.7); } }

/* soft idle sweep */
.scan {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.025) 46%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0.025) 54%, transparent 100%);
  transform: translateY(-110%);
}
body.state-idle .scan { opacity: 1; animation: scan 8s linear infinite 3s; }
@keyframes scan {
  0% { transform: translateY(-110%); }
  45%, 60% { transform: translateY(110%); }
  100% { transform: translateY(110%); }
}

button { -webkit-app-region: no-drag; cursor: pointer; border: none; outline: none; }

/* ── Live bars toggle (voice-level equalizer) ── */
.bars-btn {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  border: 1px solid rgba(226, 232, 240, 0.95);
  box-shadow: 0 6px 18px rgba(15, 23, 42, 0.2);
  transition: transform 0.25s ease;
}
.bars-btn:hover { transform: scale(1.06); }
.bars-btn:active { transform: scale(0.93); }

/* soft halo behind the bars */
.bars-btn::before {
  content: '';
  position: absolute;
  inset: -9px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent-soft), transparent 70%);
  filter: blur(9px);
  display: none;
  transition: opacity 0.6s ease;
}
body.state-listening .bars-btn::before,
body.state-thinking .bars-btn::before,
body.state-processing .bars-btn::before,
body.state-speaking .bars-btn::before { opacity: 0.65; }

.bars {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3.5px;
  height: 26px;
}
.bars i {
  display: block;
  width: 3.5px;
  height: 8px;
  border-radius: 2px;
  background: #0f172a;
  box-shadow: none;
  transition: height 0.12s linear, background 0.5s ease, opacity 0.5s ease;
}
body.state-muted .bars i { opacity: 0.35; }

/* ripple rings — speaking / listening */
.orb-ripple { position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--accent); opacity: 0; pointer-events: none; transition: border-color 0.5s ease; }
body.state-speaking .orb-ripple { animation: rippleOut 2s ease-out infinite; }
body.state-speaking .orb-ripple.r2 { animation-delay: 1s; }
body.state-listening .orb-ripple { animation: rippleOut 2.8s ease-out infinite; }
@keyframes rippleOut { 0% { transform: scale(1); opacity: 0.4; } 100% { transform: scale(1.9); opacity: 0; } }

/* ── TTS warm-up loading (mic button only — clean black spinner line) ── */
.bars-btn.loading { pointer-events: none; }
.bars-btn.loading::after {
  content: '';
  position: absolute;
  inset: 11px;
  border-radius: 50%;
  border: 2.5px solid transparent;
  border-top-color: #0f172a;
  animation: spin 0.9s linear infinite;
  opacity: 0;
  transition: opacity 0.35s ease;
}
.bars-btn.loading::before { display: none; }
.bars-btn.loading .bars { opacity: 0; transition: opacity 0.35s ease; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Info column ── */
.info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.status-row { display: flex; align-items: center; gap: 7px; min-width: 0; }
.pip {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent-soft);
  transition: background 0.5s ease, box-shadow 0.5s ease;
}
.pip.listening { animation: pipPulse 1.2s ease-in-out infinite; }
.pip.thinking { animation: pipPulse 1s ease-in-out infinite; }
.pip.processing { animation: pipPulse 0.8s ease-in-out infinite; }
.pip.speaking { animation: pipPulse 0.7s ease-in-out infinite; }
@keyframes pipPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.label {
  color: #334155;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  white-space: nowrap;
}
.label.swap { animation: labelSwap 0.3s ease; }
@keyframes labelSwap { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

.ellipsis { display: inline-flex; gap: 2.5px; opacity: 0; transition: opacity 0.4s ease; }
.ellipsis i { width: 3px; height: 3px; border-radius: 50%; background: var(--accent); animation: blink 1.3s ease-in-out infinite; transition: background 0.5s ease; }
.ellipsis i:nth-child(2) { animation-delay: 0.2s; }
.ellipsis i:nth-child(3) { animation-delay: 0.4s; }
body.state-listening .ellipsis, body.state-thinking .ellipsis, body.state-processing .ellipsis, body.state-speaking .ellipsis { opacity: 1; }
@keyframes blink { 0%, 100% { opacity: 0.15; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }

/* activity hairline — L / T / A */
.stages { display: flex; gap: 3px; margin-left: auto; align-items: center; flex-shrink: 0; }
.stage {
  width: 13px;
  height: 2.5px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.09);
  transition: background 0.4s ease, box-shadow 0.4s ease;
}
.stage.on { background: var(--accent); box-shadow: 0 0 6px var(--accent-soft); }

.mid-row { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; min-width: 0; -webkit-app-region: no-drag; cursor: pointer; border-radius: 8px; padding: 2px 4px; margin: 0 -4px; transition: background 0.25s ease; }
.mid-row:hover { background: rgba(255, 255, 255, 0.03); }

#wave { width: 48px; height: 20px; flex-shrink: 0; opacity: 0.85; }
#wave.fade-in { animation: waveIn 0.3s ease; }
@keyframes waveIn { from { opacity: 0.25; transform: scale(0.97); } to { opacity: 0.85; transform: none; } }

.text-wrap { flex: 1; min-width: 0; overflow: hidden; }
.text {
  display: inline-block;
  color: #64748b;
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.35;
  max-width: 86px;
  letter-spacing: 0.01em;
}
.text.marquee { text-overflow: clip; animation: marquee 10s linear infinite alternate; }
.text-wrap:hover .text.marquee { animation-play-state: paused; }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(var(--tx, -120px)); } }

.hint { display: none; color: #64748b; font-size: 10px; white-space: nowrap; flex-shrink: 0; letter-spacing: 0.02em; }

/* ── Action buttons ── */
.btn {
  width: 25px;
  height: 25px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  color: #64748b;
  transition: all 0.2s ease;
}
.btn:hover { background: #e2e8f0; color: #334155; transform: translateY(-1px); }
.btn:active { transform: scale(0.9); }
.btn svg { width: 13px; height: 13px; }

.send-btn {
  background: var(--accent-bg);
  border-color: var(--accent-soft);
  color: var(--accent);
  animation: sendIn 0.25s ease;
}
.send-btn:hover { background: var(--accent-bg); color: var(--accent); }
@keyframes sendIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.close-btn { width: 24px; height: 24px; font-size: 12px; line-height: 1; }

.expand-btn svg { transition: transform 0.3s ease; }
.expand-btn.expanded svg { transform: rotate(180deg); }
.expand-btn.expanded { color: var(--accent); border-color: var(--accent-soft); }

/* ── Live process feed (expanded view) ── */
.feed-wrap {
  width: 100%;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-top: 1px solid rgba(255, 255, 255, 0.07);
  padding-top: 6px;
}
.feed-head { display: flex; justify-content: space-between; align-items: center; padding: 0 2px 4px; -webkit-app-region: no-drag; }
.feed-live { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; color: var(--accent); display: flex; gap: 5px; align-items: center; }
.feed-live i { width: 5px; height: 5px; border-radius: 50%; background: #f87171; animation: blink 1s ease-in-out infinite; }
.feed-status { font-size: 9.5px; color: #5b6472; letter-spacing: 0.04em; }
.feed {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  font-family: Consolas, 'Cascadia Mono', 'Courier New', monospace;
  font-size: 10.5px;
  line-height: 1.5;
  color: #8b93a1;
  -webkit-app-region: no-drag;
}
.feed-line { padding: 1px 2px; white-space: pre-wrap; word-break: break-word; }
.feed-line.user { color: #e2e8f0; }
.feed-line.thought { color: #c3b3e8; }
.feed-line.agent { color: #9fc1f0; }
.feed-line.tool { color: #9be1e6; }
.feed-line.error { color: #f2a0a0; }
.feed-line.meta { color: #6b7686; }
.feed::-webkit-scrollbar { width: 4px; }
.feed::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 2px; }

/* Right-side vertical button stack */
.side-col { display: flex; flex-direction: row; gap: 4px; align-items: center; justify-content: center; width: 100%; flex-shrink: 0; }
.side-row { display: contents; }

/* ── Voice menu ── */
.voice-menu {
  position: fixed;
  right: 40px;
  bottom: 6px;
  background: rgba(15, 15, 20, 0.95);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 12px;
  padding: 5px;
  z-index: 50;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
  -webkit-app-region: no-drag;
  max-height: 250px;
  overflow-y: auto;
}
.voice-menu-head {
  padding: 4px 9px 2px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #5b6472;
}
.voice-menu button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 5px 9px;
  border-radius: 7px;
  font-size: 11px;
  color: #9aa1ad;
  background: transparent;
  white-space: nowrap;
}
.voice-menu button:hover { background: var(--accent-bg); color: #e2e8f0; }
.voice-menu button.active { color: var(--accent); }

/* The live process feed needs the original wide layout when expanded. */
body.is-expanded .container {
  border-radius: 16px;
  padding: 8px 10px;
  gap: 6px;
}
body.is-expanded .main-row {
  flex-direction: row;
  align-items: center;
  justify-content: initial;
  gap: 10px;
  width: 100%;
  height: auto;
}
body.is-expanded .bars-btn { width: 52px; height: 52px; }
body.is-expanded .info { flex: 1; width: auto; align-items: initial; }
body.is-expanded .status-row { justify-content: initial; }
body.is-expanded .mid-row { justify-content: initial; width: auto; gap: 7px; }
body.is-expanded #wave { width: 80px; height: 24px; }
body.is-expanded .text { max-width: 100%; font-size: 11px; }
body.is-expanded .hint { display: inline; }
body.is-expanded .side-col { flex-direction: column; gap: 6px; align-items: flex-end; width: auto; }
body.is-expanded .side-row { display: flex; gap: 6px; align-items: center; }
body.is-expanded .btn { width: 28px; height: 28px; }
body.is-expanded .feed-wrap { border-top-color: #e2e8f0; }
body.is-expanded .feed { color: #64748b; }
body.is-expanded .feed-line.user { color: #334155; }
body.is-expanded .feed-line.thought { color: #7c3aed; }
body.is-expanded .feed-line.agent { color: #2563eb; }
body.is-expanded .feed-line.tool { color: #0f766e; }

/* ── Compact orb ── */
.menu-toggle {
  position: absolute;
  top: 7px;
  right: 7px;
  z-index: 4;
  width: 22px;
  height: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.5px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid rgba(148, 163, 184, 0.28);
  box-shadow: 0 3px 10px rgba(15, 23, 42, 0.16);
  color: #64748b;
  transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
}
.menu-toggle:hover { transform: scale(1.08); background: #f8fafc; color: #1e293b; }
.menu-toggle:active { transform: scale(0.94); }
.menu-toggle i { display: block; width: 9px; height: 1.5px; border-radius: 2px; background: currentColor; }
.menu-toggle.active { background: #f1f5f9; color: #334155; }

body:not(.is-menu-open):not(.is-expanded) .container {
  padding: 0;
  border-radius: 0;
}
body:not(.is-menu-open):not(.is-expanded) .main-row {
  flex-direction: row;
  height: 100%;
  justify-content: center;
}
body:not(.is-menu-open):not(.is-expanded) .info,
body:not(.is-menu-open):not(.is-expanded) .side-col { display: none; }
body:not(.is-menu-open):not(.is-expanded) .bars-btn { width: 52px; height: 52px; }

/* ── Compact utility panel ── */
body.is-menu-open .container {
  border-radius: 24px;
  padding: 12px 13px;
}
body.is-menu-open .main-row {
  flex-direction: row;
  height: auto;
  justify-content: initial;
  gap: 9px;
}
body.is-menu-open .bars-btn { width: 48px; height: 48px; }
body.is-menu-open .info { display: flex; flex: 1; width: auto; }
body.is-menu-open .status-row { justify-content: initial; }
body.is-menu-open .mid-row { justify-content: initial; width: auto; gap: 5px; }
body.is-menu-open #wave { width: 48px; height: 20px; }
body.is-menu-open .text { max-width: 88px; }
body.is-menu-open .side-col { display: flex; flex-direction: row; width: auto; gap: 4px; }
body.is-menu-open .side-row { display: contents; }
body.is-menu-open .btn { width: 25px; height: 25px; }

/* ── Hamburger menu: menu-only surface, never the old overlay layout ── */
.menu-panel {
  display: none;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  padding: 28px 8px 8px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 18px;
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.2);
  -webkit-app-region: drag;
}
body.is-menu-open .container {
  padding: 0;
  border-radius: 0;
  overflow: visible;
}
body.is-menu-open .main-row {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  justify-content: flex-end;
  width: 100%;
  height: 100%;
  padding-top: 15px;
  padding-right: 8px;
  position: relative;
  z-index: 3;
}
body.is-menu-open .info,
body.is-menu-open .side-col { display: none; }
body.is-menu-open .bars-btn { width: 54px; height: 54px; }
body.is-menu-open .menu-panel {
  display: flex;
  position: absolute;
  top: 6px;
  left: 0;
  width: 210px;
  height: calc(100% - 12px);
  padding: 10px;
  z-index: 5;
  animation: menuSeparate 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes menuSeparate {
  from { opacity: 0; transform: translateX(14px) scale(0.96); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}
body.is-menu-closing .menu-panel {
  animation: menuCollapse 1.2s cubic-bezier(0.4, 0, 0.2, 1) both;
  pointer-events: none;
}
@keyframes menuCollapse {
  from { opacity: 1; transform: translateX(0) scale(1); }
  to { opacity: 0; transform: translateX(14px) scale(0.96); }
}
body.is-menu-open .menu-toggle { top: 6px; right: 1px; }
.menu-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 32px;
  padding: 0 10px;
  border-radius: 9px;
  background: transparent;
  color: #1e293b;
  font: 500 12px/1 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  letter-spacing: 0.01em;
  text-align: left;
  -webkit-app-region: no-drag;
  transition: background 0.15s ease, color 0.15s ease;
}
.menu-item:hover { background: #f1f5f9; color: #0f172a; }
.menu-item:active { background: #e2e8f0; }
.menu-item b { color: #94a3b8; font-size: 18px; font-weight: 400; line-height: 0.7; }
body.is-menu-open .voice-menu {
  right: 8px;
  bottom: 8px;
  background: #ffffff;
  border-color: #e2e8f0;
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.2);
}
body.is-menu-open .voice-menu-head { color: #64748b; }
body.is-menu-open .voice-menu button { color: #334155; }
body.is-menu-open .voice-menu button:hover { background: #f1f5f9; color: #0f172a; }
</style></head>
<body>
<div class="container">
  <button id="menu-btn" class="menu-toggle" title="Open voice controls" aria-label="Open voice controls" aria-expanded="false">
    <i></i><i></i><i></i>
  </button>
  <div id="menu-panel" class="menu-panel" aria-hidden="true">
    <button id="menu-close" class="menu-item" type="button">
      <span>Close Overlay</span><b>×</b>
    </button>
    <button id="menu-voice" class="menu-item" type="button">
      <span>Change Voice</span><b>›</b>
    </button>
    <button id="menu-detail" class="menu-item" type="button">
      <span>Detail</span><b>›</b>
    </button>
  </div>
  <div class="main-row">
    <div class="grip"><span></span><span></span><span></span></div>

    <!-- Live bars: the voice toggle -->
    <button id="mic-btn" class="bars-btn" title="Unmute">
      <span class="orb-ripple"></span>
      <span class="orb-ripple r2"></span>
      <span class="bars" id="bars-icon"><i></i><i></i><i></i><i></i></span>
    </button>

    <div class="info">
      <div class="status-row">
        <span id="dot" class="pip idle"></span>
        <span id="label" class="label">Voice</span>
        <span class="ellipsis"><i></i><i></i><i></i></span>
        <div class="stages" id="stages">
          <span class="stage" data-s="listening" title="Listening"></span>
          <span class="stage" data-s="thinking" title="Thinking"></span>
          <span class="stage" data-s="speaking" title="Answering"></span>
        </div>
      </div>
      <div class="mid-row" id="replay-area" title="Click to replay last answer">
        <canvas id="wave" width="80" height="24"></canvas>
        <div class="text-wrap">
          <div id="voice-text" class="text">Ctrl+G to toggle</div>
        </div>
        <span id="hint" class="hint" style="display:none">· auto-sends</span>
      </div>
    </div>

    <div class="side-col">
      <div class="side-row">
        <button id="send-btn" class="btn send-btn" title="Send now" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
        <button id="close-btn" class="btn close-btn" title="Close overlay">✕</button>
      </div>
      <button id="voice-btn" class="btn" title="Change voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H2v6h4l5 4V5Z"></path>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
      </button>
      <button id="expand-btn" class="btn expand-btn" title="Show live process">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </div>
  </div>
  <div id="voice-menu" class="voice-menu" style="display:none"></div>

  <div class="feed-wrap" id="feed-wrap" style="display:none">
    <div class="feed-head">
      <span class="feed-live"><i></i>LIVE PROCESS</span>
      <span id="feed-status" class="feed-status">idle</span>
    </div>
    <div id="feed" class="feed"></div>
  </div>

  <div class="scan"></div>
</div>
<script>
(function () {
  'use strict';

  const API = 'http://127.0.0.1:' + ((window.voiceBridge && window.voiceBridge.getStarkPort) ? window.voiceBridge.getStarkPort() : '8123');
  const $ = (id) => document.getElementById(id);
  const dot = $('dot'), label = $('label'), textEl = $('voice-text');
  const micBtn = $('mic-btn');
  const menuBtn = $('menu-btn');
  const menuPanel = $('menu-panel');
  const menuClose = $('menu-close');
  const menuVoice = $('menu-voice');
  const menuDetail = $('menu-detail');
  const closeBtn = $('close-btn');
  const wave = $('wave'), wctx = wave.getContext('2d');
  const hintEl = $('hint');
  const sendBtn = $('send-btn');
  const voiceBtn = $('voice-btn');
  const voiceMenu = $('voice-menu');
  const replayArea = $('replay-area');
  const barsEl = $('bars-icon');
  const barEls = barsEl ? barsEl.children : null;
  const expandBtn = $('expand-btn');
  const feedWrap = $('feed-wrap');
  const feed = $('feed');
  const feedStatus = $('feed-status');

  const bridge = window.voiceBridge || null;
  function send(type, payload) { if (bridge) bridge.sendEvent(Object.assign({ type: type }, payload || {})); }

  const VOICES = [
    { id: 'jarvis', name: 'JARVIS — cloned', lang: 'en' },
    { id: 'alba', name: 'Alba — female', lang: 'en' },
    { id: 'anna', name: 'Anna — female', lang: 'en' },
    { id: 'vera', name: 'Vera — female', lang: 'en' },
    { id: 'michael', name: 'Michael — male', lang: 'en' },
    { id: 'charles', name: 'Charles — male', lang: 'en' },
  ];
  let voice = localStorage.getItem('voice.voice') || 'jarvis';
  let voiceId = localStorage.getItem('voice.idVoice') || 'jarvis';
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Rough Indonesian vs English detection (Indonesian stopwords)
  const ID_WORDS = [
    'yang', 'di', 'ke', 'dari', 'dengan', 'untuk', 'saya', 'kamu', 'anda', 'ini', 'itu',
    'ada', 'tidak', 'apa', 'mengapa', 'bagaimana', 'sudah', 'akan', 'bisa', 'aku', 'kami',
    'mereka', 'kita', 'jangan', 'harus', 'mau', 'ingin', 'tolong', 'coba', 'pakai', 'buat',
    'kalau', 'karena', 'tetapi', 'juga', 'saja', 'perlu', 'belum', 'ya', 'iya', 'kenapa',
    'kapan', 'mana', 'yaitu', 'yakni', 'seperti', 'dalam', 'pada', 'oleh', 'atau', 'dan',
    'agar', 'supaya', 'boleh', 'bantu', 'tentang', 'gimana', 'nggak', 'gak',
  ];
  function detectLanguage(text) {
    const words = text.toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(Boolean);
    if (!words.length) return 'en';
    let count = 0;
    for (const w of words) if (ID_WORDS.indexOf(w) !== -1) count++;
    return count / words.length > 0.12 ? 'id' : 'en';
  }
  function voiceForLanguage(lang) { return lang === 'id' ? voiceId : voice; }

  let micOn = false;
  let speaking = false;
  let incrementalTtsBuffer = '';  // Phase 8-V6: accumulated reply → one gapless speakStreamed
  let ttsHeldUntil = 0;         // Phase 8-V1: sentence-settle debounce timestamp
  let thinking = false;
  let accumulated = '';
  let lastReply = '';
  let stream = null;
  let audioCtx = null;
  let analyser = null;
  let freqBuf = null;
  let levelBuf = null;
  let roundTimer = null;
  let roundRunning = false;
  let abortRef = null;
  let lastSpeechAt = 0;        // global: last time speech was heard (any round)
  let lastLang = '';           // 'id' | 'en' — STT language hint
  let sending = false;         // polish+send in flight guard
  let roundHasSpeech = false;  // current round captured speech
  let mutePendingSend = false; // hardware-mute pressed while a speech round runs
  let chatId = localStorage.getItem('voice.chatId') || '';
  let chatLock = null;

  const audio = new Audio();
  audio.volume = 1.0;

  // ── Status & live visuals ──
  let waveMode = 'idle';
  let animId = null;
  const fakeBars = [];

  function refreshMarquee() {
    const wrap = textEl.parentElement;
    const overflow = textEl.scrollWidth > wrap.clientWidth;
    textEl.classList.toggle('marquee', overflow);
    if (overflow) textEl.style.setProperty('--tx', -(textEl.scrollWidth - wrap.clientWidth) + 'px');
  }

  function startWave(mode) {
    waveMode = mode === 'processing' ? 'thinking' : mode;
    if (mode === 'speaking') fakeBars.length = 0;
    wave.classList.remove('fade-in');
    void wave.offsetWidth;
    wave.classList.add('fade-in');
    if (!animId) drawWave();
  }

  // Live equalizer bars — heights follow the actual voice level
  function updateBars() {
    if (!barEls) return;
    let heights;
    if (waveMode === 'listening' && analyser && freqBuf) {
      analyser.getByteFrequencyData(freqBuf);
      let rms = 0;
      if (levelBuf) {
        analyser.getByteTimeDomainData(levelBuf);
        for (let i = 0; i < levelBuf.length; i++) {
          const sample = (levelBuf[i] - 128) / 128;
          rms += sample * sample;
        }
        rms = Math.sqrt(rms / levelBuf.length);
      }
      // Use real microphone energy as the main driver. The frequency bins
      // only add a little variation between bars, so quiet input stays quiet
      // and a louder voice visibly lifts the whole group.
      const loudness = Math.min(1, rms * 9);
      heights = [0, 1, 2, 3].map((i) => {
        const v = freqBuf[Math.floor((i / 4) * freqBuf.length * 0.6)] / 255;
        const variation = 0.58 + v * 0.42;
        return 4 + loudness * variation * 21;
      });
    } else if (waveMode === 'thinking') {
      const t = Date.now() / 190;
      heights = [0, 1, 2, 3].map((i) => 5 + Math.abs(Math.sin(t + i * 1.1)) * 17);
    } else if (waveMode === 'speaking') {
      heights = [0, 1, 2, 3].map((i) => {
        if (!fakeBars[20 + i]) fakeBars[20 + i] = 0.3;
        fakeBars[20 + i] += (Math.random() - 0.5) * 0.5;
        fakeBars[20 + i] = Math.min(1, Math.max(0.15, fakeBars[20 + i]));
        fakeBars[20 + i] *= 0.9;
        return 4 + fakeBars[20 + i] * 19;
      });
    } else {
      heights = [9, 7, 8, 7];
    }
    for (let i = 0; i < barEls.length && i < 4; i++) {
      barEls[i].style.height = heights[i].toFixed(1) + 'px';
    }
  }

  function drawWave() {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    updateBars();
    const W = wave.width, H = wave.height;
    wctx.clearRect(0, 0, W, H);
    const bars = 20;
    const bw = W / bars;

    const base = waveMode === 'listening' ? '159,193,240'
      : waveMode === 'thinking' ? '195,179,232'
      : waveMode === 'speaking' ? '155,225,230'
      : '148,163,184';
    const grad = wctx.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0, 'rgba(' + base + ',0.2)');
    grad.addColorStop(0.5, 'rgba(' + base + ',0.65)');
    grad.addColorStop(1, 'rgba(' + base + ',0.2)');
    wctx.fillStyle = grad;

    const half = Math.ceil(bars / 2);
    for (let i = 0; i < half; i++) {
      let h = 0.06;
      if (waveMode === 'listening' && analyser && freqBuf) {
        analyser.getByteFrequencyData(freqBuf);
        const v = freqBuf[Math.floor((i / half) * freqBuf.length * 0.55)] / 255;
        h = Math.max(0.07, v * v);
      } else if (waveMode === 'thinking') {
        h = Math.max(0.09, Math.abs(Math.sin(Date.now() / 250 + i * 0.55)) * 0.9);
      } else if (waveMode === 'speaking') {
        if (!fakeBars[i]) fakeBars[i] = 0.12;
        fakeBars[i] += (Math.random() - 0.5) * 0.55;
        fakeBars[i] = Math.min(1, Math.max(0.07, fakeBars[i]));
        fakeBars[i] *= 0.92;
        h = fakeBars[i];
      }
      const bh = Math.max(3, h * (H - 4));
      const x = i * bw + 1;
      const w = Math.max(1.5, bw - 2.5);
      wctx.beginPath();
      wctx.roundRect(x, (H - bh) / 2, w, bh, 1.5);
      wctx.fill();
      if (i < bars / 2 - 1 || bars % 2 === 0) {
        const xm = W - x - w;
        wctx.beginPath();
        wctx.roundRect(xm, (H - bh) / 2, w, bh, 1.5);
        wctx.fill();
      }
    }
    // Phase 8-V6: idle CPU guard — pause the animation loop when nothing is
    // listening/speaking/thinking so the renderer doesn't burn CPU on
    // requestAnimationFrame repaints (was 60fps even idle → competed with
    // TTS decode → choppy).
    if (micOn || speaking || thinking || waveMode === 'listening' || waveMode === 'speaking' || waveMode === 'thinking') {
      animId = requestAnimationFrame(drawWave);
    } else {
      animId = null;
    }
  }

  function setStatus(s, extraText) {
    const cls = s === 'listening' ? 'listening' : s === 'thinking' ? 'thinking' : s === 'processing' ? 'processing' : s === 'speaking' ? 'speaking' : s === 'muted' ? 'muted' : s === 'error' ? 'error' : 'idle';
    dot.className = 'pip ' + cls;
    const map = { idle: 'Voice', muted: 'Muted', listening: 'Listening', thinking: 'Thinking', processing: 'Preparing voice', speaking: 'Answering', error: 'Error' };
    label.textContent = map[s] || s;
    label.classList.remove('swap');
    void label.offsetWidth;
    label.classList.add('swap');
    if (extraText !== undefined) textEl.textContent = extraText;
    document.body.className = 'state-' + cls;
    micBtn.className = 'bars-btn' + (micOn ? ' on' : '');
    const stageKey = { listening: 'listening', thinking: 'thinking', processing: 'thinking', speaking: 'speaking' }[s];
    document.querySelectorAll('.stage').forEach((el) => el.classList.toggle('on', el.dataset.s === stageKey));
    startWave(s === 'muted' || s === 'idle' ? 'idle' : s);
    if (extraText !== undefined) requestAnimationFrame(refreshMarquee);
    send('status', { status: s, text: textEl.textContent });
  }

  function updateMicBtn() {
    micBtn.classList.toggle('on', micOn);
    micBtn.title = micOn ? 'Mute' : 'Unmute';
  }

  function showHint() { hintEl.style.display = ''; sendBtn.style.display = ''; }
  function hideHint() { hintEl.style.display = 'none'; sendBtn.style.display = 'none'; }

  // Parse STT JSON defensively (handles both {text} and legacy [{text}, status] shapes)
  function extractTranscript(data) {
    if (!data) return '';
    if (typeof data.text === 'string') return data.text.trim();
    if (Array.isArray(data) && data[0] && typeof data[0].text === 'string') return data[0].text.trim();
    if (data.error) throw new Error(String(data.error));
    return '';
  }

  // ── Capture config — TurnDetection (portable, mirrors pydantic TurnDetection) ──
  // Backend is source of truth at /api/turn_detection; defaults below are fallbacks.
  let turnDetection = {
    sensitivity: 'medium',
    prefix_padding_ms: 300,
    silence_duration_ms: 300,
    sound_level: 0.01,
    min_round_ms: 250,
    max_round_ms: 30000,
  };
  // Convenience aliases (kept for existing code paths).
  let SEND_SILENCE_MS = turnDetection.silence_duration_ms;
  let MAX_ROUND_MS = turnDetection.max_round_ms;
  const RUN_TIMEOUT_MS = 300000; // Phase 8-V5: run watchdog raised to 5min — long agent runs must not be killed early
  let MIN_ROUND_MS = turnDetection.min_round_ms;
  let SOUND_LEVEL = turnDetection.sound_level;
  fetch(API + '/api/turn_detection').then((r) => r.json()).then((cfg) => {
    if (cfg && typeof cfg.silence_duration_ms === 'number') {
      turnDetection = cfg;
      SEND_SILENCE_MS = cfg.silence_duration_ms;
      MIN_ROUND_MS = cfg.min_round_ms;
      MAX_ROUND_MS = cfg.max_round_ms;
      SOUND_LEVEL = cfg.sound_level;
    }
  }).catch(() => {});

  // Whisper's classic silence/noise hallucinations — never send these
  const HALLUCINATIONS = [
    /^thank\s+you[\s.,!?]*$/i,
    /^thank\s+you\s+(so|very)\s+much[\s.,!?]*$/i,
    /^thanks[\s.,!?]*$/i,
    /^thanks?\s+for\s+(watching|listening|your\s+time|the\s+video)[\s.,!?]*$/i,
    /^thank\s+you\s+for\s+(watching|listening|your\s+time|the\s+video)[\s.,!?]*$/i,
    /^you'?re\s+welcome[\s.,!?]*$/i,
    /^you\s+are\s+welcome[\s.,!?]*$/i,
    /^please\s+subscribe[\s.,!?]*$/i,
    /^subscribe\s+to\s+my\s+channel[\s.,!?]*$/i,
    /^(goodbye|bye|good\s+night|good\s+evening)[\s.,!?]*$/i,
  ];
  const GARBAGE_RE = /^(you|the|a|an|and|so|oh|um|uh|uhh|yeah|ok|okay|like|hmm|mhm|well|no)$/i;

  function isGarbage(t) {
    const s = (t || '').trim();
    if (!s) return false;
    if (/^[\s.,!?…·\-–—]+$/.test(s)) return true;
    if (HALLUCINATIONS.some((re) => re.test(s))) return true;
    if (GARBAGE_RE.test(s)) return true;
    return false;
  }

  // Local rule-based transcript cleanup — replaces the free-LLM /api/cleanup
  // round trip (which cost 3-15s per voice turn). Pure JS, zero network.
  const FILLER_RE = /\b(um+|uh+|uhh+|hmm+|erm+|er+|like)\b/gi;
  const REPEAT_RE = /\b(\w+)(\s+\1){2,}\b/gi;
  function cleanTranscript(raw) {
    let t = (raw || '').trim();
    if (!t) return t;
    t = t.replace(FILLER_RE, ' ').replace(REPEAT_RE, '$1').replace(/\s{2,}/g, ' ').trim();
    t = t.replace(/([.!?…])\s*([a-z])/g, (_, p, c) => p + ' ' + c.toUpperCase());
    t = t.replace(/^\s*([a-z])/, (c) => c.toUpperCase());
    return t;
  }

  // Polish (rule-based) then send to the pipeline
  async function sendText(raw) {
    const text = cleanTranscript(raw);
    if (!text || sending) return;
    sending = true;
    try {
      setStatus('thinking');
      const final = text;
      if (final !== raw) {
        textEl.textContent = final;
        send('transcript', { text: final });
      }
      sendToPipeline(final);
    } finally {
      sending = false;
    }
  }

  // Laptop hardware mute → instant send (your main workflow)
  function onTrackMuted() {
    if (!micOn) return;
    if (roundHasSpeech) {
      mutePendingSend = true; // send once the current round's speech is captured + transcribed
      return;
    }
    const text = accumulated.trim();
    if (text) {
      accumulated = '';
      hideHint();
      sendText(text);
    }
  }

  // ── Capture: server-side streaming STT (no MediaRecorder, no webm, no ffmpeg)
  // The browser keeps the mic ONLY for VAD/barge-in (analyser); actual audio
  // goes through /api/voice/start → Moonshine streaming → /api/voice/peek
  // (live transcript while talking) → /api/voice/send (final + wav for MiMo).
  let recTimer = null;

  function startRound() {
    if (!micOn || roundRunning) return;
    roundRunning = true;
    oneRound()
      .catch((e) => console.error('[Voice] round error', e))
      .finally(() => {
        roundRunning = false;
        if (micOn) roundTimer = setTimeout(startRound, 60);
      });
  }

  async function transcribeBlob(blob) {
    // Fallback path kept for non-audio modes when server capture fails.
    try {
      const fd = new FormData();
      fd.append('file', blob, 'round.webm');
      const resp = await fetch(API + '/api/transcribe', { method: 'POST', body: fd });
      const data = await resp.json();
      if (!resp.ok || (data && data.error)) {
        if (resp.status !== 422) {
          setStatus('error', String((data && data.error) || ('HTTP ' + resp.status)).slice(0, 400));
          await sleep(1500);
        }
        return '';
      }
      return extractTranscript(data);
    } catch (e) {
      console.error('[Voice] STT failed', e);
      return '';
    }
  }

  async function oneRound() {
    if (!stream || !micOn) return;
    const buf = analyser ? new Uint8Array(analyser.fftSize) : null;
    roundHasSpeech = false;
    let lastSoundAt = Date.now();
    const startedAt = Date.now();
    let lastPeekText = '';

    // Live transcript: poll /api/voice/peek so the user sees words appear
    // as they speak (the "streaming input" feel).
    let captureSelfHealAt = 0;
    const peekTimer = setInterval(async () => {
      try {
        const r = await fetch(API + '/api/voice/peek');
        const d = await r.json();
        if (d && d.active === false) {
          // Server capture died (server restarted / watchdog stopped it) —
          // restart it so live input keeps working. Self-heal max 1x/2s.
          const now = Date.now();
          if (now > captureSelfHealAt) {
            captureSelfHealAt = now + 2000;
            fetch(API + '/api/voice/start', { method: 'POST' }).catch(() => {});
            console.log('[Voice] capture inactive — restarting');
          }
        }
        if (d && d.text && d.text !== lastPeekText) {
          lastPeekText = d.text;
          accumulated = d.text;
          setStatus('listening', d.text);
          send('transcript', { text: d.text });
          showHint();
        }
      } catch (_e) { /* ignore */ }
    }, 300);

    const monitor = setInterval(() => {
      let level = 0;
      if (analyser && buf) {
        analyser.getByteTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += Math.abs(buf[i] - 128) / 128;
        level = sum / buf.length;
      }
      if (level > SOUND_LEVEL) {
        lastSoundAt = Date.now();
        lastSpeechAt = Date.now();
        roundHasSpeech = true;
        // Barge-in ChatGPT-style: voice while TTS speaking stops audio immediately
        if (speaking) {
          stopSpeaking();
          setStatus('listening', accumulated || 'Listening');
        }
        // Note: while LLM is thinking, don't abort on VAD — new speech will be
        // steered as incremental context (see finishRound steering). Hard
        // interrupt (abort) only when TTS is speaking.
      }
      const elapsed = Date.now() - startedAt;
      // End the round after 2.5s of quiet, or after the hard cap
      if (elapsed >= MAX_ROUND_MS || (elapsed >= MIN_ROUND_MS && Date.now() - lastSoundAt >= SEND_SILENCE_MS)) {
        clearInterval(monitor);
        clearInterval(peekTimer);
        finishRound();
      }
    }, 200);

    async function finishRound() {
      // No speech detected by browser VAD → still flush server capture
      // (it may have heard something the browser meter missed).
      let t = '';
      try {
        const r = await fetch(API + '/api/voice/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({}),
        });
        const d = await r.json();
        if (!r.ok || (d && d.error)) {
          if (r.status !== 422) setStatus('error', String((d && d.error) || ('HTTP ' + r.status)).slice(0, 400));
        } else {
          t = d.text || '';
        }
      } catch (e) {
        console.error('[Voice] send failed', e);
      }
      if (isGarbage(t)) t = '';

      if (t) {
        accumulated = t;
        lastLang = detectLanguage(accumulated);
        setStatus('listening', accumulated);
        showHint();
        send('transcript', { text: accumulated });
      }

      // Mute pressed during this speech round → send now
      if (mutePendingSend) {
        mutePendingSend = false;
        const text = accumulated.trim();
        if (text) { accumulated = ''; hideHint(); sendText(text); }
        return;
      }

      // Hands-free auto-send: if idle, start new LLM run; if LLM already
      // thinking, stream as steering (ChatGPT live) so breath+continue works.
      const pending = accumulated.trim();
      if (pending && !sending) {
        if (thinking) {
          // Stream incremental words to the running LLM + show immediately in chat
          const delta = pending;
          accumulated = '';
          hideHint();
          // Show in chat bubble immediately (transcript already did, but ensure)
          send('transcript', { text: delta });
          // Steer the running run — LLM will see it next iteration
          if (chatId) {
            fetch(API + '/api/steer', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ chat_id: chatId, message: delta })}).catch(()=>{});
          }
        } else {
          // No active run — wait tiny debounce then start one (0.3s silence already, so 100ms extra is enough)
          await sleep(100);
          const text2 = accumulated.trim();
          if (text2 && !sending && !thinking) {
            accumulated = '';
            hideHint();
            sendText(text2);
          }
        }
      }
    }
  }

  // ── Chat resolution ──
  // The main window tells us which chat is active (project or general), so
  // live mode follows the open chat. Fallback: resolve the general workspace.
  let voiceWsId = localStorage.getItem('voice.wsId') || '';
  let voiceWsPath = localStorage.getItem('voice.wsPath');
  let wsResolvedBy = ''; // 'ipc' | 'fallback' | ''
  // Phase 8-V5: use the app's selected model/temperature for voice runs.
  let voiceModel = 'Automatic Fallback';
  let voiceTemp = 0.7;

  if (bridge && bridge.onSetChat) {
    bridge.onSetChat((info) => {
      if (info && info.chatId) {
        voiceWsId = info.wsId || '';
        voiceWsPath = (info.wsPath !== undefined && info.wsPath !== null) ? info.wsPath : '';
        chatId = info.chatId;
        chatLock = null;
        wsResolvedBy = 'ipc';
        if (info.model) voiceModel = info.model;
        if (typeof info.temperature === 'number') voiceTemp = info.temperature;
        localStorage.setItem('voice.wsId', voiceWsId);
        localStorage.setItem('voice.wsPath', voiceWsPath);
        localStorage.setItem('voice.chatId', chatId);
      }
    });
  }

  function ensureChat() {
    if (chatLock) return chatLock;
    chatLock = (async () => {
      // 1) Known chat (IPC-synced or stored) — but VERIFY it still exists.
      //    Stale chat ids silently drop messages on the backend.
      if (chatId && voiceWsId) {
        try {
          const check = await fetch(API + '/api/workspaces/' + encodeURIComponent(voiceWsId) + '/chats/' + encodeURIComponent(chatId));
          if (check.ok) return chatId;
        } catch (_e) { /* fall through */ }
      }
      // 2) Fresh resolution: the ACTIVE workspace synced from the main window
      //    (voiceWsId already set by onSetChat) or the General workspace.
      //    NEVER pick _house for a general chat — that leaks the house agent.
      let ws = null;
      const wsRes = await fetch(API + '/api/workspaces');
      const wsData = await wsRes.json();
      const all = wsData.workspaces || [];
      if (voiceWsId) ws = all.find((w) => w.id === voiceWsId) || null;
      if (!ws) ws = all.find((w) => w.isGeneral) || null;
      if (!ws) ws = all[0] || null;
      if (!ws) throw new Error('No workspace available');
      voiceWsId = ws.id;
      voiceWsPath = ws.path || '';
      wsResolvedBy = 'fallback';
      localStorage.setItem('voice.wsId', voiceWsId);
      localStorage.setItem('voice.wsPath', voiceWsPath);
      const chatsRes = await fetch(API + '/api/workspaces/' + ws.id + '/chats');
      const chatsData = await chatsRes.json();
      if (chatsData.chats && chatsData.chats.length) {
        chatId = chatsData.chats[0].id;
      } else {
        const createRes = await fetch(API + '/api/workspaces/' + ws.id + '/chats', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: 'Voice Chat' }),
        });
        chatId = (await createRes.json()).id;
      }
      localStorage.setItem('voice.chatId', chatId);
      return chatId;
    })();
    return chatLock;
  }

  // Save the agent reply to the chat so it lands in history + memory context
  async function persistReply(chat, reply) {
    if (!voiceWsId || !chat || !reply) return;
    try {
      await fetch(API + '/api/workspaces/' + voiceWsId + '/chats/' + chat + '/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: 'agent', content: reply }),
      });
    } catch (e) {
      console.error('[Voice] failed to persist reply', e);
    }
    // Phase 8-V2 fix: ALWAYS tell the main window the reply landed — the
    // chat must refresh in real time (navigating away/back was the only
    // way to see it before because the per-sentence TTS path never sent
    // the `reply` event).
    send('reply', { text: reply.slice(0, 500) });
  }

  function progressFromState(s) {
    const th = s.thoughts || {};
    const thought = th.developer || th.supervisor;
    if (thought && thought.trim()) return thought.trim().slice(0, 90);
    const log = s.live_terminal_log || '';
    const lines = log.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!lines.length) return '';
    const last = lines[lines.length - 1].replace(/^\[[^\]]*\]\s*/, '').replace(/^\s*[═─=]*\s*$/, '').trim();
    return (last || 'Working…').slice(0, 90);
  }

  // Pull the real failure reason from the run so the overlay shows something useful
  function extractRunError(state, reason) {
    const log = (state && state.live_terminal_log) || '';
    const m = log.match(/Insufficient balance[^\n"]*/i)
      || log.match(/All DeepSeek models exhausted[^\n"]*/i)
      || log.match(/Error code: \d+[^\n"]*/i)
      || log.match(/\[ORCHESTRATOR ERROR\][^\n"]*/i);
    if (m) return m[0].slice(0, 90);
    return (reason || 'Run failed').slice(0, 90);
  }

  // ── Live process feed (thinking / subagents / tools, like the main chat) ──
  const FEED_MAX = 300;
  let expanded = false;
  let menuOpen = false;
  let menuClosing = false;
  let menuClosingTimer = null;
  let lastLogLen = 0;

  function resizeOverlay() {
    const menuVisible = menuOpen || menuClosing;
    const w = expanded ? 400 : menuVisible ? 286 : 84;
    const h = expanded ? 344 : menuVisible ? 140 : 84;
    if (bridge && bridge.resize) bridge.resize(w, h);
  }

  function finishMenuClose() {
    if (menuOpen) return;
    menuClosing = false;
    document.body.classList.remove('is-menu-open', 'is-menu-closing');
    menuPanel.setAttribute('aria-hidden', 'true');
    resizeOverlay();
  }

  function setMenuOpen(on) {
    if (on) {
      clearTimeout(menuClosingTimer);
      menuClosingTimer = null;
      menuOpen = true;
      menuClosing = false;
      expanded = false;
      expandBtn.classList.remove('expanded');
      feedWrap.style.display = 'none';
      document.body.classList.remove('is-expanded');
      document.body.classList.add('is-menu-open');
      document.body.classList.remove('is-menu-closing');
      menuPanel.setAttribute('aria-hidden', 'false');
    } else {
      if (!menuOpen && !menuClosing) return;
      menuOpen = false;
      menuClosing = true;
      document.body.classList.add('is-menu-open', 'is-menu-closing');
      menuPanel.setAttribute('aria-hidden', 'false');
      clearTimeout(menuClosingTimer);
      menuClosingTimer = setTimeout(finishMenuClose, 1220);
    }
    menuBtn.classList.toggle('active', on);
    menuBtn.setAttribute('aria-expanded', String(on));
    menuBtn.title = on ? 'Close voice controls' : 'Open voice controls';
    resizeOverlay();
  }

  function setExpanded(on) {
    expanded = on;
    if (on) {
      clearTimeout(menuClosingTimer);
      menuClosingTimer = null;
      menuOpen = false;
      menuClosing = false;
      menuBtn.classList.remove('active');
      menuBtn.setAttribute('aria-expanded', 'false');
      menuBtn.title = 'Open voice controls';
      document.body.classList.remove('is-menu-open', 'is-menu-closing');
      menuPanel.setAttribute('aria-hidden', 'true');
    }
    expandBtn.classList.toggle('expanded', on);
    document.body.classList.toggle('is-expanded', on);
    feedWrap.style.display = on ? '' : 'none';
    resizeOverlay();
  }

  function feedLine(text, kind) {
    if (!feed) return;
    const div = document.createElement('div');
    div.className = 'feed-line ' + (kind || 'meta');
    div.textContent = text;
    feed.appendChild(div);
    while (feed.children.length > FEED_MAX) feed.removeChild(feed.firstChild);
    feed.scrollTop = feed.scrollHeight;
  }

  function classifyLine(line) {
    const t = line.trim();
    if (!t) return null;
    if (/^\[>\]\s*User:|^You:/.test(t)) return 'user';
    if (/^\[THOUGHT\]|^Thought:/.test(t)) return 'thought';
    if (/^\[[^\]]*\]\s*$/.test(t)) return 'meta';
    if (/ORCHESTRATOR|SUBAGENT|SUPERVISOR|Delegat|Delegating|task\(/i.test(t)) return 'agent';
    if (/→|Tool:|\[TOOL|tool_|execute|run_command|write_file|edit_file|search/i.test(t)) return 'tool';
    if (/error|failed|insufficient|traceback|exception/i.test(t)) return 'error';
    if (/^[\s═─=·]+$/.test(t)) return null;
    return 'meta';
  }

  function appendFeedFromState(state) {
    const log = (state && state.live_terminal_log) || '';
    if (!log || log.length <= lastLogLen) return;
    const fresh = log.slice(lastLogLen);
    lastLogLen = log.length;
    fresh.split('\n').forEach((line) => {
      const kind = classifyLine(line);
      if (kind) feedLine(line, kind);
    });
  }

  function feedMsg(text, kind) {
    feedLine(text, kind || 'meta');
    feedStatus.textContent = kind === 'error' ? 'error' : '…';
  }

  // Shared SSE consumption for /api/run — used by the text path
  // (sendToPipeline). Handles state
  // frames, live feed, progress, pipeline-done, reply, TTS speaking, errors.
  // Returns true when the reply was spoken / handled; false on transport error.
  async function consumeRunStream(resp, chat, userText) {
    let lastState = null;
    let failed = false;
    let failReason = '';
    let streamReplyText = '';
    let spokenUpTo = 0;
    let incrementalMuted = false;
    // Helper for true streaming: accumulate completed sentences into a single
    // gapless buffer spoken once at the end (harness-style single stream).
    // Phase 8-V6: one /api/tts/stream call per reply — no concurrent TTS.
    // scheduled back-to-back), so the user hears the FIRST sentence while the
    // agent is still working on the rest — no more "silence until done".
    function maybeSpeakIncremental(forceFlush = false) {
      if (!streamReplyText || spokenUpTo >= streamReplyText.length) return;
      const now = Date.now();
      const unsent = streamReplyText.slice(spokenUpTo);
      // Find sentence boundary: ". ", "! ", "? " or end
      let boundary = -1;
      const m = unsent.match(/[.!?]\s/);
      if (m && m.index !== undefined) boundary = m.index + 1; // include punctuation
      else if (forceFlush && unsent.trim().length > 0) boundary = unsent.length;
      else if (unsent.length > 180) {
        const sp = unsent.lastIndexOf(' ', 150);
        boundary = sp > 40 ? sp : 150;
      }
      // Hold the boundary briefly so mid-sentence pauses don't split a word.
      if (boundary !== -1 && !forceFlush) {
        const hold = 350; // ms — enough for normal inter-word pauses, short enough to feel live
        if (now - ttsHeldUntil > 0 && boundary < unsent.length - 2) {
          // Only speak if the sentence is "settled" — we haven't seen new text
          // for `hold` ms OR the boundary is followed by substantial content.
          ttsHeldUntil = now;
        }
      }
      if (boundary === -1) return;
      const sentence = unsent.slice(0, boundary).trim();
      if (!sentence) { spokenUpTo += boundary + 1; return; }
      const clean = cleanForTTS(sentence);
      if (!clean || clean.length < 3) { spokenUpTo += boundary + 1; return; }
      if (isGarbage(clean)) { spokenUpTo += boundary + 1; return; }
      spokenUpTo += boundary + 1;
      while (spokenUpTo < streamReplyText.length && streamReplyText[spokenUpTo] === ' ') spokenUpTo++;
      if (!incrementalMuted) {
        incrementalMuted = true;
        const ctx = ensureTtsCtx();
        if (ctx.state === 'suspended') ctx.resume().catch(()=>{});
        speaking = true;
        setStatus('speaking', clean.slice(0,120));
      }
      // Phase 8-V6: ONE stream per reply — accumulate all sentences, then
      // speak them through a single speakStreamed call (harness-style gapless
      // single buffer). No per-sentence HTTP → no concurrent TTS calls on the
      // (non-thread-safe) model, no choppiness, no CPU spikes.
      if (!incrementalTtsBuffer) incrementalTtsBuffer = '';
      incrementalTtsBuffer += ' ' + clean;
    }
    try {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let pendingEvent = '';
      let evDone = false;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() ?? '';
        for (const line of lines) {
          if (line.startsWith('event: ')) {
            pendingEvent = line.slice(7).trim();
            continue;
          }
          if (!line.startsWith('data: ')) { continue; }
          const evName = pendingEvent;
          pendingEvent = '';
          try {
            const parsed = JSON.parse(line.slice(6).trim());
            if (evName === 'delta') {
              // Live token deltas — docs: bus emits kind "text" vs "reasoning"
              if (parsed && typeof parsed.text === 'string' && parsed.text) {
                if (parsed.kind === 'reasoning') {
                  // Don't speak reasoning, just show as progress
                  textEl.textContent = ('… ' + parsed.text.slice(-100)).slice(-120);
                  requestAnimationFrame(refreshMarquee);
                } else {
                  streamReplyText += parsed.text;
                  textEl.textContent = streamReplyText.slice(-120);
                  requestAnimationFrame(refreshMarquee);
                  send('progress', { text: streamReplyText.slice(-120) });
                  maybeSpeakIncremental(false);
                }
                // Phase 8-V2: forward every delta to the main window so the
                // canonical chat overlay streams tokens live during voice runs.
                send('delta', { kind: parsed.kind || 'text', text: parsed.text, agent: parsed.agent || '' });
              }
              continue;
            }
            if (evName === 'done') {
              if (parsed.error) { failed = true; failReason = String(parsed.error); }
              evDone = true;
              break;
            }
            if (parsed.error) { failed = true; failReason = String(parsed.error); }
            if (parsed.active_node || parsed.live_terminal_log) {
              lastState = parsed;
              send('pipeline-state', { workspaceId: voiceWsId, chatId: chat, state: parsed });
              appendFeedFromState(parsed);
              if (!failed) {
                const prog = progressFromState(parsed);
                if (prog) { textEl.textContent = prog; requestAnimationFrame(refreshMarquee); send('progress', { text: prog }); }
              }
            }
          } catch (_e) { /* skip malformed lines */ }
        }
        if (evDone) break;
      }
      thinking = false;
      send('pipeline-done', {
        workspaceId: voiceWsId,
        chatId: chat,
        state: lastState,
        status: failed ? 'error' : 'complete',
        error: failReason || undefined,
      });
      const reply = ((lastState && lastState.outputs && lastState.outputs.agent_report) || '').trim();
      if (reply) {
        if (feedStatus) feedStatus.textContent = 'answering';
        feedMsg('Assistant: ' + reply.slice(0, 200), 'agent');
        await persistReply(chat, reply);
        if (incrementalMuted || spokenUpTo < streamReplyText.length || incrementalTtsBuffer) {
          // Phase 8-V6: flush the accumulated reply through ONE gapless
          // speakStreamed call (single stream, no concurrent TTS), then wait
          // for it to finish before returning to listening.
          maybeSpeakIncremental(true);
          if (incrementalTtsBuffer && incrementalTtsBuffer.trim()) {
            const buf = incrementalTtsBuffer.trim();
            incrementalTtsBuffer = '';
            const useVoice = voiceForLanguage(detectLanguage(buf));
            const ok = await speakStreamed(buf, useVoice);
            if (!ok) {
              const resp = await fetch(API + '/api/tts', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ text: buf, voice: useVoice, engine: 'pocket' }) });
              if (resp.ok) {
                const blob = await resp.blob();
                const url = URL.createObjectURL(blob);
                audio.src = url;
                await audio.play();
                await new Promise((res) => { audio.onended = res; audio.onpause = () => { if (!speaking) res(); }; });
              }
            }
          }
          speaking = false;
          incrementalMuted = false;
          if (micOn) setStatus('listening', accumulated || 'Listening');
          return true;
        } else {
          // No incremental text was spoken (reply arrived instantly) — full reply
          setStatus('processing', 'Preparing voice…');
          await speak(reply);
          return true;
        }
      }
      if (failed) {
        setStatus('error', extractRunError(lastState, failReason));
        if (feedStatus) feedStatus.textContent = 'error';
        setTimeout(() => { if (micOn) setStatus('listening', accumulated || 'Listening'); }, 3000);
      } else if (lastState) {
        setStatus('error', 'No reply received — check api_out.log');
        if (feedStatus) feedStatus.textContent = 'error';
        setTimeout(() => { if (micOn) setStatus('listening', accumulated || 'Listening'); }, 3000);
      } else {
        setStatus('error', 'Run returned nothing — check api_out.log');
        if (feedStatus) feedStatus.textContent = 'error';
        setTimeout(() => { if (micOn) setStatus('listening', accumulated || 'Listening'); }, 3000);
      }
      return false;
    } catch (e) {
      thinking = false;
      if (e.name === 'AbortError') {
        setStatus('listening', accumulated || 'Listening');
        if (feedStatus) feedStatus.textContent = 'stopped';
        send('pipeline-done', { workspaceId: voiceWsId, chatId: chat, state: lastState, status: 'aborted' });
      } else {
        console.error('[Voice] run failed', e);
        setStatus('error', 'Run failed');
        send('pipeline-done', { workspaceId: voiceWsId, chatId: chat, state: lastState, status: 'error', error: String(e) });
      }
      return false;
    }
  }

  async function sendToPipeline(text) {
    thinking = true;
    setStatus('thinking');
    lastLogLen = 0;
    if (feed) { feed.innerHTML = ''; }
    if (feedStatus) feedStatus.textContent = 'running';
    feedMsg('You: ' + text, 'user');
    let chat;
    try {
      chat = await ensureChat();
    } catch (e) {
      thinking = false;
      setStatus('error', 'Backend unreachable');
      send('pipeline-done', { workspaceId: voiceWsId, chatId: chatId, state: null, status: 'error', error: 'Backend unreachable' });
      setTimeout(() => { if (micOn) setStatus('listening', accumulated || 'Listening'); }, 2500);
      return;
    }
    send('pipeline-start', { workspaceId: voiceWsId, chatId: chat, prompt: text });
    abortRef = new AbortController();
    // Watchdog: if the run stalls (no done frame within RUN_TIMEOUT_MS), bail
    // out of the thinking state so the overlay never hangs forever.
    let runSettled = false;
    const watchdog = setTimeout(() => {
      if (runSettled) return;
      runSettled = true;
      console.error('[Voice] run watchdog timeout — aborting');
      thinking = false;
      if (abortRef) { try { abortRef.abort(); } catch (_e) {} abortRef = null; }
      setStatus('error', 'Run timed out');
      send('pipeline-done', { workspaceId: voiceWsId, chatId: chat, state: null, status: 'timeout', error: 'Run timed out' });
      setTimeout(() => { if (micOn) setStatus('listening', accumulated || 'Listening'); }, 2500);
    }, RUN_TIMEOUT_MS);
    try {
      const resp = await fetch(API + '/api/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt: text,
          model: voiceModel,
          temperature: voiceTemp,
          workspace_path: (voiceWsPath !== null && voiceWsPath !== undefined) ? voiceWsPath : '',
          chat_id: chat,
          attachments: [],
          workspace_kind: voiceWsId === '_house' ? 'house' : (voiceWsId === '_personal' ? 'personal' : 'general'),
        }),
        signal: abortRef.signal,
      });
      await consumeRunStream(resp, chat, text);
    } finally {
      runSettled = true;
      clearTimeout(watchdog);
      abortRef = null;
    }
  }

  // ── Speech playback (TTS via backend Pocket TTS engine) ──
  function cleanForTTS(t) {
    return t
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\[(BUG|TODO|NOTE)[^\]]*\]/gi, ' ')
      .replace(/[#*_>~|]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 800);
  }

  // Gapless TTS state — Web Audio scheduling + barge-in truncation
  let ttsCtx = null;
  let ttsNextTime = 0;
  const ttsSources = new Set();
  let _ttsStartAt = 0; // AudioContext time when current utterance started (for played_ms)

  function ensureTtsCtx() {
    if (!ttsCtx || ttsCtx.state === 'closed') {
      try { ttsCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 }); }
      catch (_e) { ttsCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      ttsNextTime = ttsCtx.currentTime;
    }
    if (ttsCtx.state === 'suspended') ttsCtx.resume().catch(() => {});
    return ttsCtx;
  }

  function _ttsPlayedMs() {
    try {
      if (!_ttsStartAt || !ttsCtx) return 0;
      const ms = Math.max(0, (ttsCtx.currentTime - _ttsStartAt) * 1000);
      return Math.round(ms);
    } catch (_e) { return 0; }
  }

  function stopSpeaking() {
    const wasSpeaking = speaking && ttsSources.size > 0;
    let playedMs = 0;
    if (wasSpeaking) playedMs = _ttsPlayedMs();
    speaking = false;
    incrementalTtsBuffer = '';
    // Stop Web Audio scheduled sources
    for (const s of [...ttsSources]) {
      try { s.stop(); s.disconnect(); } catch (_e) {}
    }
    ttsSources.clear();
    ttsNextTime = 0;
    _ttsStartAt = 0;
    if (ttsCtx && ttsCtx.state === 'suspended') ttsCtx.resume().catch(()=>{});
    audio.pause();
    if (audio.src) { try { URL.revokeObjectURL(audio.src); } catch(_e){} }
    audio.removeAttribute('src');
    try { audio.load(); } catch(_e){}
    // Report truncation to backend so history can carry interrupted_at_ms
    if (wasSpeaking && playedMs > 0) {
      fetch(API + '/api/voice/interrupt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ played_ms: playedMs }),
      }).catch(() => {});
    }
  }

  async function speak(text) {
    const clean = cleanForTTS(text);
    if (!clean) return;
    lastReply = clean;
    speaking = true;
    _ttsStartAt = ensureTtsCtx().currentTime;
    setStatus('processing', 'Preparing voice…');
    const useVoice = voiceForLanguage(detectLanguage(clean));
    // Phase 8-V3: full duplex — the browser mic has AEC on (echoCancellation/
    // noiseSuppression/autoGainControl), so no server mute-while-speaking. The
    // user can talk over the reply and the next round starts instantly.
    try {
      const ok = await speakStreamed(clean, useVoice);
      if (!ok) {
        // fall back to non-streamed (full wav) if streaming fails
        const resp = await fetch(API + '/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: clean, voice: useVoice, engine: 'pocket' }),
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        audio.src = url;
        await audio.play();
        setStatus('speaking', clean.slice(0, 120) + (clean.length > 120 ? '…' : ''));
        await new Promise((res) => {
          audio.onended = res;
          audio.onpause = () => { if (!speaking) res(); };
        });
      }
    } catch (e) {
      console.error('[Voice] TTS failed', e);
      setStatus('error', 'TTS failed');
      setTimeout(() => { if (micOn) setStatus('listening', accumulated || 'Listening'); }, 2500);
    } finally {
      speaking = false;
      fetch(API + '/api/voice/mute', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ muted: false }) }).catch(() => {});
      if (micOn) setStatus('listening', accumulated || 'Listening');
    }
  }

  // Stream TTS chunks (SSE /api/tts/stream) gapless via Web Audio.
  // First audio ~0.2-0.5s; chunks concat without gaps unlike HTMLAudio per-chunk.
  // Pre-buffer lead: schedule first chunk slightly ahead so subsequent chunks
  // have time to decode — eliminates jitter gaps that cause "choppy".
  function speakStreamed(text, useVoice) {
    return new Promise((resolve) => {
      let done = false;
      let streamFailed = false;
      let pendingDecodes = 0;
      let startedScheduling = false;
      const ctx = ensureTtsCtx();
      ttsNextTime = Math.max(ttsNextTime, ctx.currentTime) || ctx.currentTime;
      setStatus('speaking', text.slice(0, 120) + (text.length > 120 ? '…' : ''));
      if (!_ttsStartAt) _ttsStartAt = ctx.currentTime;

      function checkDone() {
        if (done && pendingDecodes === 0 && ttsSources.size === 0) {
          resolve(!streamFailed);
        }
      }

      function scheduleWavBytes(bytes) {
        // bytes is complete WAV (header+PCM) per SSE chunk — decode gaplessly
        const ab = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
        pendingDecodes++;
        // decodeAudioData is async; keep speaking flag so barge-in can cancel
        const p = ctx.decodeAudioData ? ctx.decodeAudioData(ab) : Promise.reject(new Error('no decodeAudioData'));
        p.then((buffer) => {
          pendingDecodes--;
          if (!speaking) { checkDone(); return; }
          const src = ctx.createBufferSource();
          src.buffer = buffer;
          src.connect(ctx.destination);
          // Pre-buffer lead: first chunk +0.15s (was +0.02s) so decode of chunk 2
          // finishes before chunk 1 ends → gapless. Subsequent chunks back-to-back.
          const lead = startedScheduling ? 0.0 : 0.15;
          startedScheduling = true;
          const startAt = Math.max(ttsNextTime, ctx.currentTime + lead);
          try { src.start(startAt); } catch (_e) { try { src.start(); } catch(__e){} }
          ttsNextTime = startAt + buffer.duration;
          ttsSources.add(src);
          src.onended = () => {
            ttsSources.delete(src);
            try { src.disconnect(); } catch(_e){}
            checkDone();
          };
        }).catch((e) => {
          pendingDecodes--;
          console.warn('[Voice] decode failed', e);
          // Fallback: play via <audio> for this chunk (still gapless-ish fallback)
          try {
            const blob = new Blob([bytes], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            const a = new Audio(url);
            a.onended = () => { URL.revokeObjectURL(url); checkDone(); };
            a.play().catch(()=>{ URL.revokeObjectURL(url); checkDone(); });
          } catch(__e){ checkDone(); }
        });
      }

      fetch(API + '/api/tts/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, voice: useVoice, engine: 'pocket' }),
      })
        .then(async (resp) => {
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          while (true) {
            const { done: rd, value } = await reader.read();
            if (rd) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() ?? '';
            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              let ev;
              try { ev = JSON.parse(line.slice(6).trim()); } catch (_e) { continue; }
              if (ev.error) { streamFailed = true; done = true; checkDone(); return; }
              if (ev.done) { done = true; checkDone(); return; }
              if (ev.chunk) {
                const bytes = Uint8Array.from(atob(ev.chunk), (c) => c.charCodeAt(0));
                scheduleWavBytes(bytes);
              }
            }
          }
          done = true;
          checkDone();
          // If stream finished but no audio scheduled at all, resolve false to trigger fallback
          setTimeout(() => { if (done && pendingDecodes===0 && ttsSources.size===0 && ttsNextTime === ctx.currentTime) { streamFailed = true; checkDone(); } }, 800);
        })
        .catch((e) => {
          console.error('[Voice] TTS stream failed', e);
          streamFailed = true;
          done = true;
          checkDone();
        });
    });
  }

  // Replay the last reply (click the transcript / waveform area)
  function replayLast() {
    if (lastReply && !speaking && !thinking) speak(lastReply);
  }

  // ── Voice menu + preview ──
  function renderVoiceMenu() {
    voiceMenu.innerHTML = '';
    const sections = [
      { label: 'Voices', lang: 'en' },
    ];
    sections.forEach((sec) => {
      const head = document.createElement('div');
      head.className = 'voice-menu-head';
      head.textContent = sec.label;
      voiceMenu.appendChild(head);
      VOICES.filter((v) => v.lang === sec.lang).forEach((v) => {
        const b = document.createElement('button');
        const active = v.id === voiceForLanguage(sec.lang);
        b.textContent = v.name + (active ? '  ✓' : '');
        b.className = active ? 'active' : '';
        b.addEventListener('click', () => {
          if (sec.lang === 'id') {
            voiceId = v.id;
            localStorage.setItem('voice.idVoice', voiceId);
          } else {
            voice = v.id;
            localStorage.setItem('voice.voice', voice);
          }
          renderVoiceMenu();
          voiceMenu.style.display = 'none';
          const shortName = v.name.split('·')[0].trim();
          if (!micOn && !thinking && !speaking) setStatus('idle', 'Voice: ' + shortName);
          // A. Voice preview: instantly hear the selected voice
          const sample = sec.lang === 'id'
            ? 'Halo, saya ' + shortName + '. Ini suara saya.'
            : 'Hi, I am ' + shortName + '. This is my voice.';
          previewVoice(v.id, sample);
        });
        voiceMenu.appendChild(b);
      });
    });
  }

  function previewVoice(vId, sample) {
    if (speaking) stopSpeaking();
    const prevVol = audio.volume;
    audio.volume = 0.55;
    fetch(API + '/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: sample, voice: vId, engine: 'pocket' }),
    })
      .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
      .then((blob) => {
        const url = URL.createObjectURL(blob);
        audio.src = url;
        return audio.play().catch(() => {});
      })
      .catch((e) => console.error('[Voice] preview failed', e))
      .finally(() => { audio.volume = prevVol; });
  }

  // ── Mic on/off ──
  function startListening() {
    if (micOn) return;
    // Start server-side streaming capture FIRST (Moonshine hears us live).
    fetch(API + '/api/voice/start', { method: 'POST' })
      .then((r) => r.json().catch(() => ({})))
      .then((d) => {
        if (d && d.active === false) {
          console.error('[Voice] server capture failed to start:', d.error || 'unknown');
          setStatus('error', 'Capture failed — check API logs');
        }
      })
      .catch(() => {});
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
      .then((s) => {
        stream = s;
        audioCtx = new AudioContext();
        audioCtx.resume().catch(() => {});
        const src = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.75;
        freqBuf = new Uint8Array(analyser.frequencyBinCount);
        levelBuf = new Uint8Array(analyser.fftSize);
        src.connect(analyser);
        micOn = true;
        localStorage.setItem('voice.micOn', '1');
        accumulated = '';
        lastSpeechAt = 0;
        lastLang = '';
        sending = false;
        mutePendingSend = false;
        hideHint();
        updateMicBtn();
        setStatus('listening', 'Listening');
        send('mic', { mic: true });
        // Laptop hardware mute button → instant send trigger
        stream.getAudioTracks().forEach((track) => {
          track.addEventListener('muted', onTrackMuted);
        });
        startRound();
      })
      .catch((e) => {
        console.error('[Voice] mic denied', e);
        micOn = false;
        localStorage.setItem('voice.micOn', '0');
        // stop server capture since we won't listen
        fetch(API + '/api/voice/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ discard: true }) }).catch(() => {});
        updateMicBtn();
        setStatus('error', 'Mic denied');
        send('mic', { mic: false });
      });
  }

  function stopListening() {
    micOn = false;
    localStorage.setItem('voice.micOn', '0');
    clearTimeout(roundTimer);
    // Stop server-side capture (discard — mic off, no transcribe).
    fetch(API + '/api/voice/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ discard: true }) }).catch(() => {});
    if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
    if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; analyser = null; freqBuf = null; levelBuf = null; }
    stopSpeaking();
    if (abortRef) { abortRef.abort(); abortRef = null; }
    thinking = false;
    mutePendingSend = false;
    accumulated = '';
    hideHint();
    updateMicBtn();
    setStatus('muted', '');
    send('mic', { mic: false });
  }

  // Manual send: immediately submits whatever is currently accumulated
  function sendNow() {
    const text = accumulated.trim();
    if (!text) return;
    accumulated = '';
    hideHint();
    if (thinking && abortRef) { abortRef.abort(); abortRef = null; thinking = false; }
    if (speaking) stopSpeaking();
    sendText(text);
  }

  micBtn.addEventListener('click', () => { micOn ? stopListening() : startListening(); });
  menuBtn.addEventListener('click', (e) => { e.stopPropagation(); setMenuOpen(!menuOpen); });
  menuClose.addEventListener('click', () => { stopListening(); if (bridge) bridge.close(); else window.close(); });
  menuVoice.addEventListener('click', (e) => {
    e.stopPropagation();
    renderVoiceMenu();
    voiceMenu.style.display = voiceMenu.style.display === 'none' ? '' : 'none';
  });
  menuDetail.addEventListener('click', () => { setMenuOpen(false); setExpanded(true); });
  sendBtn.addEventListener('click', sendNow);
  replayArea.addEventListener('click', replayLast);
  closeBtn.addEventListener('click', () => { stopListening(); if (bridge) bridge.close(); else window.close(); });
  expandBtn.addEventListener('click', () => setExpanded(!expanded));

  // Voice menu open/close
  voiceBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    renderVoiceMenu();
    voiceMenu.style.display = voiceMenu.style.display === 'none' ? '' : 'none';
  });
  document.addEventListener('click', (e) => {
    if (!voiceMenu.contains(e.target) && e.target !== voiceBtn && e.target !== menuVoice) voiceMenu.style.display = 'none';
  });

  // Resume AudioContext on first interaction (needed if it started suspended)
  window.addEventListener('pointerdown', () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); });

  // ── WS relay stub (pydantic WS relay pattern — local tiny+jarvis, no provider) ──
  // Browser ↔ backend PCM16 bridge: keeps same Agent, removes poll when wired.
  let _voiceWs = null;
  function openVoiceWs() {
    try {
      const wsUrl = API.replace(/^http/, 'ws') + '/api/voice/ws';
      const ws = new WebSocket(wsUrl);
      _voiceWs = ws;
      ws.onopen = () => {
        try { ws.send(JSON.stringify({ type: 'ping' })); } catch(_e) {}
      };
      ws.onmessage = (ev) => {
        // Placeholder: when wired, binary frames are PCM16 audio; json is transcript.
      };
      ws.onclose = () => { _voiceWs = null; };
      ws.onerror = () => { _voiceWs = null; };
    } catch(_e) {}
  }
  // Opportunistically open (handshake verified, no impact on HTTP path).
  try { openVoiceWs(); } catch(_e) {}

  // Init
  updateMicBtn();
  setStatus('idle', 'Ctrl+G to toggle');
  // Normalize the native window after the HTML first paints so the initial
  // orb is the same compact size as it is after closing the menu.
  resizeOverlay();

  // ── Lazy TTS: warm on open (loading spinner on mic btn), free on close ──
  let ttsWarm = false;
  let ttsPollTimer = null;
  function startTtsLoading() {
    if (ttsWarm) return;
    micBtn.classList.add('loading');
    // Kick the warm-up (idempotent on the server).
    fetch(API + '/api/voice/warm_tts', { method: 'POST' }).catch(() => {});
    ttsPollTimer = setInterval(async () => {
      try {
        const r = await fetch(API + '/api/voice/tts_status');
        const d = await r.json().catch(() => ({}));
        if (d && d.tts_warm) {
          ttsWarm = true;
          clearInterval(ttsPollTimer);
          ttsPollTimer = null;
          micBtn.classList.remove('loading');
          updateMicBtn();
        }
      } catch (_e) {}
    }, 500);
  }
  function releaseTts() {
    if (ttsPollTimer) { clearInterval(ttsPollTimer); ttsPollTimer = null; }
    // Best-effort free (fire-and-forget) — close-triggered only.
    fetch(API + '/api/voice/release_tts', { method: 'POST' }).catch(() => {});
  }
  startTtsLoading();
  window.addEventListener('beforeunload', releaseTts);
  if (bridge && bridge.onClose) bridge.onClose(releaseTts);

  if (localStorage.getItem('voice.micOn') === '1') {
    setTimeout(startListening, 400);
  }
})();
</script>
</body>
</html>
