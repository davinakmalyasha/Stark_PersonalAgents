[package]
name = "stark-sandbox"
version = "0.1.0"
edition = "2024"
description = "Process sandbox, environment isolation, and network policy for Stark"
license = "MIT"

[dependencies]
http.workspace = true
stark-policy = { path = "../stark-policy" }
tokio = { version = "1", features = ["process", "net", "io-util", "time", "sync", "rt", "macros"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
