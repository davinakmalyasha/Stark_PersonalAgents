[package]
name = "stark-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
stt = ["dep:moonshine-rs"]

[dependencies]
anyhow.workspace = true
base64 = "0.22"
cpal = "0.16"
half = "2"
hound = "3.5"
log = "0.4"
ptts = { git = "https://github.com/gabrieldemarmiesse/xn-ptts", rev = "7efa26973f81bba42cf2ace8da2c1eb9b605d54d", default-features = false, features = ["audio"] }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
rand_distr = "0.5"
rubato = "0.16"
safetensors = "0.7"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2.workspace = true
symphonia = { version = "0.5.3", features = ["all"] }
thiserror = "2"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
xn = "0.2.11"

[target.'cfg(target_env = "msvc")'.dependencies]
moonshine-rs = { version = "0.2.6", optional = true }
