name: rune-release

# Signed Rune release. Tag with `rune-v2.6.4`; the tag must match
# desktop-rune/Cargo.toml. Publishes to the dedicated public Rune feed repo so
# `releases/latest/download/latest-rune.json` is never the Tauri installer.
#
# Required secrets:
#   MINISIGN_SECRET_KEY       minisign secret key text
#   STARK_UPDATE_PUBKEY       matching minisign public key text
#   RELEASES_TOKEN            repo-scoped token for the public releases repo
# Optional:
#   WINDOWS_CERT_BASE64, WINDOWS_CERT_PASSWORD  Authenticode signing

on:
  push:
    tags:
      - "rune-v*"

env:
  RELEASES_REPO: davinakmalyasha/Stark_Rune_Releases

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop-rune -> target
            backend-rs -> target
      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install nsis minisign -y --no-progress
      - name: Validate tag and version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#rune-v}"
          version="$(grep '^version' desktop-rune/Cargo.toml | head -1 | cut -d'"' -f2)"
          [ "$tag" = "$version" ] || { echo "tag $tag != Cargo version $version"; exit 1; }
      - name: Fetch ONNX Runtime 1.26
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v1.26.0/onnxruntime-win-x64-1.26.0.zip"
          $zip = Join-Path $env:RUNNER_TEMP "onnxruntime.zip"
          $dir = Join-Path $env:RUNNER_TEMP "onnxruntime"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $dll = Get-ChildItem $dir -Recurse -Filter onnxruntime.dll | Select-Object -First 1
          if (-not $dll) { throw "onnxruntime.dll not found" }
          Copy-Item $dll.FullName "backend-rs\onnxruntime.dll" -Force
      - name: Stage key files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${{ secrets.MINISIGN_SECRET_KEY }}" > "$RUNNER_TEMP/minisign.key"
          printf '%s\n' "${{ secrets.STARK_UPDATE_PUBKEY }}" > "$RUNNER_TEMP/update.pub"
          chmod 600 "$RUNNER_TEMP/minisign.key"
      - name: Build release binaries
        shell: bash
        env:
          STARK_UPDATE_PUBKEY: ${{ secrets.STARK_UPDATE_PUBKEY }}
        run: |
          set -euo pipefail
          cargo build --manifest-path desktop-rune/Cargo.toml --release             -p stark-rune-app -p stark-launcher             --features stark-rune-app/rune-real
          cargo build --manifest-path backend-rs/Cargo.toml --release -p stark-server
      - name: Authenticode sign binaries (optional)
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $cert = Join-Path $env:RUNNER_TEMP "stark.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_BASE64 }}"))
          $files = @(
            "desktop-rune/target/release/stark-rune.exe",
            "desktop-rune/target/release/stark-launcher.exe",
            "backend-rs/target/release/stark-server.exe"
          ) | Where-Object { Test-Path $_ }
          foreach ($file in $files) {
            & signtool sign /fd SHA256 /f $cert /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 $file
          }
      - name: Stage signed package
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ runner.temp }}/minisign.key
          STARK_UPDATE_PUBKEY: ${{ secrets.STARK_UPDATE_PUBKEY }}
          STARK_UPDATE_PUBKEY_FILE: ${{ runner.temp }}/update.pub
        run: |
          set -euo pipefail
          [ -s "$STARK_UPDATE_PUBKEY_FILE" ] || { echo "missing update public key"; exit 1; }
          [ -s "$MINISIGN_SECRET_KEY" ] || { echo "missing minisign secret key"; exit 1; }
          bash desktop-rune/packaging/package.sh --stage-only
      - name: Authenticode sign installer (optional)
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $cert = Join-Path $env:RUNNER_TEMP "stark.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_BASE64 }}"))
          $version = (Get-Content desktop-rune/Cargo.toml | Select-String '^version' | Select-Object -First 1).ToString().Split('"')[1]
          $installer = "desktop-rune/dist/StarkRune-Setup-$version.exe"
          if (Test-Path $installer) {
            & signtool sign /fd SHA256 /f $cert /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 $installer
            $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
            "$hash  StarkRune-Setup-$version.exe" | Set-Content "$installer.sha256" -Encoding ascii
          }
      - name: Publish feed and artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          version="$(grep '^version' desktop-rune/Cargo.toml | head -1 | cut -d'"' -f2)"
          dist="desktop-rune/dist"
          payload="$dist/StarkRune-$version-x64.zip"
          sig="$payload.minisig"
          sha="$(cut -d' ' -f1 "$payload.sha256")"
          size="$(stat -c%s "$payload")"
          export VERSION="$version" PAYLOAD="$payload" SIG="$sig" SHA="$sha" SIZE="$size"
          export RELEASES_REPO="${RELEASES_REPO}"
          python - <<'PY'
          import datetime, json, os, pathlib
          version = os.environ["VERSION"]
          payload = pathlib.Path(os.environ["PAYLOAD"])
          signature = pathlib.Path(os.environ["SIG"]).read_text(encoding="utf-8")
          repo = os.environ["RELEASES_REPO"]
          manifest = {
              "schema": 1,
              "version": version,
              "min_version": "2.6.0",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": {
                  "windows-x86_64": {
                      "url": f"https://github.com/{repo}/releases/download/rune-v{version}/{payload.name}",
                      "sha256": os.environ["SHA"],
                      "size": int(os.environ["SIZE"]),
                      "signature": signature,
                  }
              },
          }
          pathlib.Path("desktop-rune/dist/latest-rune.json").write_text(
              json.dumps(manifest, indent=2), encoding="utf-8"
          )
          PY
          cp "$RUNNER_TEMP/update.pub" "$dist/update.pub"
          files=(
            "$payload"
            "$sig"
            "$payload.sha256"
            "$dist/latest-rune.json"
            "$dist/update.pub"
            "$dist/StarkRune-$version-windows-x86_64.zip"
            "$dist/StarkRune-$version-windows-x86_64.zip.sha256"
          )
          for installer in "$dist"/StarkRune-Setup-*.exe; do
            [ -f "$installer" ] && files+=("$installer" "$installer.sha256")
          done
          gh release create "rune-v${version}" "${files[@]}" \
            -R "$RELEASES_REPO" \
            --title "Stark Rune ${version}" \
            --notes "Signed Rune ${version}. Silent updates use latest-rune.json." \
            --latest
      - name: Check feed JSON
        shell: bash
        run: python -m json.tool desktop-rune/dist/latest-rune.json >/dev/null
