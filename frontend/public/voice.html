        if (bridge.setScreenProtection) bridge.setScreenProtection(true);
        startNativePreview();
        updateScreenChip();
        setScreenTimer();
        broadcastScreenState();
        return true;
      } catch (e) {
        console.error('[Voice] native screen capture failed', e);
        nativeCapturing = false;
        screenSharing = 'off';
        stopNativePreview();
        setPreviewState('error', 'Screen sharing was not started');
        screenCaptionText.textContent = 'Could not start screen sharing.';
        broadcastScreenState();
        return false;
      } finally {
        screenBusy = false;
      }
    }
    if (!bridge || !bridge.selectScreenSource || !navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      screenBusy = false;
      setPreviewState('error', 'Screen sharing needs the desktop app');
      return false;
    }
    try {
      let selName = '';
      try {
        // One enumeration: the main process resolves the target (explicit pick
        // or primary screen) AND returns its label — no second lookup.
        const sel = await bridge.selectScreenSource(screenSourceId);
        if (sel && sel.ok) {
          screenSourceId = sel.id;
          selName = sel.name || '';
        }
      } catch (_e) {}
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 5 }, audio: false });
      screenStream = stream;
      screenVideo.srcObject = stream;
      stream.getVideoTracks().forEach((track) => {
        track.addEventListener('ended', () => stopScreenShare('ended'));
      });
      if (bridge.setScreenProtection) bridge.setScreenProtection(true);
      screenSharing = 'on';
      setPreviewState('live');
      // Give the compositor a beat so the first capture is a real frame, not black.
      await new Promise((r) => setTimeout(r, 250));
      if (selName) {
        screenSourceLabel = selName;
        updateScreenChip();
        broadcastScreenState();
      } else {
        resolveScreenSourceLabel();
      }
      setScreenTimer();
      broadcastScreenState();
      return true;
    } catch (e) {
      console.error('[Voice] screen share failed', e);
      screenSharing = 'off';
      setPreviewState('error', 'Screen sharing was not started');
      screenCaptionText.textContent = 'Could not start screen sharing.';
      broadcastScreenState();
      return false;
    } finally {
      screenBusy = false;
    }
  }

  function stopScreenShare(reason) {
    clearScreenTimer();
    if (screenStream) {
      try { screenStream.getTracks().forEach((t) => t.stop()); } catch (_e) {}
      screenStream = null;
    }
    nativeCapturing = false;
    stopNativePreview();
    try { screenVideo.srcObject = null; } catch (_e) {}
    // State first: setPreviewState/updateScreenChip read screenSharing.
    screenSharing = 'off';
    setPreviewState('off', reason === 'ended'
      ? 'Sharing stopped'
      : (reason === 'pause' ? 'Paused — the agent can’t see your screen' : 'No screen shared'));
    if (bridge && bridge.setScreenProtection) bridge.setScreenProtection(false);
    lastFrameHash = '';
    lastFrameAttachment = null;
    turnFramePromise = null;
    broadcastScreenState();
  }

  function setScreenTimer() {
    clearScreenTimer();
    if (screenSharing === 'continuous' && hasScreenSource()) {
      screenTimer = setInterval(() => { uploadScreenFrame('continuous'); }, 5000);
    }
  }

  function clearScreenTimer() {
    if (screenTimer) { clearInterval(screenTimer); screenTimer = null; }
  }

  async function resolveScreenSourceLabel() {
    try {
      const list = (bridge && bridge.listScreenSources) ? await bridge.listScreenSources() : [];
      const match = (list || []).find((s) => s.id === screenSourceId);
      screenSourceLabel = match ? match.name : 'Entire screen';
    } catch (_e) {
      screenSourceLabel = 'Entire screen';
    }
    updateScreenChip();
    broadcastScreenState();
  }

  function ensureVideoReady(timeoutMs) {
    return new Promise((resolve) => {
      const t0 = Date.now();
      const tick = () => {
        if (screenVideo && screenVideo.readyState >= 2 && screenVideo.videoWidth) return resolve(true);
        if (Date.now() - t0 > (timeoutMs || 2000)) return resolve(false);
        setTimeout(tick, 100);
      };
      tick();
    });
  }

  async function screenCaptureJpeg() {
    if (nativeCaptureAvailable()) {
      const frame = await refreshNativePreview();
      return frame && frame.image_b64 ? frame.image_b64 : null;
    }
    if (!screenStream) return null;
    if (!(await ensureVideoReady(2000))) return null;
    const vw = screenVideo.videoWidth;
    const vh = screenVideo.videoHeight;
    if (!vw || !vh) return null;
    const scale = Math.min(1, 1280 / vw);
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(vw * scale));
    canvas.height = Math.max(1, Math.round(vh * scale));
    canvas.getContext('2d').drawImage(screenVideo, 0, 0, canvas.width, canvas.height);
    const url = canvas.toDataURL('image/jpeg', 0.72);
    return url.indexOf(',') >= 0 ? url.split(',')[1] : null;
  }

  async function uploadScreenFrame(label, reqId) {
    const b64 = await screenCaptureJpeg();
    if (!b64) return null;
    // Identical static screen: reuse the previous attachment instead of
    // re-uploading + re-writing the same 80KB JPEG. Explicit tool captures
    // (reqId) always upload — the server resolves the request from the upload.
    const isContinuous = label === 'continuous';
    const hash = (!isContinuous && !reqId) ? cheapScreenHash(b64) : '';
    if (hash && hash === lastFrameHash && lastFrameAttachment) {
      return lastFrameAttachment;
    }
    try {
      const resp = await fetch(API + '/api/vision/frame', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          image_b64: b64,
          mime: 'image/jpeg',
          chat_id: chatId || '',
          label: label || 'turn',
          source: screenSourceLabel || '',
          req_id: reqId || '',
        }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!data || !data.ok) throw new Error((data && data.error) || ('HTTP ' + resp.status));
      const attachment = data.attachment || null;
      if (hash && attachment) {
        lastFrameHash = hash;
        lastFrameAttachment = attachment;
      }
      return attachment;
    } catch (e) {
      console.error('[Voice] screen frame upload failed', e);
      return null;
    }
  }

  // Sampled FNV-1a (fast, collision-resistant enough for frame dedupe).
  let lastFrameHash = '';
  let lastFrameAttachment = null;
  function cheapScreenHash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i += 31) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(36) + ':' + str.length;
  }

  // Fresh frame the moment a voice turn ends (see sendToPipeline).
  async function captureTurnFrame() {
    if (!screenActive() || screenSharing === 'off') return null;
    return uploadScreenFrame('turn');
  }

  // Round-end kick: capture overlaps the STT flush; sendToPipeline awaits it.
  let turnFramePromise = null;
  function kickTurnFrameCapture() {
    if (turnFramePromise) return;
    if (thinking || !screenActive() || screenSharing === 'off') return;
    turnFramePromise = captureTurnFrame().catch(() => null);
  }

  function broadcastScreenState() {
    try {
      if (_voiceWs && _voiceWs.readyState === 1) {
        _voiceWs.send(JSON.stringify({
          type: 'screen-state',
          sharing: screenSharing !== 'off',
          mode: screenSharing,
          source: screenSourceLabel || '',
        }));
      }
    } catch (_e) {}
  }

  function sendScreenAck(reqId, ok, error, extra) {
    try {
      if (_voiceWs && _voiceWs.readyState === 1) {
        _voiceWs.send(JSON.stringify(Object.assign({
          type: 'screen-ack', req_id: reqId, ok: !!ok, error: error || '',
        }, extra || {})));
      }
    } catch (_e) {}
  }

  // Agent tool request: look_at_screen → capture now (turns sharing on if off,
  // and shows the panel so the user sees what is being shared).
  async function onScreenCaptureRequest(reqId) {
    if (!screenActive()) showScreenLayout();
    if (!hasScreenSource() || screenSharing === 'off') {
      const ok = await setSharingMode('on');
      if (!ok) { sendScreenAck(reqId, false, 'Screen sharing is not available'); return; }
    }
    const att = await uploadScreenFrame('tool', reqId);
    if (!att) sendScreenAck(reqId, false, 'Frame capture failed');
  }

  // Agent tool request: set_screen_share → switch mode, then ack.
  async function onScreenModeRequest(reqId, mode) {
    const wanted = ['on', 'off', 'continuous'].indexOf(mode) >= 0 ? mode : 'on';
    const ok = await setSharingMode(wanted);
    if (ok) sendScreenAck(reqId, true, '', { mode: screenSharing, sharing: screenSharing !== 'off' });
    else sendScreenAck(reqId, false, 'Could not switch screen sharing');
  }

  // ── Source picker ──
  async function openScreenPicker(firstTime) {
    if (!screenPicker) return;
    togglePreviewPop(false);
    screenPicker.dataset.first = firstTime ? '1' : '';
    screenPicker.classList.add('open');
    screenPickerGrid.innerHTML = '<div class="screen-picker-empty">Looking for screens…</div>';
    let list = [];
    try {
      list = (bridge && bridge.listScreenSources) ? await bridge.listScreenSources() : [];
    } catch (_e) { list = []; }
    renderScreenPicker(list);
  }

  function renderScreenPicker(list) {
    const ordered = (list || []).slice().sort((a, b) => (a.kind === 'screen' ? 0 : 1) - (b.kind === 'screen' ? 0 : 1));
    screenPickerGrid.innerHTML = '';
    if (!ordered.length) {
      const empty = document.createElement('div');
      empty.className = 'screen-picker-empty';
      empty.textContent = 'No screens or windows found';
      screenPickerGrid.appendChild(empty);
      return;
    }
    ordered.forEach((source, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'screen-picker-item' + (source.id === screenSourceId ? ' active' : '');
      btn.style.animationDelay = Math.min(idx, 10) * 35 + 'ms';
      if (source.thumbnail) {
        const img = document.createElement('img');
        img.src = source.thumbnail;
        img.alt = '';
        btn.appendChild(img);
      }
      const cap = document.createElement('span');
      cap.textContent = (source.kind === 'screen' ? 'Screen · ' : 'Window · ') + source.name;
      btn.appendChild(cap);
      btn.addEventListener('click', async () => {
        screenPicker.classList.remove('open');
        if (hasScreenSource()) stopScreenShare();
        await startScreenShare(source.id);
      });
      screenPickerGrid.appendChild(btn);
    });
  }

  function closeScreenPicker() {
    if (!screenPicker) return;
    const firstTime = screenPicker.dataset.first === '1';
    screenPicker.dataset.first = '';
    screenPicker.classList.remove('open');
    // Entering screen mode implies sharing: closing the first-time picker
    // falls back to the primary screen instead of leaving a dead panel.
    if (firstTime && screenActive() && !hasScreenSource()) setSharingMode('on');
  }

  // Design-QA only (?demo=screen): paint a mock document into the preview so
  // the panel can be screenshotted without a real capture stream.
  function paintDemoPreview() {
    try {
      const c = document.createElement('canvas');
      c.width = 640; c.height = 360;
      const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, 0, 360);
      g.addColorStop(0, '#1b2030');
      g.addColorStop(1, '#0e121c');
      x.fillStyle = g;
      x.fillRect(0, 0, 640, 360);
      x.fillStyle = '#f4f6fb';
      x.fillRect(48, 28, 544, 304);
      x.fillStyle = '#c7cede';
      for (let i = 0; i < 12; i++) x.fillRect(76, 84 + i * 19, i % 4 === 3 ? 300 : 488, 6);
      x.fillStyle = 'rgba(122, 167, 255, 0.35)';
      x.fillRect(76, 122, 420, 14);
      x.fillStyle = '#2b3348';
      x.font = '600 15px Segoe UI';
      x.fillText('Attention Is All You Need', 76, 62);
      screenPreview.style.backgroundImage = 'url(' + c.toDataURL('image/png') + ')';
      setPreviewState('live');
    } catch (_e) {}
  }

  updateMenuMode();

  function feedLine(text, kind) {
    if (!feed) return;
    const div = document.createElement('div');
    div.className = 'feed-line ' + (kind || 'meta');
    div.textContent = text;
    feed.appendChild(div);
    while (feed.children.length > FEED_MAX) feed.removeChild(feed.firstChild);
    feed.scrollTop = feed.scrollHeight;
  }

  function classifyLine(line) {
    const t = line.trim();
    if (!t) return null;
    if (/^\[>\]\s*User:|^You:/.test(t)) return 'user';
    if (/^\[THOUGHT\]|^Thought:/.test(t)) return 'thought';
    if (/^\[[^\]]*\]\s*$/.test(t)) return 'meta';
    if (/ORCHESTRATOR|SUBAGENT|SUPERVISOR|Delegat|Delegating|task\(/i.test(t)) return 'agent';
    if (/→|Tool:|\[TOOL|tool_|execute|run_command|write_file|edit_file|search/i.test(t)) return 'tool';
    if (/error|failed|insufficient|traceback|exception/i.test(t)) return 'error';
    if (/^[\s═─=·]+$/.test(t)) return null;
    return 'meta';
  }

  function appendFeedFromState(state) {
    const log = (state && state.live_terminal_log) || '';
    if (!log || log.length <= lastLogLen) return;
    const fresh = log.slice(lastLogLen);
    lastLogLen = log.length;
    fresh.split('\n').forEach((line) => {
      const kind = classifyLine(line);
      if (kind) feedLine(line, kind);
    });
  }

  function feedMsg(text, kind) {
    feedLine(text, kind || 'meta');
    feedStatus.textContent = kind === 'error' ? 'error' : '…';
  }

  // Shared SSE consumption for /api/run — used by the text path
  // (sendToPipeline). Handles state
  // frames, live feed, progress, pipeline-done, reply, TTS speaking, errors.
  // Returns true when the reply was spoken / handled; false on transport error.
  async function consumeRunStream(resp, chat, userText, mySeq) {
    const seq = (typeof mySeq === 'number') ? mySeq : runSeq;
    const isStale = () => seq !== runSeq;
    let lastState = null;
    let failed = false;
    let failReason = '';
    let streamReplyText = '';
    let spokenUpTo = 0;
    let incrementalMuted = false;
    // True incremental speech: each settled sentence fires its own
    // /api/tts/stream call immediately (pipelined). The backend worker stays
    // serial (Pocket is NOT thread-safe) so sentences synthesize in FIFO
    // order; the shared ttsNextTime scheduler keeps them gapless. First
    // sentence audio starts while the LLM is still streaming the rest.
    const ttsFlights = [];
    let ttsSentences = 0;
    function queueSentenceTts(clean) {
      if (isStale()) return;
      const useVoice = voiceForLanguage(detectLanguage(clean));
      ttsSentences++;
      if (!incrementalMuted) {
        incrementalMuted = true;
        const ctx = ensureAuCtx();
        if (ctx.state === 'suspended') ctx.resume().catch(()=>{});
        speaking = true;
        setStatus('speaking', clean.slice(0,120));
      }
      try {
        const p = speakStreamed(clean, useVoice).catch((e) => {
          console.warn('[Voice] sentence TTS failed, continuing', e);
          return false;
        });
        ttsFlights.push(p);
      } catch (e) {
        console.warn('[Voice] sentence TTS threw', e);
      }
    }
    function maybeSpeakIncremental(forceFlush = false) {
      if (!streamReplyText || spokenUpTo >= streamReplyText.length) return;
      const unsent = streamReplyText.slice(spokenUpTo);
      // Find sentence boundary: ". ", "! ", "? " or end
      let boundary = -1;
      const m = unsent.match(/[.!?]\s/);
      if (m && m.index !== undefined) boundary = m.index + 1; // include punctuation
      else if (forceFlush && unsent.trim().length > 0) boundary = unsent.length;
      else if (unsent.length > 180) {
        const sp = unsent.lastIndexOf(' ', 150);
        boundary = sp > 40 ? sp : 150;
      }
      if (boundary === -1) return;
      const sentence = unsent.slice(0, boundary).trim();
      if (!sentence) { spokenUpTo += boundary + 1; return; }
      const clean = cleanForTTS(sentence);
      if (!clean || clean.length < 3) { spokenUpTo += boundary + 1; return; }
      if (isGarbage(clean)) { spokenUpTo += boundary + 1; return; }
      spokenUpTo += boundary + 1;
      while (spokenUpTo < streamReplyText.length && streamReplyText[spokenUpTo] === ' ') spokenUpTo++;
      queueSentenceTts(clean);
    }
    try {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      if (isStale()) return false;
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let pendingEvent = '';
      let evDone = false;
      while (true) {
        if (isStale()) return false;
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() ?? '';
        for (const line of lines) {
          if (line.startsWith('event: ')) {
            pendingEvent = line.slice(7).trim();
            continue;
          }
          if (!line.startsWith('data: ')) { continue; }
          const evName = pendingEvent;
          pendingEvent = '';
          try {
            const parsed = JSON.parse(line.slice(6).trim());
            if (evName === 'delta') {
              // Live token deltas — docs: bus emits kind "text" vs "reasoning"
              if (parsed && typeof parsed.text === 'string' && parsed.text) {
                if (parsed.kind === 'reasoning') {
                  // Don't speak reasoning, just show as progress
                  textEl.textContent = ('… ' + parsed.text.slice(-100)).slice(-120);
                  requestAnimationFrame(refreshMarquee);
                } else {
                  if (tMarks.delta === undefined) tMark('delta');
                  streamReplyText += parsed.text;
                  textEl.textContent = streamReplyText.slice(-120);
                  requestAnimationFrame(refreshMarquee);
                  send('progress', { text: streamReplyText.slice(-120) });
                  maybeSpeakIncremental(false);
                }
                // Phase 8-V2: forward every delta to the main window so the
                // canonical chat overlay streams tokens live during voice runs.
                send('delta', { kind: parsed.kind || 'text', text: parsed.text, agent: parsed.agent || '' });
              }
              continue;
            }
            if (evName === 'done') {
              if (parsed.error) { failed = true; failReason = String(parsed.error); }
              evDone = true;
              break;
            }
            if (parsed.error) { failed = true; failReason = String(parsed.error); }
            if (parsed.active_node || parsed.live_terminal_log) {
              lastState = parsed;
              send('pipeline-state', { workspaceId: voiceWsId, chatId: chat, state: parsed });
              appendFeedFromState(parsed);
              if (!failed) {
                const prog = progressFromState(parsed);
                if (prog) { textEl.textContent = prog; requestAnimationFrame(refreshMarquee); send('progress', { text: prog }); }
              }
            }
          } catch (_e) { /* skip malformed lines */ }
        }
        if (evDone) break;
      }
      thinking = false;
      if (!isStale()) {
        send('pipeline-done', {
          workspaceId: voiceWsId,
          chatId: chat,
          state: lastState,
          status: failed ? 'error' : 'complete',
          error: failReason || undefined,
          runSeq: seq,
        });
      }
      if (isStale()) return false;
      const reply = ((lastState && lastState.outputs && lastState.outputs.agent_report) || '').trim();
      if (reply) {
        if (!T_DEBUG && feedStatus) feedStatus.textContent = 'answering';
        feedMsg('Assistant: ' + reply.slice(0, 200), 'agent');
        persistReply(chat, reply); // fire-and-forget: never block TTFB-audio
        // Flush any trailing fragment, then wait for pipelined sentences.
        maybeSpeakIncremental(true);
        if (ttsFlights.length) {
          try { await Promise.allSettled(ttsFlights); } catch (_e) {}
          speaking = false;
          incrementalMuted = false;
          incrementalTtsBuffer = '';
          if (micOn) setStatus('listening', accumulated || 'Listening');
          return true;
        } else {
          // No incremental text was spoken (reply arrived with no streamable
          // deltas, or deltas had no sentence boundary) — full reply fallback.
          // Prefer the final agent_report text (canonical) over deltas.
          const tail = reply.slice(spokenUpTo).trim() || reply;
          if (ttsSentences === 0) {
            setStatus('processing', 'Preparing voice…');
            await speak(tail);
          } else {
            // Sentences already spoke the streamed text; speak any remainder
            // the delta stream missed (report vs deltas skew).
            const missing = tail.length > streamReplyText.length + 20 ? tail.slice(streamReplyText.length).trim() : '';
            if (missing) await speak(missing);
            else { speaking = false; incrementalMuted = false; if (micOn) setStatus('listening', accumulated || 'Listening'); }
          }
          return true;
        }
      }
      if (failed) {
        setStatus('error', extractRunError(lastState, failReason));
        if (feedStatus) feedStatus.textContent = 'error';
        setTimeout(() => { if (micOn) setStatus('listening', accumulated || 'Listening'); }, 3000);
      } else if (lastState) {
        setStatus('error', 'No reply received — check api_out.log');
        if (feedStatus) feedStatus.textContent = 'error';
        setTimeout(() => { if (micOn) setStatus('listening', accumulated || 'Listening'); }, 3000);
      } else {
        setStatus('error', 'Run returned nothing — check api_out.log');
        if (feedStatus) feedStatus.textContent = 'error';
        setTimeout(() => { if (micOn) setStatus('listening', accumulated || 'Listening'); }, 3000);
      }
      return false;
    } catch (e) {
      thinking = false;
      if (e.name === 'AbortError') {
        setStatus('listening', accumulated || 'Listening');
        if (feedStatus) feedStatus.textContent = 'stopped';
        if (!isStale()) send('pipeline-done', { workspaceId: voiceWsId, chatId: chat, state: lastState, status: 'aborted', runSeq: seq });
      } else {
        console.error('[Voice] run failed', e);
        setStatus('error', 'Run failed');
        if (!isStale()) send('pipeline-done', { workspaceId: voiceWsId, chatId: chat, state: lastState, status: 'error', error: String(e), runSeq: seq });
      }
      return false;
    }
  }

  async function sendToPipeline(text, mySeq) {
    const seq = (typeof mySeq === 'number') ? mySeq : (++runSeq);
    thinking = true;
    setStatus('thinking');
    lastLogLen = 0;
    if (feed) { feed.innerHTML = ''; }
    if (feedStatus) feedStatus.textContent = 'running';
    feedMsg('You: ' + text, 'user');
    let chat;
    try {
      chat = await ensureChat();
    } catch (e) {
      thinking = false;
      setStatus('error', 'Backend unreachable');
      send('pipeline-done', { workspaceId: voiceWsId, chatId: chatId, state: null, status: 'error', error: 'Backend unreachable' });
      setTimeout(() => { if (micOn) setStatus('listening', accumulated || 'Listening'); }, 2500);
      return;
    }
    send('pipeline-start', { workspaceId: voiceWsId, chatId: chat, prompt: text, runSeq: seq });
    abortRef = new AbortController();
    const myAbort = abortRef;
    tMark('run');
    // Watchdog: if the run stalls (no done frame within RUN_TIMEOUT_MS), bail
    // out of the thinking state so the overlay never hangs forever.
    // Stale (superseded) runs stay silent so they can't wipe the live run.
    let runSettled = false;
    const watchdog = setTimeout(() => {
      if (runSettled || seq !== runSeq) return;
      runSettled = true;
      console.error('[Voice] run watchdog timeout — aborting');
      thinking = false;
      if (abortRef === myAbort) { try { myAbort.abort(); } catch (_e) {} abortRef = null; }
      setStatus('error', 'Run timed out');
      send('pipeline-done', { workspaceId: voiceWsId, chatId: chat, state: null, status: 'timeout', error: 'Run timed out', runSeq: seq });
      setTimeout(() => { if (micOn) setStatus('listening', accumulated || 'Listening'); }, 2500);
    }, RUN_TIMEOUT_MS);
    try {
      // Fresh screen frame at turn end (screen mode, sharing on). The frame
      // rides /api/run attachments → vision channel; runs.py keeps screenFrame
      // entries out of the persisted chat log.
      let _attachments = [];
      try {
        // Prefer the frame captured at round-end (overlapped with STT flush).
        const pendingFrame = turnFramePromise;
        turnFramePromise = null;
        const frame = pendingFrame ? await pendingFrame : await captureTurnFrame();
        if (frame) _attachments = [frame];
      } catch (_e) {}
      const resp = await fetch(API + '/api/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt: text,
          model: voiceModel,
          temperature: voiceTemp,
          workspace_path: (voiceWsPath !== null && voiceWsPath !== undefined) ? voiceWsPath : '',
          workspace_id: voiceWsId || '',
          chat_id: chat,
          attachments: _attachments,
          workspace_kind: voiceWsId === '_house' ? 'house' : (voiceWsId === '_personal' ? 'personal' : 'general'),
        }),
        signal: myAbort.signal,
      });
      await consumeRunStream(resp, chat, text, seq);
    } finally {
      runSettled = true;
      clearTimeout(watchdog);
      if (abortRef === myAbort) abortRef = null;
    }
  }

  // ── Speech playback (TTS via backend Pocket TTS engine) ──
  function cleanForTTS(t) {
    return t
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\[(BUG|TODO|NOTE)[^\]]*\]/gi, ' ')
      .replace(/[#*_>~|]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 800);
  }

  // Single shared AudioContext (24kHz = Pocket TTS native) for BOTH the mic
  // analyser chain and TTS playback — one realtime thread instead of two.
  // The mic stream is resampled down by Web Audio automatically (inaudible
  // and irrelevant for a level meter); TTS buffers stay native (no resample
  // cost). Never closed on mic-off — mic nodes are just disconnected; the
  // context lives for the overlay lifetime. Gapless TTS state lives here too.
  let auCtx = null;
  let ttsNextTime = 0;
  const ttsSources = new Set();
  let _ttsStartAt = 0; // AudioContext time when current utterance started (for played_ms)

  function ensureAuCtx() {
    if (!auCtx || auCtx.state === 'closed') {
      try { auCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 }); }
      catch (_e) { auCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      ttsNextTime = auCtx.currentTime;
      // auCtx was recreated — rebuild the visual-only TTS tap with it.
      ttsAnalyser = null; ttsFreqBuf = null; ttsLevelBuf = null;
    }
    if (auCtx.state === 'suspended') auCtx.resume().catch(() => {});
    ensureTtsAnalyser(auCtx);
    return auCtx;
  }

  function _ttsPlayedMs() {
    try {
      if (!_ttsStartAt || !auCtx) return 0;
      const ms = Math.max(0, (auCtx.currentTime - _ttsStartAt) * 1000);
      return Math.round(ms);
    } catch (_e) { return 0; }
  }

  function stopSpeaking() {
    const wasSpeaking = speaking && ttsSources.size > 0;
    let playedMs = 0;
    if (wasSpeaking) playedMs = _ttsPlayedMs();
    speaking = false;
    incrementalTtsBuffer = '';
    // Abort in-flight TTS fetches so their late chunks never schedule.
    for (const c of ttsAbortAll.splice(0)) { try { c.abort(); } catch (_e) {} }
    if (ttsAbortRef) { try { ttsAbortRef.abort(); } catch (_e) {} ttsAbortRef = null; }
    // Stop Web Audio scheduled sources
    for (const s of [...ttsSources]) {
      try { s.stop(); s.disconnect(); } catch (_e) {}
    }
    ttsSources.clear();
    ttsNextTime = 0;
    _ttsStartAt = 0;
    if (auCtx && auCtx.state === 'suspended') auCtx.resume().catch(()=>{});
    audio.pause();
    if (audio.src) { try { URL.revokeObjectURL(audio.src); } catch(_e){} }
    audio.removeAttribute('src');
    try { audio.load(); } catch(_e){}
    // Barge-in fast path: cancel backend synthesis (queued + in-flight) and
    // report truncation for history. Fire-and-forget — never block the mic.
    fetch(API + '/api/tts/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) }).catch(() => {});
    if (wasSpeaking && playedMs > 0) {
      fetch(API + '/api/voice/interrupt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ played_ms: playedMs }),
      }).catch(() => {});
    } else {
      // Even without audible playback, purge any queued synthesis so the
      // next utterance doesn't wait behind a stale one.
      fetch(API + '/api/voice/interrupt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ played_ms: 0 }),
      }).catch(() => {});
    }
  }

  async function speak(text) {
    const clean = cleanForTTS(text);
    if (!clean) return;
    lastReply = clean;
    speaking = true;
    _ttsStartAt = ensureAuCtx().currentTime;
    setStatus('processing', 'Preparing voice…');
    const useVoice = voiceForLanguage(detectLanguage(clean));
    // Phase 8-V3: full duplex — the browser mic has AEC on (echoCancellation/
    // noiseSuppression/autoGainControl), so no server mute-while-speaking. The
    // user can talk over the reply and the next round starts instantly.
    try {
      const ok = await speakStreamed(clean, useVoice);
      if (!ok) {
        // fall back to non-streamed (full wav) if streaming fails
        const resp = await fetch(API + '/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: clean, voice: useVoice, engine: 'pocket' }),
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        audio.src = url;
        await audio.play();
        setStatus('speaking', clean.slice(0, 120) + (clean.length > 120 ? '…' : ''));
        await new Promise((res) => {
          audio.onended = res;
          audio.onpause = () => { if (!speaking) res(); };
        });
      }
    } catch (e) {
      console.error('[Voice] TTS failed', e);
      setStatus('error', 'TTS failed');
      setTimeout(() => { if (micOn) setStatus('listening', accumulated || 'Listening'); }, 2500);
    } finally {
      speaking = false;
      fetch(API + '/api/voice/mute', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ muted: false }) }).catch(() => {});
      if (micOn) setStatus('listening', accumulated || 'Listening');
    }
  }

  // Stream TTS chunks (SSE /api/tts/stream) gapless via Web Audio.
  // First audio ~0.2-0.5s; chunks concat without gaps unlike HTMLAudio per-chunk.
  // pcm16 frames build an AudioBuffer directly (no decodeAudioData, no WAV
  // header); wav frames keep the legacy decode path. Pre-buffer lead on the
  // first scheduled buffer hides decode jitter.
  function speakStreamed(text, useVoice) {
    return new Promise((resolve) => {
      let done = false;
      let streamFailed = false;
      let pendingDecodes = 0;
      let startedScheduling = false;
      let firstAudioMarked = false;
      let myLive = 0; // this sentence's scheduled-but-unended buffers (shared set is global for barge-in kill)
      const ctx = ensureAuCtx();
      ttsNextTime = Math.max(ttsNextTime, ctx.currentTime) || ctx.currentTime;
      setStatus('speaking', text.slice(0, 120) + (text.length > 120 ? '…' : ''));
      if (!_ttsStartAt) _ttsStartAt = ctx.currentTime;
      const myAbort = new AbortController();
      ttsAbortRef = myAbort;
      try { ttsAbortAll.push(myAbort); } catch(_e){}
      if (tMarks.tts === undefined) tMark('tts');
      // Safety: a hung SSE stream must never wedge the overlay in speaking.
      setTimeout(() => {
        if (!done) { streamFailed = true; done = true; checkDone(); }
      }, 60000);

      function markFirstAudio() {
        if (!firstAudioMarked) { firstAudioMarked = true; tMark('audio'); }
      }

      function checkDone() {
        if (done && pendingDecodes === 0 && myLive <= 0) {
          try {
            const i = ttsAbortAll.indexOf(myAbort);
            if (i >= 0) ttsAbortAll.splice(i, 1);
          } catch(_e){}
          resolve(!streamFailed);
        }
      }

      function schedulePcm16(b64, sr) {
        // Raw int16 mono @sr — same samples the WAV path carries, minus the
        // header + base64 bloat and the async decode per chunk.
        try {
          const bin = atob(b64);
          const len = bin.length >> 1;
          if (len <= 0) return;
          const i16 = new Int16Array(len);
          for (let i = 0; i < len; i++) i16[i] = bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8);
          const f32 = new Float32Array(len);
          for (let i = 0; i < len; i++) f32[i] = i16[i] / 32768;
          const buffer = ctx.createBuffer(1, len, sr || 24000);
          buffer.getChannelData(0).set(f32);
          scheduleBuffer(buffer);
        } catch (e) {
          console.warn('[Voice] pcm16 schedule failed', e);
        }
      }

      function scheduleBuffer(buffer) {
        if (!speaking && !ttsFlightsPending()) { checkDone(); return; }
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(ctx.destination);
        // Visual-only TTS meter tap — extra connection into the analyser,
        // audio still flows src -> destination exactly as before.
        try {
          const tap = ensureTtsAnalyser(ctx);
          if (tap) src.connect(tap);
        } catch (_e) {}
        const lead = startedScheduling ? 0.0 : 0.08;
        startedScheduling = true;
        const startAt = Math.max(ttsNextTime, ctx.currentTime + lead);
        try { src.start(startAt); } catch (_e) { try { src.start(); } catch(__e){} }
        ttsNextTime = startAt + buffer.duration;
        ttsSources.add(src);
        myLive++;
        markFirstAudio();
        src.onended = () => {
          ttsSources.delete(src);
          myLive--;
          try { src.disconnect(); } catch(_e){}
          checkDone();
        };
      }

      function ttsFlightsPending() {
        // Other pipelined sentences may still be speaking; don't drop buffers
        // just because this sentence's own fetch finished.
        return speaking;
      }

      function scheduleWavBytes(bytes) {
        // bytes is complete WAV (header+PCM) per SSE chunk — decode gaplessly
        const ab = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
        pendingDecodes++;
        // decodeAudioData is async; keep speaking flag so barge-in can cancel
        const p = ctx.decodeAudioData ? ctx.decodeAudioData(ab) : Promise.reject(new Error('no decodeAudioData'));
        p.then((buffer) => {
          pendingDecodes--;
          if (!speaking) { checkDone(); return; }
          scheduleBuffer(buffer);
        }).catch((e) => {
          pendingDecodes--;
          console.warn('[Voice] decode failed', e);
          // Fallback: play via <audio> for this chunk (still gapless-ish fallback)
          try {
            const blob = new Blob([bytes], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            const a = new Audio(url);
            a.onended = () => { URL.revokeObjectURL(url); checkDone(); };
            a.play().catch(()=>{ URL.revokeObjectURL(url); checkDone(); });
          } catch(__e){ checkDone(); }
        });
      }

      fetch(API + '/api/tts/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, voice: useVoice, engine: 'pocket', format: 'pcm16' }),
        signal: myAbort.signal,
      })
        .then(async (resp) => {
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          while (true) {
            const { done: rd, value } = await reader.read();
            if (rd) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() ?? '';
            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              let ev;
              try { ev = JSON.parse(line.slice(6).trim()); } catch (_e) { continue; }
              if (ev.error) { streamFailed = true; done = true; checkDone(); return; }
              if (ev.done) { done = true; checkDone(); return; }
              if (ev.pcm16) {
                schedulePcm16(ev.pcm16, ev.sr || 24000);
              } else if (ev.chunk) {
                const bytes = Uint8Array.from(atob(ev.chunk), (c) => c.charCodeAt(0));
                scheduleWavBytes(bytes);
              }
            }
          }
          done = true;
          checkDone();
          // If stream finished but no audio scheduled at all, resolve false to trigger fallback
          setTimeout(() => { if (done && pendingDecodes===0 && !startedScheduling) { streamFailed = true; checkDone(); } }, 800);
        })
        .catch((e) => {
          if (e && e.name === 'AbortError') { done = true; checkDone(); return; }
          console.error('[Voice] TTS stream failed', e);
          streamFailed = true;
          done = true;
          checkDone();
        });
    });
  }

  // Replay the last reply (click the transcript / waveform area)
  function replayLast() {
    if (lastReply && !speaking && !thinking) speak(lastReply);
  }

  // ── Voice menu + preview ──
  function renderVoiceMenu() {
    voiceMenu.innerHTML = '';
    const sections = [
      { label: 'Voices', lang: 'en' },
    ];
    sections.forEach((sec) => {
      const head = document.createElement('div');
      head.className = 'voice-menu-head';
      head.textContent = sec.label;
      voiceMenu.appendChild(head);
      VOICES.filter((v) => v.lang === sec.lang).forEach((v) => {
        const b = document.createElement('button');
        const active = v.id === voiceForLanguage(sec.lang);
        b.textContent = v.name + (active ? '  ✓' : '');
        b.className = active ? 'active' : '';
        b.addEventListener('click', () => {
          if (sec.lang === 'id') {
            voiceId = v.id;
            localStorage.setItem('voice.idVoice', voiceId);
          } else {
            voice = v.id;
            localStorage.setItem('voice.voice', voice);
          }
          renderVoiceMenu();
          voiceMenu.style.display = 'none';
          const shortName = v.name.split('·')[0].trim();
          if (!micOn && !thinking && !speaking) setStatus('idle', 'Voice: ' + shortName);
          // A. Voice preview: instantly hear the selected voice
          const sample = sec.lang === 'id'
            ? 'Halo, saya ' + shortName + '. Ini suara saya.'
            : 'Hi, I am ' + shortName + '. This is my voice.';
          previewVoice(v.id, sample);
        });
        voiceMenu.appendChild(b);
      });
    });
  }

  function previewVoice(vId, sample) {
    if (speaking) stopSpeaking();
    const prevVol = audio.volume;
    audio.volume = 0.55;
    fetch(API + '/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: sample, voice: vId, engine: 'pocket' }),
    })
      .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
      .then((blob) => {
        const url = URL.createObjectURL(blob);
        audio.src = url;
        return audio.play().catch(() => {});
      })
      .catch((e) => console.error('[Voice] preview failed', e))
      .finally(() => { audio.volume = prevVol; });
  }

  // ── Mic on/off ──
  async function startListening() {
    if (micOn || startInFlight) return;
    startInFlight = true;
    let s = null;
    try {
      // The Rust session must be ready before we send any PCM. It owns VAD,
      // endpointing and Moonshine so the browser cannot cut sentences apart.
      await ensureVoiceWsOpen(4000);
      await startLiveSession(6000);

      s = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      stream = s;
      const actx = ensureAuCtx();
      if (!actx.audioWorklet) throw new Error('AudioWorklet is not available');
      const src = actx.createMediaStreamSource(stream);
      analyser = actx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.75;
      freqBuf = new Uint8Array(analyser.frequencyBinCount);
      levelBuf = new Uint8Array(analyser.fftSize);
      src.connect(analyser);

      const workletUrl = new URL('pcm-worklet.js', location.href).href;
      await actx.audioWorklet.addModule(workletUrl);
      const node = new AudioWorkletNode(actx, 'stark-pcm', {
        numberOfInputs: 1,
        numberOfOutputs: 0,
        channelCount: 1,
        channelCountMode: 'explicit',
      });
      node.port.onmessage = (event) => {
        if (!micOn || !liveSessionReady) return;
        try {
          if (_voiceWs && _voiceWs.readyState === 1) _voiceWs.send(event.data);
        } catch (_e) {}
      };
      src.connect(node);
      micWorkletNode = node;
      micNodes = { src, node };
      micOn = true;
      captureGen++;
      localStorage.setItem('voice.micOn', '1');
      accumulated = '';
      lastFinalTurnId = '';
      bargeTurnId = '';
      clearVoicePeek();
      if (autoSendTimer) { clearTimeout(autoSendTimer); autoSendTimer = null; }
      lastSpeechAt = 0;
      lastLang = '';
      sending = false;
      mutePendingSend = false;
      hideHint();
      updateMicBtn();
      try { setBootLoading(false); } catch (_e) {}
      setStatus('listening', 'Listening');
      send('mic', { mic: true });
      if (questionTimer) { clearInterval(questionTimer); questionTimer = null; }
      questionTimer = setInterval(pollVoiceQuestions, 2000);
      pollVoiceQuestions();
      stream.getAudioTracks().forEach((track) => {
        track.addEventListener('muted', onTrackMuted);
      });
    } catch (e) {
      console.error('[Voice] capture start failed', e);
      micOn = false;
      liveSessionReady = false;
      stopLiveSession();
      if (s) { s.getTracks().forEach((track) => track.stop()); stream = null; }
      if (micNodes) { try { micNodes.src.disconnect(); } catch(_e){} micNodes = null; }
      if (micWorkletNode) { try { micWorkletNode.disconnect(); } catch(_e){} micWorkletNode = null; }
      analyser = null; freqBuf = null; levelBuf = null;
      localStorage.setItem('voice.micOn', '0');
      updateMicBtn();
      setStatus('error', 'Capture failed — ' + String(e.message || e));
      send('mic', { mic: false });
    } finally {
      startInFlight = false;
    }
  }

  function stopListening() {
    // Mic toggle = capture control ONLY. It must never abort the in-flight
    // LLM run: turning the mic off while the agent answers keeps the chat
    // trace alive.
    captureGen++;
    micOn = false;
    liveSessionReady = false;
    localStorage.setItem('voice.micOn', '0');
    clearTimeout(roundTimer);
    if (autoSendTimer) { clearTimeout(autoSendTimer); autoSendTimer = null; }
    clearVoicePeek();
    if (questionTimer) { clearInterval(questionTimer); questionTimer = null; }
    answeringBatch = null;
    stopLiveSession();
    if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
    // Disconnect mic nodes but keep the shared auCtx alive — TTS playback
    // uses the same context and must survive mic-off.
    if (micNodes) {
      try { micNodes.src.disconnect(); } catch(_e){}
      try { micNodes.node.disconnect(); } catch(_e){}
      micNodes = null;
    }
    if (micWorkletNode) {
      try { micWorkletNode.port.onmessage = null; micWorkletNode.disconnect(); } catch(_e){}
      micWorkletNode = null;
    }
    analyser = null; freqBuf = null; levelBuf = null;
    stopSpeaking();
    mutePendingSend = false;
    accumulated = '';
    hideHint();
    updateMicBtn();
    setStatus('muted', '');
    send('mic', { mic: false });
  }

  // Manual send: immediately submits whatever is currently accumulated.
  // Explicit user action — supersedes any in-flight run (it goes stale).
  function sendNow() {
    const text = accumulated.trim();
    if (!text) return;
    accumulated = '';
    clearVoicePeek();
    if (autoSendTimer) { clearTimeout(autoSendTimer); autoSendTimer = null; }
    hideHint();
    if (thinking && abortRef) { runSeq++; try { abortRef.abort(); } catch (_e) {} abortRef = null; thinking = false; }
    if (speaking) stopSpeaking();
    sendText(text);
  }

  micBtn.addEventListener('click', () => { micOn ? stopListening() : startListening(); });
  menuBtn.addEventListener('click', (e) => { e.stopPropagation(); setMenuOpen(!menuOpen); });
  menuClose.addEventListener('click', () => { stopListening(); if (bridge) bridge.close(); else window.close(); });
  menuVoice.addEventListener('click', (e) => {
    e.stopPropagation();
    renderVoiceMenu();
    voiceMenu.style.display = voiceMenu.style.display === 'none' ? '' : 'none';
  });
  menuDetail.addEventListener('click', () => { setMenuOpen(false); setExpanded(true); });
  menuScreen.addEventListener('click', (e) => {
    e.stopPropagation();
    setMenuOpen(false);
    if (screenActive()) exitScreenMode(); else enterScreenMode();
  });
  menuShare.addEventListener('click', (e) => {
    e.stopPropagation();
    setMenuOpen(false);
    setSharingMode(screenSharing === 'off' ? 'on' : 'off');
  });
  menuContinuous.addEventListener('click', (e) => {
    e.stopPropagation();
    setMenuOpen(false);
    setSharingMode(screenSharing === 'continuous' ? 'on' : 'continuous');
  });
  screenMic.addEventListener('click', () => { micOn ? stopListening() : startListening(); });
  screenSend.addEventListener('click', sendNow);
  screenSourceBtn.addEventListener('click', () => openScreenPicker(false));
  screenPickerClose.addEventListener('click', closeScreenPicker);
  screenExitBtn.addEventListener('click', () => exitScreenMode());
  screenPreviewBtn.addEventListener('click', () => togglePreviewPop());
  screenPopClose.addEventListener('click', () => togglePreviewPop(false));
  // Chip body opens the live preview; × stops sharing (stays in the panel).
  screenChip.addEventListener('click', () => togglePreviewPop());
  screenChipX.addEventListener('click', (e) => {
    e.stopPropagation();
    setSharingMode('off');
  });
  screenPreviewAction.addEventListener('click', () => {
    const st = screenPreviewAction.dataset.state || 'off';
    if (st === 'paused') setSharingMode('on');
    else if (st === 'error') startScreenShare();
    else openScreenPicker(false);
  });
  sendBtn.addEventListener('click', sendNow);
  replayArea.addEventListener('click', replayLast);
  closeBtn.addEventListener('click', () => { stopListening(); if (bridge) bridge.close(); else window.close(); });
  expandBtn.addEventListener('click', () => setExpanded(!expanded));

  // Voice menu open/close
  voiceBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    renderVoiceMenu();
    voiceMenu.style.display = voiceMenu.style.display === 'none' ? '' : 'none';
  });
  document.addEventListener('click', (e) => {
    if (!voiceMenu.contains(e.target) && e.target !== voiceBtn && e.target !== menuVoice) voiceMenu.style.display = 'none';
  });

  // Resume AudioContext on first interaction (needed if it started suspended)
  window.addEventListener('pointerdown', () => { if (auCtx && auCtx.state === 'suspended') auCtx.resume(); });

  // ── WS live relay (transcript push + flush) — HTTP peek/send is fallback ──
  // Server pushes {type:"transcript"} on change (~150ms tick); client flushes
  // the round with {type:"send"} → {type:"final"}. Same strings as the HTTP
  // path, just no 300-500ms poll. Reconnects with backoff when down.
  let _voiceWs = null;
  let _wsFlushWaiters = [];
  function openVoiceWs() {
    try {
      const wsUrl = API.replace(/^http/, 'ws') + '/api/voice/ws';
      const ws = new WebSocket(wsUrl);
      _voiceWs = ws;
      ws.onopen = () => {
        try { ws.send(JSON.stringify({ type: 'ping' })); } catch(_e) {}
        // If the socket reconnects while the mic is already on, restart the
        // Rust STT session automatically; the worklet keeps producing PCM.
        if (micOn) {
          startLiveSession(6000).then(() => {
            if (micOn) setStatus('listening', accumulated || 'Listening');
          }).catch((e) => {
            if (micOn) setStatus('error', 'STT reconnect failed');
            console.error('[Voice] STT reconnect failed', e);
          });
        }
      };
      ws.onmessage = (ev) => {
        try {
          if (typeof ev.data !== 'string') return;
          const msg = JSON.parse(ev.data);
          if (!msg || !msg.type) return;
          if (msg.type === 'session.ready') {
            liveSessionReady = true;
            resolveLiveSession();
          } else if (msg.type === 'session.error') {
            liveSessionReady = false;
            resolveLiveSession(msg.error || 'Voice session failed');
            if (micOn) setStatus('error', 'STT unavailable');
          } else if (msg.type === 'session.stopped') {
            liveSessionReady = false;
          } else if (msg.type === 'speech_started') {
            handleLiveSpeechStarted(msg);
          } else if (msg.type === 'turn_final') {
            liveSessionReady = true;
            handleLiveTurnFinal(msg);
          } else if (msg.type === 'transcript') {
            const t = (msg.text || '').trim();
            if (t) maybeBargeIn(t, msg.turn_id || '');
            if (t && t !== lastPeekTextRef()) {
              setLastPeekText(t);
              accumulated = t;
              setStatus('listening', t);
              send('transcript', { text: t, final: false, turnId: msg.turn_id || '' });
              showHint();
            }
          } else if (msg.type === 'final') {
            const waiters = _wsFlushWaiters.splice(0);
            const t = (msg.text || '').trim();
            waiters.forEach((w) => { try { w(t); } catch(_e){} });
          } else if (msg.type === 'interrupted') {
            // ack, nothing to do
          } else if (msg.type === 'screen-capture') {
            onScreenCaptureRequest(msg.req_id || '').catch(() => {});
          } else if (msg.type === 'screen-mode') {
            onScreenModeRequest(msg.req_id || '', msg.mode).catch(() => {});
          }
        } catch(_e) {}
      };
      ws.onclose = () => {
        if (_voiceWs === ws) _voiceWs = null;
        liveSessionReady = false;
        resolveLiveSession('voice connection closed');
        // Fail open: HTTP fallback covers the gap; the overlay heartbeat
        // below reconnects (no backoff chain — one timer owns supervision).
        const waiters = _wsFlushWaiters.splice(0);
        waiters.forEach((w) => { try { w(null); } catch(_e){} });
        if (micOn) setStatus('error', 'Voice connection lost');
        try { if (!hbTimer) hbTimer = setInterval(overlayHeartbeat, 500); } catch(_e){}
      };
      ws.onerror = () => { try { ws.close(); } catch(_e){} };
    } catch(_e) {}
  }
  // oneRound's peek timer reads this; WS handler writes it. Function refs
  // avoid temporal-dead-zone issues (openVoiceWs is defined after oneRound).
  function lastPeekTextRef() { try { return window.__lastPeekText || ''; } catch(_e){ return ''; } }
  function setLastPeekText(t) { try { window.__lastPeekText = t; } catch(_e){} }
  function wsFlushRound(timeoutMs) {
    return new Promise((resolve) => {
      try {
        if (!_voiceWs || _voiceWs.readyState !== 1) { resolve(null); return; }
        const timer = setTimeout(() => {
          const i = _wsFlushWaiters.indexOf(done);
          if (i >= 0) _wsFlushWaiters.splice(i, 1);
          resolve(null); // fall back to HTTP on timeout
        }, timeoutMs || 1200);
        const done = (t) => { clearTimeout(timer); resolve(t); };
        _wsFlushWaiters.push(done);
        _voiceWs.send(JSON.stringify({ type: 'send' }));
      } catch(_e) { resolve(null); }
    });
  }
  // Opportunistically open (handshake verified, no impact on HTTP path).
  try { openVoiceWs(); } catch(_e) {}

  // Init
  updateMicBtn();
  setStatus('idle', 'Ctrl+G to toggle');
  // Normalize the native window after the HTML first paints so the initial
  // orb is the same compact size as it is after closing the menu.
  resizeOverlay();

  // Mirror transcript / reply text into the screen panel caption.
  try {
    if (window.MutationObserver && textEl) {
      new MutationObserver(syncScreenCaption).observe(textEl, { childList: true, characterData: true, subtree: true });
    }
  } catch (_e) {}

  // Design-QA hook: open voice.html?demo=screen|picker|paused|off in a plain
  // browser to preview the panel without the desktop bridge (screenshots).
  try {
    const demo = new URLSearchParams(location.search).get('demo');
    if (demo) {
      document.body.classList.add('is-demo');
      enterScreenMode();
      setTimeout(() => {
        screenSourceLabel = 'Chrome — Attention Is All You Need (paper)';
        screenCaptionRole.textContent = 'READING';
        screenCaptionText.textContent = 'Highlighted: “scaled dot-product attention” — explain it simply';
        lastStatusKey = 'listening';
        document.body.classList.remove('state-idle');
        document.body.classList.add('state-listening');
        syncScreenCaption();
        updateScreenChip();
        if (demo === 'off') {
          screenSourceLabel = '';
          updateScreenChip();
          setPreviewState('off', 'Share your screen so the agent can see it');
        } else if (demo === 'paused') {
          paintDemoPreview();
          setPreviewState('paused', 'Paused — the agent can’t see your screen');
        } else {
          paintDemoPreview();
          setPreviewState('live');
          togglePreviewPop(true);
        }
        if (demo === 'picker') {
          screenPicker.dataset.first = '';
          screenPicker.classList.add('open');
          renderScreenPicker([
            { id: 'screen:0:0', kind: 'screen', name: 'Entire Screen', thumbnail: screenPreview.style.backgroundImage.slice(5, -2) },
            { id: 'screen:1:0', kind: 'screen', name: 'Screen 2 — Dell U2723QE', thumbnail: screenPreview.style.backgroundImage.slice(5, -2) },
            { id: 'window:1', kind: 'window', name: 'Attention Is All You Need — Chrome', thumbnail: screenPreview.style.backgroundImage.slice(5, -2) },
            { id: 'window:2', kind: 'window', name: 'voice.html — Electron', thumbnail: '' },
          ]);
        }
      }, 80);
    }
  } catch (_e) {}

  // ── Lazy TTS: warm on open (loading spinner on mic btn), free on close ──
  // One overlay heartbeat (500ms) owns both TTS warm-status and WS
  // supervision — a single timer instead of a poller + a backoff chain.
  // It parks itself once warm AND socket-live; ws.onclose restarts it.
  let ttsWarm = false;
  let hbTimer = null;
  // Boot loading — visual-only, no pipeline/TTS/WS flow change. Shown on
  // every overlay open (first time + after close/reopen, which is always a
  // cold page load with TTS/ASR released). Cleared by the heartbeat once
  // warm + socket-live, or by mic-live, or by a fail-safe timeout.
  let bootCleared = false;
  function setBootLoading(on) {
    try {
      if (on) {
        if (bootCleared) return;
        document.body.classList.add('is-booting');
        // Don't stomp a live status (listening/speaking/thinking); only fill
        // the default blank label so reopen never looks empty-white.
        const cur = (textEl && textEl.textContent || '').trim();
        if (!cur || cur === 'Ctrl+G to toggle') textEl.textContent = 'Warming voice…';
        // Gentle shimmer behind the spinner so the wave isn't dead static.
        // startWave sends nothing — pure RAF visuals.
        try { startWave('thinking'); } catch (_e) {}
      } else {
        bootCleared = true;
        document.body.classList.remove('is-booting');
      }
    } catch (_e) {}
  }
  function maybeClearBoot() {
    if (bootCleared) return;
    const wsLive = _voiceWs && _voiceWs.readyState === 1;
    const micLive = micOn || speaking || thinking;
    if ((ttsWarm && wsLive) || micLive) {
      setBootLoading(false);
      // If nothing took over the status yet, park the wave back to idle so
      // the boot shimmer doesn't linger under the Voice label.
      try {
        const cur = (textEl && textEl.textContent || '').trim();
        if (!micLive && (cur === 'Warming voice…' || cur === 'Starting…')) {
          textEl.textContent = 'Voice';
          startWave('idle');
        }
      } catch (_e) {}
    }
  }
  function startTtsLoading() {
    if (ttsWarm) return;
    setBootLoading(true);
    micBtn.classList.add('loading');
    // Kick the warm-up (idempotent on the server).
    fetch(API + '/api/voice/warm_tts', { method: 'POST' }).catch(() => {});
    if (!hbTimer) hbTimer = setInterval(overlayHeartbeat, 500);
  }
  async function overlayHeartbeat() {
    // 1) TTS warm status (until warm).
    if (!ttsWarm) {
      try {
        const r = await fetch(API + '/api/voice/tts_status');
        const d = await r.json().catch(() => ({}));
        if (d && d.tts_warm) {
          ttsWarm = true;
          micBtn.classList.remove('loading');
          updateMicBtn();
        }
      } catch (_e) {}
    }
    // 2) WS supervision: reconnect when down/closed (0 = connecting, wait).
    try {
      if (!_voiceWs || _voiceWs.readyState === 3) openVoiceWs();
    } catch (_e) {}
    // 2b) Boot loading is visual-only — clear once warm + live, or mic-live.
    try { maybeClearBoot(); } catch (_e) {}
    // 3) Park when nothing left to supervise.
    if (ttsWarm && _voiceWs && _voiceWs.readyState === 1) {
      clearInterval(hbTimer);
      hbTimer = null;
    }
  }
  function releaseTts() {
    if (hbTimer) { clearInterval(hbTimer); hbTimer = null; }
    // Best-effort free (fire-and-forget) — close-triggered only. ASR too so
    // overlay-close returns the fallback ONNX sessions as well as the TTS GB.
    try { stopScreenShare(); } catch (_e) {}
    fetch(API + '/api/voice/release_tts', { method: 'POST' }).catch(() => {});
    fetch(API + '/api/voice/release_asr', { method: 'POST' }).catch(() => {});
  }
  startTtsLoading();
  // Fail-safe: never wedge the overlay in boot pulse if the backend is down.
  // Visual-only — TTS warm spinner + WS retry continue independently.
  setTimeout(() => { try { setBootLoading(false); } catch (_e) {} }, 20000);
  window.addEventListener('beforeunload', releaseTts);
  if (bridge && bridge.onClose) bridge.onClose(releaseTts);

  if (localStorage.getItem('voice.micOn') === '1' && !document.body.classList.contains('is-demo')) {
    setTimeout(startListening, 400);
  }
})();
</script>
</body>
</html>
