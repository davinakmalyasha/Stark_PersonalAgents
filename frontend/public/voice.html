<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
body {
  background: transparent;
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  overflow: hidden;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  --accent: #b6c2d4;
  --accent-soft: rgba(182, 194, 212, 0.28);
  --accent-bg: rgba(182, 194, 212, 0.1);
}
body.state-listening { --accent: #9fc1f0; --accent-soft: rgba(159, 193, 240, 0.3); --accent-bg: rgba(159, 193, 240, 0.1); }
body.state-thinking { --accent: #c3b3e8; --accent-soft: rgba(195, 179, 232, 0.3); --accent-bg: rgba(195, 179, 232, 0.1); }
body.state-processing { --accent: #b18be8; --accent-soft: rgba(177, 139, 232, 0.34); --accent-bg: rgba(177, 139, 232, 0.12); }
body.state-speaking { --accent: #9be1e6; --accent-soft: rgba(155, 225, 230, 0.32); --accent-bg: rgba(155, 225, 230, 0.1); }
body.state-muted   { --accent: #6b7686; --accent-soft: rgba(107, 118, 134, 0.25); --accent-bg: rgba(107, 118, 134, 0.08); }
body.state-error   { --accent: #f2a0a0; --accent-soft: rgba(242, 160, 160, 0.35); --accent-bg: rgba(242, 160, 160, 0.12); }

.container {
  position: relative;
  width: 100%;
  height: 100%;
  background: transparent;
  border: 0;
  border-radius: 0;
  padding: 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  box-shadow: none;
  -webkit-app-region: drag;
  transition: border-color 0.5s ease, border-radius 0.25s ease;
  overflow: hidden;
}
.main-row { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 100%; height: 100%; flex-shrink: 0; transition: opacity 0.2s ease, transform 0.2s ease; }
.container::before {
  content: '';
  position: absolute;
  top: 0; left: 6%; right: 6%;
  height: 1px;
  display: none;
  pointer-events: none;
}
body.state-listening .container,
body.state-thinking .container,
body.state-processing .container,
body.state-speaking .container { border-color: transparent; }
body.state-error .container { border-color: rgba(242, 160, 160, 0.4); animation: errFade 0.9s ease 2; }
@keyframes errFade { 50% { border-color: rgba(242, 160, 160, 0.7); } }

/* soft idle sweep */
.scan {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.025) 46%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0.025) 54%, transparent 100%);
  transform: translateY(-110%);
}
body.state-idle .scan { opacity: 1; animation: scan 8s linear infinite 3s; }
@keyframes scan {
  0% { transform: translateY(-110%); }
  45%, 60% { transform: translateY(110%); }
  100% { transform: translateY(110%); }
}

button { -webkit-app-region: no-drag; cursor: pointer; border: none; outline: none; }

/* ── Live bars toggle (voice-level equalizer) ── */
.bars-btn {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  border: 1px solid rgba(226, 232, 240, 0.95);
  box-shadow: 0 6px 18px rgba(15, 23, 42, 0.2);
  transition: transform 0.25s ease;
}
.bars-btn:hover { transform: scale(1.06); }
.bars-btn:active { transform: scale(0.93); }

/* soft halo behind the bars */
.bars-btn::before {
  content: '';
  position: absolute;
  inset: -9px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent-soft), transparent 70%);
  filter: blur(9px);
  display: none;
  transition: opacity 0.6s ease;
}
body.state-listening .bars-btn::before,
body.state-thinking .bars-btn::before,
body.state-processing .bars-btn::before,
body.state-speaking .bars-btn::before { opacity: 0.65; }

.bars {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3.5px;
  height: 26px;
}
.bars i {
  display: block;
  width: 3.5px;
  height: 8px;
  border-radius: 2px;
  background: #0f172a;
  box-shadow: none;
  transition: height 0.12s linear, background 0.5s ease, opacity 0.5s ease;
}
body.state-muted .bars i { opacity: 0.35; }

/* ripple rings — speaking / listening */
.orb-ripple { position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--accent); opacity: 0; pointer-events: none; transition: border-color 0.5s ease; }
body.state-speaking .orb-ripple { animation: rippleOut 2s ease-out infinite; }
body.state-speaking .orb-ripple.r2 { animation-delay: 1s; }
body.state-listening .orb-ripple { animation: rippleOut 2.8s ease-out infinite; }
@keyframes rippleOut { 0% { transform: scale(1); opacity: 0.4; } 100% { transform: scale(1.9); opacity: 0; } }

/* ── TTS warm-up loading (mic button only — clean black spinner line) ── */
.bars-btn.loading { pointer-events: none; }
.bars-btn.loading::after {
  content: '';
  position: absolute;
  inset: 11px;
  border-radius: 50%;
  border: 2.5px solid transparent;
  border-top-color: #0f172a;
  animation: spin 0.9s linear infinite;
  opacity: 1;
  transition: opacity 0.35s ease;
}
.bars-btn.loading::before { display: none; }
.bars-btn.loading .bars { opacity: 0; transition: opacity 0.35s ease; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Boot loading (first open / reopen before TTS warm + WS live) ── */
/* Visual-only: no flow change. Orb keeps its white face, spinner stays
   visible, label gently pulses so the overlay never looks blank-white. */
body.is-booting #voice-text { color: #94a3b8; animation: bootPulse 1.1s ease-in-out infinite; }
@keyframes bootPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

/* ── Info column ── */
.info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.status-row { display: flex; align-items: center; gap: 7px; min-width: 0; }
.pip {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent-soft);
  transition: background 0.5s ease, box-shadow 0.5s ease;
}
.pip.listening { animation: pipPulse 1.2s ease-in-out infinite; }
.pip.thinking { animation: pipPulse 1s ease-in-out infinite; }
.pip.processing { animation: pipPulse 0.8s ease-in-out infinite; }
.pip.speaking { animation: pipPulse 0.7s ease-in-out infinite; }
@keyframes pipPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.label {
  color: #334155;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  white-space: nowrap;
}
.label.swap { animation: labelSwap 0.3s ease; }
@keyframes labelSwap { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

.ellipsis { display: inline-flex; gap: 2.5px; opacity: 0; transition: opacity 0.4s ease; }
.ellipsis i { width: 3px; height: 3px; border-radius: 50%; background: var(--accent); animation: blink 1.3s ease-in-out infinite; transition: background 0.5s ease; }
.ellipsis i:nth-child(2) { animation-delay: 0.2s; }
.ellipsis i:nth-child(3) { animation-delay: 0.4s; }
body.state-listening .ellipsis, body.state-thinking .ellipsis, body.state-processing .ellipsis, body.state-speaking .ellipsis { opacity: 1; }
@keyframes blink { 0%, 100% { opacity: 0.15; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }

/* activity hairline — L / T / A */
.stages { display: flex; gap: 3px; margin-left: auto; align-items: center; flex-shrink: 0; }
.stage {
  width: 13px;
  height: 2.5px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.09);
  transition: background 0.4s ease, box-shadow 0.4s ease;
}
.stage.on { background: var(--accent); box-shadow: 0 0 6px var(--accent-soft); }

.mid-row { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; min-width: 0; -webkit-app-region: no-drag; cursor: pointer; border-radius: 8px; padding: 2px 4px; margin: 0 -4px; transition: background 0.25s ease; }
.mid-row:hover { background: rgba(255, 255, 255, 0.03); }

#wave { width: 48px; height: 20px; flex-shrink: 0; opacity: 0.85; }
#wave.fade-in { animation: waveIn 0.3s ease; }
@keyframes waveIn { from { opacity: 0.25; transform: scale(0.97); } to { opacity: 0.85; transform: none; } }

.text-wrap { flex: 1; min-width: 0; overflow: hidden; }
.text {
  display: inline-block;
  color: #64748b;
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.35;
  max-width: 86px;
  letter-spacing: 0.01em;
}
.text.marquee { text-overflow: clip; animation: marquee 10s linear infinite alternate; }
.text-wrap:hover .text.marquee { animation-play-state: paused; }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(var(--tx, -120px)); } }

.hint { display: none; color: #64748b; font-size: 10px; white-space: nowrap; flex-shrink: 0; letter-spacing: 0.02em; }

/* ── Action buttons ── */
.btn {
  width: 25px;
  height: 25px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  color: #64748b;
  transition: all 0.2s ease;
}
.btn:hover { background: #e2e8f0; color: #334155; transform: translateY(-1px); }
.btn:active { transform: scale(0.9); }
.btn svg { width: 13px; height: 13px; }

.send-btn {
  background: var(--accent-bg);
  border-color: var(--accent-soft);
  color: var(--accent);
  animation: sendIn 0.25s ease;
}
.send-btn:hover { background: var(--accent-bg); color: var(--accent); }
@keyframes sendIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.close-btn { width: 24px; height: 24px; font-size: 12px; line-height: 1; }

.expand-btn svg { transition: transform 0.3s ease; }
.expand-btn.expanded svg { transform: rotate(180deg); }
.expand-btn.expanded { color: var(--accent); border-color: var(--accent-soft); }

/* ── Live process feed (expanded view) ── */
.feed-wrap {
  width: 100%;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-top: 1px solid rgba(255, 255, 255, 0.07);
  padding-top: 6px;
}
.feed-head { display: flex; justify-content: space-between; align-items: center; padding: 0 2px 4px; -webkit-app-region: no-drag; }
.feed-live { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; color: var(--accent); display: flex; gap: 5px; align-items: center; }
.feed-live i { width: 5px; height: 5px; border-radius: 50%; background: #f87171; animation: blink 1s ease-in-out infinite; }
.feed-status { font-size: 9.5px; color: #5b6472; letter-spacing: 0.04em; }
.feed {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  font-family: Consolas, 'Cascadia Mono', 'Courier New', monospace;
  font-size: 10.5px;
  line-height: 1.5;
  color: #8b93a1;
  -webkit-app-region: no-drag;
}
.feed-line { padding: 1px 2px; white-space: pre-wrap; word-break: break-word; }
.feed-line.user { color: #e2e8f0; }
.feed-line.thought { color: #c3b3e8; }
.feed-line.agent { color: #9fc1f0; }
.feed-line.tool { color: #9be1e6; }
.feed-line.error { color: #f2a0a0; }
.feed-line.meta { color: #6b7686; }
.feed::-webkit-scrollbar { width: 4px; }
.feed::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 2px; }

/* Right-side vertical button stack */
.side-col { display: flex; flex-direction: row; gap: 4px; align-items: center; justify-content: center; width: 100%; flex-shrink: 0; }
.side-row { display: contents; }

/* ── Voice menu ── */
.voice-menu {
  position: fixed;
  right: 40px;
  bottom: 6px;
  background: rgba(15, 15, 20, 0.95);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 12px;
  padding: 5px;
  z-index: 50;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
  -webkit-app-region: no-drag;
  max-height: 250px;
  overflow-y: auto;
}
.voice-menu-head {
  padding: 4px 9px 2px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #5b6472;
}
.voice-menu button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 5px 9px;
  border-radius: 7px;
  font-size: 11px;
  color: #9aa1ad;
  background: transparent;
  white-space: nowrap;
}
.voice-menu button:hover { background: var(--accent-bg); color: #e2e8f0; }
.voice-menu button.active { color: var(--accent); }

/* The live process feed needs the original wide layout when expanded. */
body.is-expanded .container {
  border-radius: 16px;
  padding: 8px 10px;
  gap: 6px;
}
body.is-expanded .main-row {
  flex-direction: row;
  align-items: center;
  justify-content: initial;
  gap: 10px;
  width: 100%;
  height: auto;
}
body.is-expanded .bars-btn { width: 52px; height: 52px; }
body.is-expanded .info { flex: 1; width: auto; align-items: initial; }
body.is-expanded .status-row { justify-content: initial; }
body.is-expanded .mid-row { justify-content: initial; width: auto; gap: 7px; }
body.is-expanded #wave { width: 80px; height: 24px; }
body.is-expanded .text { max-width: 100%; font-size: 11px; }
body.is-expanded .hint { display: inline; }
body.is-expanded .side-col { flex-direction: column; gap: 6px; align-items: flex-end; width: auto; }
body.is-expanded .side-row { display: flex; gap: 6px; align-items: center; }
body.is-expanded .btn { width: 28px; height: 28px; }
body.is-expanded .feed-wrap { border-top-color: #e2e8f0; }
body.is-expanded .feed { color: #64748b; }
body.is-expanded .feed-line.user { color: #334155; }
body.is-expanded .feed-line.thought { color: #7c3aed; }
body.is-expanded .feed-line.agent { color: #2563eb; }
body.is-expanded .feed-line.tool { color: #0f766e; }

/* ── Compact orb ── */
.menu-toggle {
  position: absolute;
  top: 7px;
  right: 7px;
  z-index: 4;
  width: 22px;
  height: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.5px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid rgba(148, 163, 184, 0.28);
  box-shadow: 0 3px 10px rgba(15, 23, 42, 0.16);
  color: #64748b;
  transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
}
.menu-toggle:hover { transform: scale(1.08); background: #f8fafc; color: #1e293b; }
.menu-toggle:active { transform: scale(0.94); }
.menu-toggle i { display: block; width: 9px; height: 1.5px; border-radius: 2px; background: currentColor; }
.menu-toggle.active { background: #f1f5f9; color: #334155; }

body:not(.is-menu-open):not(.is-expanded) .container {
  padding: 0;
  border-radius: 0;
}
body:not(.is-menu-open):not(.is-expanded) .main-row {
  flex-direction: row;
  height: 100%;
  justify-content: center;
}
body:not(.is-menu-open):not(.is-expanded) .info,
body:not(.is-menu-open):not(.is-expanded) .side-col { display: none; }
body:not(.is-menu-open):not(.is-expanded) .bars-btn { width: 52px; height: 52px; }

/* ── Compact utility panel ── */
body.is-menu-open .container {
  border-radius: 24px;
  padding: 12px 13px;
}
body.is-menu-open .main-row {
  flex-direction: row;
  height: auto;
  justify-content: initial;
  gap: 9px;
}
body.is-menu-open .bars-btn { width: 48px; height: 48px; }
body.is-menu-open .info { display: flex; flex: 1; width: auto; }
body.is-menu-open .status-row { justify-content: initial; }
body.is-menu-open .mid-row { justify-content: initial; width: auto; gap: 5px; }
body.is-menu-open #wave { width: 48px; height: 20px; }
body.is-menu-open .text { max-width: 88px; }
body.is-menu-open .side-col { display: flex; flex-direction: row; width: auto; gap: 4px; }
body.is-menu-open .side-row { display: contents; }
body.is-menu-open .btn { width: 25px; height: 25px; }

/* ── Hamburger menu: menu-only surface, never the old overlay layout ── */
.menu-panel {
  display: none;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  padding: 28px 8px 8px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 18px;
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.2);
  -webkit-app-region: drag;
}
body.is-menu-open .container {
  padding: 0;
  border-radius: 0;
  overflow: visible;
}
body.is-menu-open .main-row {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  justify-content: flex-end;
  width: 100%;
  height: 100%;
  padding-top: 15px;
  padding-right: 8px;
  position: relative;
  z-index: 3;
}
body.is-menu-open .info,
body.is-menu-open .side-col { display: none; }
body.is-menu-open .bars-btn { width: 54px; height: 54px; }
body.is-menu-open .menu-panel {
  display: flex;
  position: absolute;
  top: 6px;
  left: 0;
  width: 210px;
  height: calc(100% - 12px);
  padding: 10px;
  z-index: 5;
  animation: menuSeparate 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes menuSeparate {
  from { opacity: 0; transform: translateX(14px) scale(0.96); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}
body.is-menu-closing .menu-panel {
  animation: menuCollapse 1.2s cubic-bezier(0.4, 0, 0.2, 1) both;
  pointer-events: none;
}
@keyframes menuCollapse {
  from { opacity: 1; transform: translateX(0) scale(1); }
  to { opacity: 0; transform: translateX(14px) scale(0.96); }
}
body.is-menu-open .menu-toggle { top: 6px; right: 1px; }
.menu-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 32px;
  padding: 0 10px;
  border-radius: 9px;
  background: transparent;
  color: #1e293b;
  font: 500 12px/1 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  letter-spacing: 0.01em;
  text-align: left;
  -webkit-app-region: no-drag;
  transition: background 0.15s ease, color 0.15s ease;
}
.menu-item:hover { background: #f1f5f9; color: #0f172a; }
.menu-item:active { background: #e2e8f0; }
.menu-item b { color: #94a3b8; font-size: 18px; font-weight: 400; line-height: 0.7; }
body.is-menu-open .voice-menu {
  right: 8px;
  bottom: 8px;
  background: #ffffff;
  border-color: #e2e8f0;
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.2);
}
body.is-menu-open .voice-menu-head { color: #64748b; }
body.is-menu-open .voice-menu button { color: #334155; }
body.is-menu-open .voice-menu button:hover { background: #f1f5f9; color: #0f172a; }

/* ── Look-at-screen mode — Gemini-style dark glass panel ──
   The compact orb morphs into a screen-share panel: window grows first
   (resizeOverlay), then .screen-panel fades/scales in while .main-row fades
   out. Exit plays the reverse before the window shrinks back. */
.screen-panel {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: none;
  flex-direction: column;
  gap: 8px;
  padding: 12px 12px 10px;
  border-radius: 18px;
  background: linear-gradient(160deg, rgba(21, 25, 37, 0.97), rgba(11, 14, 22, 0.98));
  border: 1px solid rgba(255, 255, 255, 0.09);
  box-shadow: 0 18px 50px rgba(2, 6, 18, 0.55), 0 0 calc(var(--voice-level, 0) * 22px) rgba(122, 167, 255, 0.35);
  color: #e6eaf3;
  -webkit-app-region: drag;
  opacity: 0;
  transform: translateY(10px) scale(0.97);
  transform-origin: 100% 0;
  pointer-events: none;
  transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.2, 0.85, 0.25, 1), box-shadow 0.25s ease;
  --voice-level: 0;
}
body.is-screen .screen-panel { display: flex; }
body.is-screen:not(.is-screen-closing) .screen-panel {
  opacity: 1;
  transform: none;
  pointer-events: auto;
}
/* Staggered child entrance (C12) */
body.is-screen:not(.is-screen-closing) .screen-head { animation: panelChildIn 0.34s cubic-bezier(0.2, 0.85, 0.25, 1) both; }
body.is-screen:not(.is-screen-closing) .screen-caption { animation: panelChildIn 0.34s cubic-bezier(0.2, 0.85, 0.25, 1) 0.045s both; }
body.is-screen:not(.is-screen-closing) .screen-chips { animation: panelChildIn 0.34s cubic-bezier(0.2, 0.85, 0.25, 1) 0.09s both; }
body.is-screen:not(.is-screen-closing) .screen-foot { animation: panelChildIn 0.34s cubic-bezier(0.2, 0.85, 0.25, 1) 0.135s both; }
@keyframes panelChildIn {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: none; }
}
body.is-screen .main-row {
  opacity: 0;
  transform: scale(0.92);
  pointer-events: none;
}
body.is-screen .bars-btn .orb-ripple { animation: none; }
body.is-screen .menu-toggle { top: 10px; right: 10px; }

        <video id="screen-video" autoplay muted playsinline></video>
        <img id="screen-native" alt="" />

          <div id="screen-spinner" class="screen-spinner" style="display:none"></div>
          <div id="screen-preview-empty" class="screen-preview-empty">No screen shared</div>
          <button id="screen-preview-action" class="screen-preview-action" type="button" style="display:none">Share screen</button>

  </div>

  <div id="screen-picker" class="screen-picker" aria-hidden="true">
    <div class="screen-picker-head">
      <span>What should the agent see?</span>

    </div>

  <div class="scan"></div>
</div>
<script>
(function () {
  'use strict';

  const API = 'http://127.0.0.1:' + ((window.voiceBridge && window.voiceBridge.getStarkPort) ? window.voiceBridge.getStarkPort() : '8123');
  const $ = (id) => document.getElementById(id);
  const dot = $('dot'), label = $('label'), textEl = $('voice-text');
  const micBtn = $('mic-btn');
  const menuBtn = $('menu-btn');
  const menuPanel = $('menu-panel');
  const menuClose = $('menu-close');
  const menuVoice = $('menu-voice');
  const menuDetail = $('menu-detail');
  const closeBtn = $('close-btn');
  const wave = $('wave'), wctx = wave.getContext('2d');
  const hintEl = $('hint');
  const sendBtn = $('send-btn');
  const voiceBtn = $('voice-btn');
  const voiceMenu = $('voice-menu');
  const replayArea = $('replay-area');
  const barsEl = $('bars-icon');
  const barEls = barsEl ? barsEl.children : null;
  const expandBtn = $('expand-btn');
  const feedWrap = $('feed-wrap');
  const feed = $('feed');
  const feedStatus = $('feed-status');
  // Look-at-screen mode refs
  const menuScreen = $('menu-screen');
  const menuShare = $('menu-share');
  const menuContinuous = $('menu-continuous');
  const screenPanel = $('screen-panel');
  const screenVideo = $('screen-video');
  const screenNative = $('screen-native');
  const screenPreview = $('screen-preview');
  const screenPreviewEmpty = $('screen-preview-empty');
  const screenSourceBtn = $('screen-source-btn');
  const screenCaptionText = $('screen-caption-text');
  const screenCaptionRole = $('screen-caption-role');
  const screenPreviewState = $('screen-preview-state');
  const screenSpinner = $('screen-spinner');
  const screenPreviewAction = $('screen-preview-action');
  const screenStatusEl = $('screen-status');
  const screenBadge = $('screen-badge');
  const screenChips = $('screen-chips');
  const screenChip = $('screen-chip');
  const screenChipName = $('screen-chip-name');
  const screenChipX = $('screen-chip-x');
  const screenPreviewBtn = $('screen-preview-btn');
  const screenExitBtn = $('screen-exit-btn');
  const screenPreviewPop = $('screen-preview-pop');
  const screenPopName = $('screen-pop-name');
  const screenPopClose = $('screen-pop-close');
  const screenMic = $('screen-mic');
  const screenSend = $('screen-send');
  const screenFootBars = screenMic ? screenMic.querySelectorAll('.bars i') : null;
  const screenPicker = $('screen-picker');
  const screenPickerGrid = $('screen-picker-grid');
  const screenPickerClose = $('screen-picker-close');

  const bridge = window.voiceBridge || null;
  function send(type, payload) { if (bridge) bridge.sendEvent(Object.assign({ type: type }, payload || {})); }

  const VOICES = [
    { id: 'jarvis', name: 'JARVIS — cloned', lang: 'en' },
    { id: 'alba', name: 'Alba — female', lang: 'en' },
    { id: 'anna', name: 'Anna — female', lang: 'en' },
    { id: 'vera', name: 'Vera — female', lang: 'en' },
    { id: 'michael', name: 'Michael — male', lang: 'en' },
    { id: 'charles', name: 'Charles — male', lang: 'en' },
  ];
  let voice = localStorage.getItem('voice.voice') || 'jarvis';
  let voiceId = localStorage.getItem('voice.idVoice') || 'jarvis';
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Rough Indonesian vs English detection (Indonesian stopwords)
  const ID_WORDS = [
    'yang', 'di', 'ke', 'dari', 'dengan', 'untuk', 'saya', 'kamu', 'anda', 'ini', 'itu',
    'ada', 'tidak', 'apa', 'mengapa', 'bagaimana', 'sudah', 'akan', 'bisa', 'aku', 'kami',
    'mereka', 'kita', 'jangan', 'harus', 'mau', 'ingin', 'tolong', 'coba', 'pakai', 'buat',
    'kalau', 'karena', 'tetapi', 'juga', 'saja', 'perlu', 'belum', 'ya', 'iya', 'kenapa',
    'kapan', 'mana', 'yaitu', 'yakni', 'seperti', 'dalam', 'pada', 'oleh', 'atau', 'dan',
    'agar', 'supaya', 'boleh', 'bantu', 'tentang', 'gimana', 'nggak', 'gak',
  ];
  function detectLanguage(text) {
    const words = text.toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(Boolean);
    if (!words.length) return 'en';
    let count = 0;
    for (const w of words) if (ID_WORDS.indexOf(w) !== -1) count++;
    return count / words.length > 0.12 ? 'id' : 'en';
  }
  function voiceForLanguage(lang) { return lang === 'id' ? voiceId : voice; }

  let micOn = false;
  let startInFlight = false;
  let speaking = false;
  let incrementalTtsBuffer = '';  // settled sentences awaiting speak-out
  let ttsHeldUntil = 0;         // Phase 8-V1: sentence-settle debounce timestamp
  let thinking = false;
  let accumulated = '';
  let lastReply = '';
  let stream = null;
  let micNodes = null;      // {src, node} on the shared auCtx while the mic is on
  let analyser = null;
  let micWorkletNode = null;
  let liveSessionReady = false;
  let liveSessionWaiters = [];
  let lastFinalTurnId = '';
  let bargeTurnId = '';
  let bargeAt = 0;
  let answeringBatch = null; // ask_user batch currently answered by voice
  let questionTimer = null;   // /api/ask/pending poller while the mic is on
  let freqBuf = null;
  let levelBuf = null;
  // TTS output meter (visual-only tap — never in the audio path). Each
  // scheduled TTS BufferSource also connects to ttsAnalyser so the speaking
  // bars follow the agent's real voice instead of a random walk. Null until
  // the shared AudioContext exists; resident for overlay lifetime like auCtx.
  let ttsAnalyser = null;
  let ttsFreqBuf = null;
  let ttsLevelBuf = null;
  let roundTimer = null;
  let roundRunning = false;
  let abortRef = null;
  let ttsAbortRef = null;      // latest sentence fetch (barge-in aborts all via list too)
  const ttsAbortAll = [];      // every in-flight /api/tts/stream fetch
  let lastSpeechAt = 0;        // global: last time speech was heard (any round)
  let lastLang = '';           // 'id' | 'en' — STT language hint
  let sending = false;         // polish+send dispatch guard (short-lived, NOT held for whole run)
  let runSeq = 0;              // voice pipeline generation — only the latest run may write pipeline-done/trace
  let lastSentText = '';       // content dedupe: same transcript must never dispatch twice
  let lastSentAt = 0;
  let autoSendTimer = null;    // hands-free auto-send debounce (coalesces rapid round ends)
  let captureGen = 0;          // mic capture generation — stale rounds after toggle must not send
  function clearVoicePeek() { try { window.__lastPeekText = ''; } catch (_e) {} }
  let roundHasSpeech = false;  // current round captured speech
  let mutePendingSend = false; // hardware-mute pressed while a speech round runs
  let chatId = localStorage.getItem('voice.chatId') || '';
  let chatLock = null;
  let chatVerifiedAt = 0;      // cache verified (chatId,wsId) to skip re-verify per turn
  let chatVerifiedKey = '';

  // ── Per-stage timing marks (debug-gated, zero UI cost when off) ──
  // Enable: localStorage.setItem('voice.debug','1'). Shows
  // [vad +0][run +…][delta +…][tts +…][audio +…] in feed-status + console.
  const T_DEBUG = (function () { try { return localStorage.getItem('voice.debug') === '1'; } catch (_e) { return false; } })();
  let tMarks = {};
  function tReset() { tMarks = { t0: performance.now() }; }
  function tMark(name) {
    tMarks[name] = performance.now();
    if (!T_DEBUG) return;
    try {
      const b = tMarks.t0 || tMarks[name];
      const fmt = (k) => (tMarks[k] !== undefined ? Math.round(tMarks[k] - b) : null);
      const parts = ['vad +' + (fmt('vad') ?? 0) + 'ms'];
      if (fmt('run') !== null) parts.push('run +' + fmt('run') + 'ms');
      if (fmt('delta') !== null) parts.push('delta +' + fmt('delta') + 'ms');
      if (fmt('tts') !== null) parts.push('tts +' + fmt('tts') + 'ms');
      if (fmt('audio') !== null) parts.push('audio +' + fmt('audio') + 'ms');
      if (feedStatus) feedStatus.textContent = parts.join(' ');
      if (typeof console !== 'undefined' && console.debug) console.debug('[Voice][t] ' + name + ' ' + parts.join(' '));
    } catch (_e) {}
  }

  const audio = new Audio();
  audio.volume = 1.0;

  // ── Status & live visuals ──
  let waveMode = 'idle';
  let animId = null;
  const fakeBars = [];

  function refreshMarquee() {
    const wrap = textEl.parentElement;
    const overflow = textEl.scrollWidth > wrap.clientWidth;
    textEl.classList.toggle('marquee', overflow);
    if (overflow) textEl.style.setProperty('--tx', -(textEl.scrollWidth - wrap.clientWidth) + 'px');
  }

  function startWave(mode) {
    waveMode = mode === 'processing' ? 'thinking' : mode;
    if (mode === 'speaking') fakeBars.length = 0;
    wave.classList.remove('fade-in');
    void wave.offsetWidth;
    wave.classList.add('fade-in');
    if (!animId) drawWave();
  }

  // One analyser read per frame, shared by the orb bars, the footer bars and
  // the voice-level glow on the screen preview.
  function readMicRms() {
    if (!analyser || !levelBuf) return 0;
    analyser.getByteTimeDomainData(levelBuf);
    let rms = 0;
    for (let i = 0; i < levelBuf.length; i++) {
      const sample = (levelBuf[i] - 128) / 128;
      rms += sample * sample;
    }
    return Math.sqrt(rms / levelBuf.length);
  }

  let lastGlow = -1;
  function applyVoiceGlow(loudness) {
    if (!screenPanel) return;
    const v = Math.round(Math.min(1, loudness) * 100) / 100;
    if (v === lastGlow) return;
    lastGlow = v;
    screenPanel.style.setProperty('--voice-level', v.toFixed(2));
  }
  function resetVoiceGlow() {
    if (lastGlow === 0) return;
    lastGlow = 0;
    if (screenPanel) screenPanel.style.setProperty('--voice-level', '0');
  }

  // TTS meter helpers — pure visual reads, no audio-flow change.
  function ensureTtsAnalyser(ctx) {
    try {
      if (ttsAnalyser && ttsFreqBuf && ttsLevelBuf) return ttsAnalyser;
      const c = ctx || auCtx;
      if (!c || typeof c.createAnalyser !== 'function') return null;
      ttsAnalyser = c.createAnalyser();
      ttsAnalyser.fftSize = 2048;
      ttsAnalyser.smoothingTimeConstant = 0.8;
      ttsFreqBuf = new Uint8Array(ttsAnalyser.frequencyBinCount);
      ttsLevelBuf = new Uint8Array(ttsAnalyser.fftSize);
      return ttsAnalyser;
    } catch (_e) { return null; }
  }
  function readTtsRms() {
    if (!ttsAnalyser || !ttsLevelBuf) return 0;
    try {
      ttsAnalyser.getByteTimeDomainData(ttsLevelBuf);
    } catch (_e) { return 0; }
    let rms = 0;
    for (let i = 0; i < ttsLevelBuf.length; i++) {
      const sample = (ttsLevelBuf[i] - 128) / 128;
      rms += sample * sample;
    }
    return Math.sqrt(rms / ttsLevelBuf.length);
  }
  function ttsBarHeights() {
    // Returns real-TTS heights or null when nothing audible is playing
    // (lead-in gap, <audio> fallback path, analyser missing) so callers can
    // fall back to the legacy shimmer instead of flatlining.
    try {
      if (!ttsAnalyser || !ttsFreqBuf) return null;
      ttsAnalyser.getByteFrequencyData(ttsFreqBuf);
      const loudness = readTtsRms();
      const norm = Math.min(1, loudness * 7);
      if (norm < 0.02) return null;
      const heights = [0, 1, 2, 3].map((i) => {
        const v = ttsFreqBuf[Math.floor((i / 4) * ttsFreqBuf.length * 0.6)] / 255;
        const variation = 0.58 + v * 0.42;
        return 4 + norm * variation * 21;
      });
      return { heights, loudness, norm };
    } catch (_e) { return null; }
  }

  // Live equalizer bars — listening follows the mic, speaking follows TTS
  function updateBars() {
    if (!barEls) return;
    let heights;
    let loudness = 0;
    if (waveMode === 'listening' && analyser && freqBuf) {
      analyser.getByteFrequencyData(freqBuf);
      loudness = readMicRms();
      // Use real microphone energy as the main driver. The frequency bins
      // only add a little variation between bars, so quiet input stays quiet
      // and a louder voice visibly lifts the whole group.
      const norm = Math.min(1, loudness * 9);
      heights = [0, 1, 2, 3].map((i) => {
        const v = freqBuf[Math.floor((i / 4) * freqBuf.length * 0.6)] / 255;
        const variation = 0.58 + v * 0.42;
        return 4 + norm * variation * 21;
      });
      applyVoiceGlow(loudness * 9);
    } else if (waveMode === 'thinking') {
      const t = Date.now() / 190;
      heights = [0, 1, 2, 3].map((i) => 5 + Math.abs(Math.sin(t + i * 1.1)) * 17);
      resetVoiceGlow();
    } else if (waveMode === 'speaking') {
      // Real agent voice first (TTS analyser tap); legacy random shimmer
      // only as fallback (silent gap, <audio> fallback, no analyser yet).
      const tts = ttsBarHeights();
      if (tts) {
        heights = tts.heights;
        applyVoiceGlow(tts.norm);
      } else {
        heights = [0, 1, 2, 3].map((i) => {
          if (!fakeBars[20 + i]) fakeBars[20 + i] = 0.3;
          fakeBars[20 + i] += (Math.random() - 0.5) * 0.5;
          fakeBars[20 + i] = Math.min(1, Math.max(0.15, fakeBars[20 + i]));
          fakeBars[20 + i] *= 0.9;
          return 4 + fakeBars[20 + i] * 19;
        });
        resetVoiceGlow();
      }
    } else {
      heights = [9, 7, 8, 7];
      resetVoiceGlow();
    }
    for (let i = 0; i < barEls.length && i < 4; i++) {
      barEls[i].style.height = heights[i].toFixed(1) + 'px';
    }
    // Footer mic on the screen panel mirrors the same levels (its own copy of
    // the bar markup is separate from the orb's).
    if (screenFootBars && screenActive()) {
      for (let i = 0; i < screenFootBars.length && i < 4; i++) {
        screenFootBars[i].style.height = heights[i].toFixed(1) + 'px';
      }
    }
  }

  function drawWave() {
    updateBars();
    // Screen mode hides the wave canvas — keep the RAF loop alive only for the
    // footer bars / voice glow, skip all canvas work (was 60fps of dead repaints
    // competing with STT + TTS on a CPU-only box).
    if (!screenActive()) {
      const W = wave.width, H = wave.height;
      wctx.clearRect(0, 0, W, H);
      const bars = 20;
      const bw = W / bars;

      const base = waveMode === 'listening' ? '159,193,240'
        : waveMode === 'thinking' ? '195,179,232'
        : waveMode === 'speaking' ? '155,225,230'
        : '148,163,184';
      const grad = wctx.createLinearGradient(0, 0, W, 0);
      grad.addColorStop(0, 'rgba(' + base + ',0.2)');
      grad.addColorStop(0.5, 'rgba(' + base + ',0.65)');
      grad.addColorStop(1, 'rgba(' + base + ',0.2)');
      wctx.fillStyle = grad;

      const half = Math.ceil(bars / 2);
      for (let i = 0; i < half; i++) {
        let h = 0.06;
        if (waveMode === 'listening' && analyser && freqBuf) {
          analyser.getByteFrequencyData(freqBuf);
          const v = freqBuf[Math.floor((i / half) * freqBuf.length * 0.55)] / 255;
          h = Math.max(0.07, v * v);
        } else if (waveMode === 'thinking') {
          h = Math.max(0.09, Math.abs(Math.sin(Date.now() / 250 + i * 0.55)) * 0.9);
        } else if (waveMode === 'speaking') {
          // Same rule as the orb: real TTS spectrum when audible, else the
          // legacy shimmer so the wave never flatlines mid-utterance.
          let usedTts = false;
          try {
            if (ttsAnalyser && ttsFreqBuf) {
              ttsAnalyser.getByteFrequencyData(ttsFreqBuf);
              const ttsLoud = readTtsRms();
              if (ttsLoud * 7 >= 0.02) {
                const v = ttsFreqBuf[Math.floor((i / half) * ttsFreqBuf.length * 0.55)] / 255;
                h = Math.max(0.07, v * v * Math.min(1, ttsLoud * 7) * 1.6);
                if (h <= 0.071) h = Math.max(0.09, v * 0.9);
                usedTts = true;
              }
            }
          } catch (_e) { usedTts = false; }
          if (!usedTts) {
            if (!fakeBars[i]) fakeBars[i] = 0.12;
            fakeBars[i] += (Math.random() - 0.5) * 0.55;
            fakeBars[i] = Math.min(1, Math.max(0.07, fakeBars[i]));
            fakeBars[i] *= 0.92;
            h = fakeBars[i];
          }
        }
        const bh = Math.max(3, h * (H - 4));
        const x = i * bw + 1;
        const w = Math.max(1.5, bw - 2.5);
        wctx.beginPath();
        wctx.roundRect(x, (H - bh) / 2, w, bh, 1.5);
        wctx.fill();
        if (i < bars / 2 - 1 || bars % 2 === 0) {
          const xm = W - x - w;
          wctx.beginPath();
          wctx.roundRect(xm, (H - bh) / 2, w, bh, 1.5);
          wctx.fill();
        }
      }
    }
    // Phase 8-V6: idle CPU guard — pause the animation loop when nothing is
    // listening/speaking/thinking so the renderer doesn't burn CPU on
    // requestAnimationFrame repaints (was 60fps even idle → competed with
    // TTS decode → choppy).
    if (micOn || speaking || thinking || waveMode === 'listening' || waveMode === 'speaking' || waveMode === 'thinking') {
      animId = requestAnimationFrame(drawWave);
    } else {
      animId = null;
    }
  }

  function setStatus(s, extraText) {
    const cls = s === 'listening' ? 'listening' : s === 'thinking' ? 'thinking' : s === 'processing' ? 'processing' : s === 'speaking' ? 'speaking' : s === 'muted' ? 'muted' : s === 'error' ? 'error' : 'idle';
    dot.className = 'pip ' + cls;
    const map = { idle: 'Voice', muted: 'Muted', listening: 'Listening', thinking: 'Thinking', processing: 'Preparing voice', speaking: 'Answering', error: 'Error' };
    label.textContent = map[s] || s;
    label.classList.remove('swap');
    void label.offsetWidth;
    label.classList.add('swap');
    if (extraText !== undefined) textEl.textContent = extraText;
    // Preserve layout/mode classes — only state-* changes here (previously the
    // whole className was replaced, which wiped is-menu-open/is-expanded).
    // is-booting is visual-only (cold-start loading) so it must survive status
    // updates until the heartbeat explicitly clears it.
    const keep = ['is-menu-open', 'is-menu-closing', 'is-expanded', 'is-screen', 'is-screen-closing', 'is-demo', 'is-booting'];
    const kept = keep.filter((c) => document.body.classList.contains(c));
    document.body.className = kept.concat(['state-' + cls]).join(' ');
    micBtn.className = 'bars-btn' + (micOn ? ' on' : '');
    if (screenMic) screenMic.className = 'screen-mic' + (micOn ? ' on' : '');
    lastStatusKey = cls;
    syncScreenCaption();
    const stageKey = { listening: 'listening', thinking: 'thinking', processing: 'thinking', speaking: 'speaking' }[s];
    document.querySelectorAll('.stage').forEach((el) => el.classList.toggle('on', el.dataset.s === stageKey));
    startWave(s === 'muted' || s === 'idle' ? 'idle' : s);
    if (extraText !== undefined) requestAnimationFrame(refreshMarquee);
    send('status', { status: s, text: textEl.textContent });
    // The server-side cpal capture does not share the browser's AEC. Mute its
    // Moonshine feed while TTS is speaking so the assistant cannot transcribe
    // its own voice; unmute as soon as the turn returns to listening.
    if (s === 'speaking') {
      setServerCaptureMuted(true);
    } else if (s === 'listening' || s === 'muted' || s === 'idle' || s === 'error') {
      setServerCaptureMuted(false);
    }
  }

  let serverCaptureMuted = false;
  function setServerCaptureMuted(muted) {
    if (serverCaptureMuted === muted) return;
    serverCaptureMuted = muted;
    fetch(API + '/api/voice/mute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ muted }),
    }).catch(() => {});
  }

  function updateMicBtn() {
    micBtn.classList.toggle('on', micOn);
    micBtn.title = micOn ? 'Mute' : 'Unmute';
    if (screenMic) {
      screenMic.classList.toggle('on', micOn);
      screenMic.title = micOn ? 'Mute' : 'Unmute';
    }
  }

  function showHint() { hintEl.style.display = ''; sendBtn.style.display = ''; if (screenSend) screenSend.style.display = 'flex'; }
  function hideHint() { hintEl.style.display = 'none'; sendBtn.style.display = 'none'; if (screenSend) screenSend.style.display = 'none'; }

  // Parse STT JSON defensively (handles both {text} and legacy [{text}, status] shapes)
  function extractTranscript(data) {
    if (!data) return '';
    if (typeof data.text === 'string') return data.text.trim();
    if (Array.isArray(data) && data[0] && typeof data[0].text === 'string') return data[0].text.trim();
    if (data.error) throw new Error(String(data.error));
    return '';
  }

  // ── Capture config — TurnDetection (portable, mirrors pydantic TurnDetection) ──
  // Backend is source of truth at /api/turn_detection; defaults below are fallbacks.
  let turnDetection = {
    sensitivity: 'medium',
    prefix_padding_ms: 300,
    silence_duration_ms: 300,
    sound_level: 0.01,
    min_round_ms: 250,
    max_round_ms: 30000,
  };
  // Convenience aliases (kept for existing code paths).
  let SEND_SILENCE_MS = turnDetection.silence_duration_ms;
  let MAX_ROUND_MS = turnDetection.max_round_ms;
  const RUN_TIMEOUT_MS = 300000; // Phase 8-V5: run watchdog raised to 5min — long agent runs must not be killed early
  let MIN_ROUND_MS = turnDetection.min_round_ms;
  let SOUND_LEVEL = turnDetection.sound_level;
  fetch(API + '/api/turn_detection').then((r) => r.json()).then((cfg) => {
    if (cfg && typeof cfg.silence_duration_ms === 'number') {
      turnDetection = cfg;
      SEND_SILENCE_MS = cfg.silence_duration_ms;
      MIN_ROUND_MS = cfg.min_round_ms;
      MAX_ROUND_MS = cfg.max_round_ms;
      SOUND_LEVEL = cfg.sound_level;
    }
  }).catch(() => {});

  // Whisper's classic silence/noise hallucinations — never send these
  const HALLUCINATIONS = [
    /^thank\s+you[\s.,!?]*$/i,
    /^thank\s+you\s+(so|very)\s+much[\s.,!?]*$/i,
    /^thanks[\s.,!?]*$/i,
    /^thanks?\s+for\s+(watching|listening|your\s+time|the\s+video)[\s.,!?]*$/i,
    /^thank\s+you\s+for\s+(watching|listening|your\s+time|the\s+video)[\s.,!?]*$/i,
    /^you'?re\s+welcome[\s.,!?]*$/i,
    /^you\s+are\s+welcome[\s.,!?]*$/i,
    /^please\s+subscribe[\s.,!?]*$/i,
    /^subscribe\s+to\s+my\s+channel[\s.,!?]*$/i,
    /^(goodbye|bye|good\s+night|good\s+evening)[\s.,!?]*$/i,
  ];
  const GARBAGE_RE = /^(you|the|a|an|and|so|oh|um|uh|uhh|yeah|ok|okay|like|hmm|mhm|well|no)$/i;

  function isGarbage(t) {
    const s = (t || '').trim();
    if (!s) return false;
    if (/^[\s.,!?…·\-–—]+$/.test(s)) return true;
    if (HALLUCINATIONS.some((re) => re.test(s))) return true;
    if (GARBAGE_RE.test(s)) return true;
    return false;
  }

  // Local rule-based transcript cleanup — replaces the free-LLM /api/cleanup
  // round trip (which cost 3-15s per voice turn). Pure JS, zero network.
  const FILLER_RE = /\b(um+|uh+|uhh+|hmm+|erm+|er+|like)\b/gi;
  const REPEAT_RE = /\b(\w+)(\s+\1){2,}\b/gi;
  function cleanTranscript(raw) {
    let t = (raw || '').trim();
    if (!t) return t;
    t = t.replace(FILLER_RE, ' ').replace(REPEAT_RE, '$1').replace(/\s{2,}/g, ' ').trim();
    t = t.replace(/([.!?…])\s*([a-z])/g, (_, p, c) => p + ' ' + c.toUpperCase());
    t = t.replace(/^\s*([a-z])/, (c) => c.toUpperCase());
    return t;
  }

  // Polish (rule-based) then send to the pipeline
  async function sendText(raw) {
    const text = cleanTranscript(raw);
    if (!text || sending) return;
    // Content dedupe (the working send wins): rapid double-dispatch of the
    // same transcript (mirror + peek + flush racing) sends only once. A
    // genuinely repeated sentence 5s+ later still sends normally.
    const now = Date.now();
    if (text === lastSentText && (now - lastSentAt) < 5000) return;
    sending = true;
    lastSentText = text;
    lastSentAt = now;
    clearVoicePeek();
    try {
      setStatus('thinking');
      const final = text;
      if (final !== raw) {
        textEl.textContent = final;
        send('transcript', { text: final });
      }
      runSeq++;
      sendToPipeline(final, runSeq);
    } finally {
      sending = false;
    }
  }

  // Laptop hardware mute → instant send (your main workflow)
  function onTrackMuted() {
    if (!micOn) return;
    if (roundHasSpeech) {
      mutePendingSend = true; // send once the current round's speech is captured + transcribed
      return;
    }
    const text = accumulated.trim();
    if (text) {
      accumulated = '';
      hideHint();
      sendText(text);
    }
  }

  // ── Live session: browser PCM → Rust VAD/STT ─────────────────────────
  // The browser now owns the only microphone. A worklet downsamples to 16 kHz
  // mono PCM and sends binary frames over the voice WebSocket; the backend
  // emits partials and exactly one turn_final per utterance.
  function ensureVoiceWsOpen(timeout = 4000) {
    return new Promise((resolve, reject) => {
      if (_voiceWs && _voiceWs.readyState === 1) { resolve(); return; }
      if (!_voiceWs || _voiceWs.readyState === 3) {
        try { openVoiceWs(); } catch (e) { reject(e); return; }
      }
      const started = Date.now();
      const timer = setInterval(() => {
        if (_voiceWs && _voiceWs.readyState === 1) {
          clearInterval(timer);
          resolve();
        } else if (Date.now() - started > timeout) {
          clearInterval(timer);
          reject(new Error('Voice WebSocket did not open'));
        }
      }, 80);
    });
  }

  function resolveLiveSession(error) {
    const waiters = liveSessionWaiters.splice(0);
    waiters.forEach((waiter) => {
      clearTimeout(waiter.timer);
      if (error) waiter.reject(new Error(error));
      else waiter.resolve();
    });
  }

  function startLiveSession(timeout = 6000) {
    return new Promise((resolve, reject) => {
      if (!_voiceWs || _voiceWs.readyState !== 1) {
        reject(new Error('Voice WebSocket is not connected'));
        return;
      }
      const waiter = {
        resolve,
        reject,
        timer: setTimeout(() => {
          const index = liveSessionWaiters.indexOf(waiter);
          if (index >= 0) liveSessionWaiters.splice(index, 1);
          reject(new Error('Moonshine session did not start'));
        }, timeout),
      };
      liveSessionWaiters.push(waiter);
      _voiceWs.send(JSON.stringify({ type: 'session.start' }));
    });
  }

  function stopLiveSession() {
    liveSessionReady = false;
    resolveLiveSession('voice session stopped');
    try {
      if (_voiceWs && _voiceWs.readyState === 1) {
        _voiceWs.send(JSON.stringify({ type: 'session.stop' }));
      }
    } catch (_e) {}
  }

  function handleLiveSpeechStarted(msg) {
    roundHasSpeech = true;
    lastSpeechAt = Date.now();
    // Do not kill TTS on the first energy frame: speaker echo can leak into
    // the mic for a frame or two. Wait for a real partial transcript, or an
    // explicit stop word, before treating this as barge-in.
    if (speaking) {
      bargeTurnId = String((msg && msg.turn_id) || '');
      bargeAt = Date.now();
    }
    if (msg && msg.turn_id) send('speech_started', { turnId: msg.turn_id });
  }

  function maybeBargeIn(text, turnId) {
    if (!speaking || !bargeTurnId || (turnId && turnId !== bargeTurnId)) return;
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    const explicit = /\b(stop|cancel|wait|no|hold on|shut up)\b/i.test(text || '');
    if (words.length < 2 && !explicit) return;
    if (Date.now() - bargeAt < 120 && !explicit) return;
    stopSpeaking();
    if (micOn) setStatus('listening', text || 'Listening');
  }

  function abortVoiceRun() {
    runSeq++;
    thinking = false;
    try {
      if (chatId) {
        fetch(API + '/api/abort', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: chatId }),
        }).catch(() => {});
      }
    } catch (_e) {}
    try {
      if (abortRef) abortRef.abort();
    } catch (_e) {}
    abortRef = null;
  }

  function handleLiveTurnFinal(msg) {
    const turnId = String((msg && msg.turn_id) || '');
    if (turnId && turnId === lastFinalTurnId) return;
    if (turnId) lastFinalTurnId = turnId;
    bargeTurnId = '';
    const text = cleanTranscript(String((msg && msg.text) || ''));
    if (!text || isGarbage(text)) {
      if (accumulated && isGarbage(accumulated)) accumulated = '';
      return;
    }
    // A voice-answered question batch owns the next committed turns.
    // Route them to the broker instead of starting a new agent run.
    if (answeringBatch) { collectVoiceAnswer(text); return; }
    accumulated = text;
    lastLang = detectLanguage(text);
    setStatus('listening', text);
    showHint();
    send('transcript', { text, final: true, turnId });
    const generation = captureGen;
    const dispatch = () => {
      if (!micOn || generation !== captureGen) return;
      if (sending) { setTimeout(dispatch, 120); return; }
      sendText(text);
    };
    if (thinking || speaking) {
      if (speaking) stopSpeaking();
      if (thinking) abortVoiceRun();
      // Let the cancelled stream settle before starting the replacement turn.
      setTimeout(dispatch, 250);
    } else {
      dispatch();
    }
  }

  // -- Voice answers to ask_user --
  // The Rust QuestionBroker exposes /api/ask/pending with a chat_id per
  // batch. While the mic is on, the overlay claims batches for its own chat,
  // speaks each question, and routes the next committed turns to /api/ask/answer
  // instead of starting new agent runs. The main-window modal stays as fallback.
  async function pollVoiceQuestions() {
    if (!micOn || answeringBatch || !chatId) return;
    try {
      const r = await fetch(API + '/api/ask/pending');
      const d = await r.json().catch(() => ({}));
      const batches = Array.isArray(d && d.batches) ? d.batches : [];
      const mine = batches.find((b) => b && b.chat_id === chatId);
      if (mine && Array.isArray(mine.questions) && mine.questions.length) {
        beginAnswering(mine);
      }
    } catch (_e) { /* retry on next tick */ }
  }

  function formatQuestionForSpeech(q) {
    const parts = [];
    if (q && q.header) parts.push(String(q.header));
    if (q && q.question) parts.push(String(q.question));
    if (q && Array.isArray(q.options) && q.options.length) {
      const labels = q.options
        .map((o) => (typeof o === 'string' ? o : (o && (o.label || o.value)) || ''))
        .filter(Boolean);
      if (labels.length) parts.push('Options: ' + labels.join(', '));
    }
    return parts.join('. ');
  }

  function beginAnswering(batch) {
    answeringBatch = {
      batch_id: batch.batch_id,
      questions: batch.questions.slice(),
      answers: [],
      index: 0,
    };
    if (speaking) stopSpeaking();
    send('question', { batchId: batch.batch_id, count: batch.questions.length });
    speakCurrentQuestion();
  }

  async function speakCurrentQuestion() {
    const batch = answeringBatch;
    if (!batch || !micOn) return;
    const q = batch.questions[batch.index] || {};
    const text = formatQuestionForSpeech(q) || 'The agent has a question for you.';
    setStatus('listening', 'Question: ' + text.slice(0, 120));
    try {
      await speak(text);
    } catch (e) {
      console.error('[Voice] question TTS failed', e);
    }
    // The user's next committed turn is collected as the answer.
    if (answeringBatch === batch && micOn) {
      setStatus('listening', 'Answer: ' + (q.question || 'please answer'));
    }
  }

  function collectVoiceAnswer(text) {
    const batch = answeringBatch;
    if (!batch) return;
    const q = batch.questions[batch.index] || {};
    batch.answers.push({ id: q.id || ('q' + batch.index), selected: [], custom: text });
    batch.index++;
    send('transcript', { text, final: true, answer: true });
    if (batch.index < batch.questions.length) {
      speakCurrentQuestion();
    } else {
      submitVoiceAnswers();
    }
  }

  async function submitVoiceAnswers() {
    const batch = answeringBatch;
    answeringBatch = null;
    if (!batch) return;
    try {
      await fetch(API + '/api/ask/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ batch_id: batch.batch_id, answers: batch.answers }),
      });
    } catch (_e) { /* the broker timeout/modal covers failures */ }
    if (micOn) setStatus('listening', accumulated || 'Listening');
  }

  // ── Capture: legacy cpal path retained for explicit fallback/tests ────
  let recTimer = null;

  function startRound() {
    if (!micOn || roundRunning) return;
    roundRunning = true;
    oneRound()
      .catch((e) => console.error('[Voice] round error', e))
      .finally(() => {
        roundRunning = false;
        if (micOn) roundTimer = setTimeout(startRound, 60);
      });
  }

  async function transcribeBlob(blob) {
    // Fallback path kept for non-audio modes when server capture fails.
    try {
      const fd = new FormData();
      fd.append('file', blob, 'round.webm');
      const resp = await fetch(API + '/api/transcribe', { method: 'POST', body: fd });
      const data = await resp.json();
      if (!resp.ok || (data && data.error)) {
        if (resp.status !== 422) {
          setStatus('error', String((data && data.error) || ('HTTP ' + resp.status)).slice(0, 400));
          await sleep(1500);
        }
        return '';
      }
      return extractTranscript(data);
    } catch (e) {
      console.error('[Voice] STT failed', e);
      return '';
    }
  }

  async function oneRound() {
    if (!stream || !micOn) return;
    const myGen = captureGen; // stale rounds (mic toggled mid-round) must not send
    const buf = analyser ? new Uint8Array(analyser.fftSize) : null;
    roundHasSpeech = false;
    let lastSoundAt = Date.now();
    const startedAt = Date.now();
    let lastPeekText = '';
    try { window.__lastPeekText = window.__lastPeekText || ''; } catch(_e){}
    // WS push writes window.__lastPeekText; mirror it into this round's
    // local so the skip-empty fast path and flush see WS transcripts.
    const _wsMirrorTimer = setInterval(() => {
      try {
        if (myGen !== captureGen) return; // stale round after mic toggle
        const w = window.__lastPeekText || '';
        if (w && w !== lastPeekText) {
          lastPeekText = w;
          accumulated = w;
          setStatus('listening', w);
          send('transcript', { text: w });
          showHint();
        }
      } catch(_e){}
    }, 150);

    // Live transcript: WS push is primary (see openVoiceWs); HTTP peek is the
    // fallback when the socket is down. Tick 500ms so idle cost is ~2 req/s
    // worst-case instead of ~3.3 req/s.
    let captureSelfHealAt = 0;
    const peekTimer = setInterval(async () => {
      if (_voiceWs && _voiceWs.readyState === 1) return; // WS push active
      try {
        const r = await fetch(API + '/api/voice/peek');
        const d = await r.json();
        if (d && d.active === false) {
          // Server capture died (server restarted / watchdog stopped it) —
          // restart it so live input keeps working. Self-heal max 1x/2s.
          const now = Date.now();
          if (now > captureSelfHealAt) {
            captureSelfHealAt = now + 2000;
            fetch(API + '/api/voice/start', { method: 'POST' }).catch(() => {});
            console.log('[Voice] capture inactive — restarting');
          }
        }
        if (d && d.text && d.text !== lastPeekText) {
          lastPeekText = d.text;
          accumulated = d.text;
          setStatus('listening', d.text);
          send('transcript', { text: d.text });
          showHint();
        }
      } catch (_e) { /* ignore */ }
    }, 500);

    const monitor = setInterval(() => {
      let level = 0;
      if (analyser && buf) {
        analyser.getByteTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += Math.abs(buf[i] - 128) / 128;
        level = sum / buf.length;
      }
      if (level > SOUND_LEVEL) {
        lastSoundAt = Date.now();
        lastSpeechAt = Date.now();
        roundHasSpeech = true;
        // Barge-in ChatGPT-style: voice while TTS speaking stops audio immediately
        if (speaking) {
          stopSpeaking();
          setStatus('listening', accumulated || 'Listening');
        }
        // Note: while LLM is thinking, don't abort on VAD — new speech will be
        // steered as incremental context (see finishRound steering). Hard
        // interrupt (abort) only when TTS is speaking.
      }
      const elapsed = Date.now() - startedAt;
      // End the round after quiet gap, or after the hard cap. 60ms tick so
      // silence detection lands within ~60ms of SEND_SILENCE_MS, not ~200ms.
      if (elapsed >= MAX_ROUND_MS || (elapsed >= MIN_ROUND_MS && Date.now() - lastSoundAt >= SEND_SILENCE_MS)) {
        clearInterval(monitor);
        clearInterval(peekTimer);
        try { clearInterval(_wsMirrorTimer); } catch(_e){}
        finishRound();
      }
    }, 60);

    async function finishRound() {
      // Stale round after mic toggle — never send (this was the mic-off
      // resend + Hello-loop source). The fresh generation owns the mic now.
      if (myGen !== captureGen || !micOn) {
        return;
      }
      // Fast path: browser VAD heard nothing AND the server stream has shown
      // no rolling text → skip the POST /api/voice/send round-trip entirely
      // (it would 422 anyway). The server may still have heard something the
      // browser meter missed only when lastPeekText is non-empty.
      if (!roundHasSpeech && !lastPeekText && !accumulated.trim()) {
        return;
      }
      tReset();
      tMark('vad');
      // Screen mode: start the frame capture NOW so its JPEG encode + upload
      // overlap with the STT flush below instead of blocking TTFB.
      kickTurnFrameCapture();
      let t = '';
      try {
        // Prefer WS flush (one live socket) over an extra HTTP POST, with
        // HTTP fallback when the socket is down or the flush times out.
        let viaWs = false;
        if (_voiceWs && _voiceWs.readyState === 1) {
          const wt = await wsFlushRound(1200);
          if (typeof wt === 'string') { t = wt; viaWs = true; }
        }
        if (!viaWs) {
          const r = await fetch(API + '/api/voice/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({}),
          });
          const d = await r.json();
          if (!r.ok || (d && d.error)) {
            if (r.status !== 422) setStatus('error', String((d && d.error) || ('HTTP ' + r.status)).slice(0, 400));
          } else {
            t = d.text || '';
          }
        }
      } catch (e) {
        console.error('[Voice] send failed', e);
      }
      if (isGarbage(t)) t = '';

      if (t) {
        accumulated = t;
        lastLang = detectLanguage(accumulated);
        setStatus('listening', accumulated);
        showHint();
        send('transcript', { text: accumulated });
      }

      // Mute pressed during this speech round → send now
      if (mutePendingSend) {
        mutePendingSend = false;
        const text = accumulated.trim();
        if (text) { accumulated = ''; hideHint(); sendText(text); }
        return;
      }

      // Hands-free auto-send: if idle, start new LLM run; if LLM already
      // thinking, stream as steering (ChatGPT live) so breath+continue works.
      // Debounced: rapid successive round-ends coalesce into one dispatch so
      // a stuttering silence gap can't fire two runs for one utterance.
      const pending = accumulated.trim();
      if (!pending) turnFramePromise = null; // round produced nothing — drop the pending frame
      if (pending && !sending) {
        if (thinking) {
          // Stream incremental words to the running LLM + show immediately in chat
          const delta = pending;
          accumulated = '';
          clearVoicePeek();
          hideHint();
          turnFramePromise = null; // steering carries no attachment
          // Show in chat bubble immediately (transcript already did, but ensure)
          send('transcript', { text: delta });
          // Steer the running run — LLM will see it next iteration
          if (chatId) {
            fetch(API + '/api/steer', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ chat_id: chatId, message: delta })}).catch(()=>{});
          }
        } else {
          // No active run — silence gap already observed; debounce 700ms so
          // a split silence gap sends once. thinking/sending re-checked at
          // fire time; stale mic generations are dropped.
          const fireGen = captureGen;
          if (autoSendTimer) clearTimeout(autoSendTimer);
          autoSendTimer = setTimeout(() => {
            autoSendTimer = null;
            if (fireGen !== captureGen || !micOn) return;
            const text2 = accumulated.trim();
            if (text2 && !sending && !thinking) {
              accumulated = '';
              clearVoicePeek();
              hideHint();
              sendText(text2);
            }
          }, 700);
        }
      }
    }
  }

  // ── Chat resolution ──
  // The main window tells us which chat is active (project or general), so
  // live mode follows the open chat. Fallback: resolve the general workspace.
  let voiceWsId = localStorage.getItem('voice.wsId') || '';
  let voiceWsPath = localStorage.getItem('voice.wsPath');
  let wsResolvedBy = ''; // 'ipc' | 'fallback' | ''
  // Phase 8-V5: use the app's selected model/temperature for voice runs.
  let voiceModel = 'Automatic Fallback';
  let voiceTemp = 0.7;

  if (bridge && bridge.onSetChat) {
    bridge.onSetChat((info) => {
      if (info && info.chatId) {
        voiceWsId = info.wsId || '';
        voiceWsPath = (info.wsPath !== undefined && info.wsPath !== null) ? info.wsPath : '';
        chatId = info.chatId;
        chatLock = null;
        wsResolvedBy = 'ipc';
        if (info.model) voiceModel = info.model;
        if (typeof info.temperature === 'number') voiceTemp = info.temperature;
        localStorage.setItem('voice.wsId', voiceWsId);
        localStorage.setItem('voice.wsPath', voiceWsPath);
        localStorage.setItem('voice.chatId', chatId);
        updateMenuMode();
        // Screen mode is a personal-workspace feature: leaving personal
        // (or closing the panel) ends sharing instead of silently capturing.
        if (screenActive() && !isPersonalChat()) exitScreenMode();
      }
    });
  }

  function ensureChat() {
    if (chatLock) return chatLock;
    chatLock = (async () => {
      // 1) Known chat (IPC-synced or stored) — VERIFY it still exists, but
      //    cache the verification for 5min so consecutive voice turns skip
      //    the serial re-verify round-trip before POST /api/run.
      const verifiedKey = voiceWsId + '|' + chatId;
      if (chatId && voiceWsId) {
        if (chatVerifiedKey === verifiedKey && Date.now() - chatVerifiedAt < 5 * 60 * 1000) {
          return chatId;
        }
        try {
          const check = await fetch(API + '/api/workspaces/' + encodeURIComponent(voiceWsId) + '/chats/' + encodeURIComponent(chatId));
          if (check.ok) {
            chatVerifiedKey = verifiedKey;
            chatVerifiedAt = Date.now();
            return chatId;
          }
        } catch (_e) { /* fall through */ }
      }
      // 2) Fresh resolution: the ACTIVE workspace synced from the main window
      //    (voiceWsId already set by onSetChat) or the General workspace.
      //    NEVER pick _house for a general chat — that leaks the house agent.
      let ws = null;
      const wsRes = await fetch(API + '/api/workspaces');
      const wsData = await wsRes.json();
      const all = wsData.workspaces || [];
      if (voiceWsId) ws = all.find((w) => w.id === voiceWsId) || null;
      if (!ws) ws = all.find((w) => w.isGeneral) || null;
      if (!ws) ws = all[0] || null;
      if (!ws) throw new Error('No workspace available');
      voiceWsId = ws.id;
      voiceWsPath = ws.path || '';
      wsResolvedBy = 'fallback';
      localStorage.setItem('voice.wsId', voiceWsId);
      localStorage.setItem('voice.wsPath', voiceWsPath);
      const chatsRes = await fetch(API + '/api/workspaces/' + ws.id + '/chats');
      const chatsData = await chatsRes.json();
      if (chatsData.chats && chatsData.chats.length) {
        chatId = chatsData.chats[0].id;
      } else {
        const createRes = await fetch(API + '/api/workspaces/' + ws.id + '/chats', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: 'Voice Chat' }),
        });
        chatId = (await createRes.json()).id;
      }
      localStorage.setItem('voice.chatId', chatId);
      chatVerifiedKey = voiceWsId + '|' + chatId;
      chatVerifiedAt = Date.now();
      return chatId;
    })();
    return chatLock;
  }

  // Save the agent reply to the chat so it lands in history + memory context.
  // Fire-and-forget by design: callers MUST NOT await this before starting
  // TTS — persistence must never add to TTFB-audio.
  function persistReply(chat, reply) {
    if (!voiceWsId || !chat || !reply) return Promise.resolve();
    // Phase 8-V2 fix: ALWAYS tell the main window the reply landed — the
    // chat must refresh in real time. Send the event immediately; the POST
    // itself runs in the background.
    try { send('reply', { text: reply.slice(0, 500) }); } catch (_e) {}
    return fetch(API + '/api/workspaces/' + voiceWsId + '/chats/' + chat + '/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: 'agent', content: reply }),
      }).catch((e) => { console.error('[Voice] failed to persist reply', e); });
  }

  function progressFromState(s) {
    const th = s.thoughts || {};
    const thought = th.developer || th.supervisor;
    if (thought && thought.trim()) return thought.trim().slice(0, 90);
    const log = s.live_terminal_log || '';
    const lines = log.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!lines.length) return '';
    const last = lines[lines.length - 1].replace(/^\[[^\]]*\]\s*/, '').replace(/^\s*[═─=]*\s*$/, '').trim();
    return (last || 'Working…').slice(0, 90);
  }

  // Pull the real failure reason from the run so the overlay shows something useful
  function extractRunError(state, reason) {
    const log = (state && state.live_terminal_log) || '';
    const m = log.match(/Insufficient balance[^\n"]*/i)
      || log.match(/All DeepSeek models exhausted[^\n"]*/i)
      || log.match(/Error code: \d+[^\n"]*/i)
      || log.match(/\[ORCHESTRATOR ERROR\][^\n"]*/i);
    if (m) return m[0].slice(0, 90);
    return (reason || 'Run failed').slice(0, 90);
  }

  // ── Live process feed (thinking / subagents / tools, like the main chat) ──
  const FEED_MAX = 300;
  let expanded = false;
  let menuOpen = false;
  let menuClosing = false;
  let menuClosingTimer = null;
  let lastLogLen = 0;

  function resizeOverlay(animate) {
    const menuVisible = menuOpen || menuClosing;
    const morph = !!animate && !prefersReducedMotion();
    // Screen mode owns the layout: the panel is fixed-size and the menu drops
    // inside it (CSS), so opening the menu must not resize the window.
    if (screenActive()) {
      if (bridge && bridge.resize) bridge.resize(SCREEN_W, SCREEN_H, morph);
      return;
    }
    // Menu height follows the visible items (a personal chat adds "Look at
    // screen"): 3 items = 140 as before, 4 items = 174.
    const menuItems = 3 + (isPersonalChat() ? 1 : 0);
    const w = expanded ? 400 : menuVisible ? 286 : 84;
    const h = expanded ? 344 : menuVisible ? 38 + menuItems * 34 : 84;
    if (bridge && bridge.resize) bridge.resize(w, h, morph);
  }

  function prefersReducedMotion() {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_e) { return false; }
  }

  function finishMenuClose() {
    if (menuOpen) return;
    menuClosing = false;
    document.body.classList.remove('is-menu-open', 'is-menu-closing');
    menuPanel.setAttribute('aria-hidden', 'true');
    resizeOverlay();
  }

  function setMenuOpen(on) {
    if (on) {
      clearTimeout(menuClosingTimer);
      menuClosingTimer = null;
      menuOpen = true;
      menuClosing = false;
      expanded = false;
      if (screenPicker) screenPicker.classList.remove('open');
      expandBtn.classList.remove('expanded');
      feedWrap.style.display = 'none';
      document.body.classList.remove('is-expanded');
      document.body.classList.add('is-menu-open');
      document.body.classList.remove('is-menu-closing');
      menuPanel.setAttribute('aria-hidden', 'false');
    } else {
      if (!menuOpen && !menuClosing) return;
      menuOpen = false;
      menuClosing = true;
      document.body.classList.add('is-menu-open', 'is-menu-closing');
      menuPanel.setAttribute('aria-hidden', 'false');
      clearTimeout(menuClosingTimer);
      menuClosingTimer = setTimeout(finishMenuClose, 1220);
    }
    menuBtn.classList.toggle('active', on);
    menuBtn.setAttribute('aria-expanded', String(on));
    menuBtn.title = on ? 'Close voice controls' : 'Open voice controls';
    resizeOverlay();
  }

  function setExpanded(on) {
    expanded = on;
    if (on) {
      clearTimeout(menuClosingTimer);
      menuClosingTimer = null;
      menuOpen = false;
      menuClosing = false;
      menuBtn.classList.remove('active');
      menuBtn.setAttribute('aria-expanded', 'false');
      menuBtn.title = 'Open voice controls';
      document.body.classList.remove('is-menu-open', 'is-menu-closing');
      menuPanel.setAttribute('aria-hidden', 'true');
    }
    expandBtn.classList.toggle('expanded', on);
    document.body.classList.toggle('is-expanded', on);
    feedWrap.style.display = on ? '' : 'none';
    resizeOverlay();
  }

  // ── Look-at-screen mode ──────────────────────────────────────────────
  // The compact orb morphs into a screen-share panel (Gemini-style). Sharing
  // is explicit: entering the mode turns it on (or opens the source picker
  // the first time); frames go to POST /api/vision/frame — one at each voice
  // turn, plus server-requested captures from the agent's look_at_screen tool.
  // Compact floating overlay (reference proportions): 300×232.
  const SCREEN_W = 300;
  const SCREEN_H = 232;
  const SCREEN_SOURCE_KEY = 'voice.screenSourceId';
  const GUEST_CHAT = '_personal';   // screen mode is a personal-workspace feature
  let voiceMode = 'voice';          // 'voice' | 'screen'
  let screenSharing = 'off';        // 'off' | 'on' | 'continuous'
  let screenStream = null;
  let nativeCapturing = false;
  let nativePreviewTimer = null;
  function nativeCaptureAvailable() { return !!(bridge && bridge.captureScreenFrame); }
  function hasScreenSource() { return !!screenStream || nativeCapturing; }
  let screenSourceId = localStorage.getItem(SCREEN_SOURCE_KEY) || '';
  let screenSourceLabel = '';
  let screenTimer = null;
  let screenExitTimer = null;
  let screenBusy = false;
  let lastStatusKey = 'idle';

  function isPersonalChat() { return voiceWsId === GUEST_CHAT; }
  function screenActive() { return voiceMode === 'screen'; }

  const ROLE_BY_STATUS = {
    listening: 'YOU', thinking: 'THINKING', processing: 'THINKING',
    speaking: 'ANSWER', error: 'ERROR', muted: 'MUTED', idle: 'READING',
  };

  const STATUS_BY_KEY = {
    listening: 'Listening…', thinking: 'Thinking…', processing: 'Thinking…',
    speaking: 'Answering', error: 'Error', muted: 'Muted', idle: 'Voice',
  };

  function syncScreenCaption() {
    if (!screenCaptionText) return;
    try {
      screenCaptionRole.textContent = ROLE_BY_STATUS[lastStatusKey] || 'READING';
      if (screenStatusEl) screenStatusEl.textContent = STATUS_BY_KEY[lastStatusKey] || 'Voice';
      const t = (textEl.textContent || '').trim();
      if (t && t !== screenCaptionText.textContent) {
        screenCaptionText.textContent = t;
        screenCaptionText.classList.remove('swap');
        void screenCaptionText.offsetWidth;
        screenCaptionText.classList.add('swap');
      }
    } catch (_e) {}
  }

  // Source chip: mirrors the reference (one chip per shared source). Body
  // click opens the live preview; × stops sharing but stays in the panel.
  function updateScreenChip() {
    try {
      const hasSource = !!(screenSourceLabel || screenSourceId);
      if (screenChips) screenChips.style.display = hasSource ? '' : 'none';
      if (screenChipName) screenChipName.textContent = screenSourceLabel || 'Screen';
      if (screenChip) screenChip.classList.toggle('paused', screenSharing === 'off');
      if (screenPopName) screenPopName.textContent = screenSourceLabel || 'Screen';
    } catch (_e) {}
  }

  function togglePreviewPop(open) {
    if (!screenPreviewPop) return;
    const show = open === undefined ? !screenPreviewPop.classList.contains('open') : !!open;
    screenPreviewPop.classList.toggle('open', show);
    screenPreviewPop.setAttribute('aria-hidden', show ? 'false' : 'true');
  }

  // Preview states (B9): live | starting | paused | off | error.
  function setPreviewState(state, text) {
    if (!screenPreviewState) return;
    screenPreview.classList.toggle('live', state === 'live');
    screenPreviewState.style.display = state === 'live' ? 'none' : 'flex';
    if (screenSpinner) screenSpinner.style.display = state === 'starting' ? '' : 'none';
    if (text !== undefined && screenPreviewEmpty) screenPreviewEmpty.textContent = text;
    const actionable = state === 'off' || state === 'paused' || state === 'error';
    if (screenPreviewAction) {
      screenPreviewAction.style.display = actionable ? '' : 'none';
      screenPreviewAction.textContent = state === 'paused' ? 'Resume' : (state === 'error' ? 'Try again' : 'Share screen');
      screenPreviewAction.dataset.state = state;
    }
    // Footer badge: LIVE (red pulse) / CONT (blue) / OFF (grey).
    if (screenBadge) {
      const live = state === 'live';
      const cont = live && screenSharing === 'continuous';
      screenBadge.textContent = cont ? 'CONT' : (live ? 'LIVE' : 'OFF');
      screenBadge.classList.toggle('live', live && !cont);
      screenBadge.classList.toggle('cont', cont);
    }
    updateScreenChip();
  }

  function updateMenuMode() {
    const personal = isPersonalChat();
    const inScreen = screenActive();
    if (menuScreen) {
      menuScreen.style.display = personal ? '' : 'none';
      menuScreen.querySelector('span').textContent = inScreen ? 'Voice mode' : 'Look at screen';
    }
    if (menuShare) {
      menuShare.style.display = inScreen ? '' : 'none';
      menuShare.querySelector('span').textContent = screenSharing === 'off' ? 'Resume sharing' : 'Pause sharing';
    }
    if (menuContinuous) {
      menuContinuous.style.display = inScreen ? '' : 'none';
      menuContinuous.querySelector('span').textContent = screenSharing === 'continuous' ? 'Continuous look: on' : 'Continuous look: off';
    }
  }

  async function enterScreenMode() {
    if (screenActive()) return;
    showScreenLayout();
    if (!bridge) return; // demo / browser preview
    if (!screenSourceId) {
      openScreenPicker(true);
    } else {
      setSharingMode('on');
    }
  }

  // Layout-only switch (shared by the menu entry and agent-initiated capture):
  // window + panel morph, no sharing decisions. Cancels any menu collapse
  // instantly so the 1.2s close animation never plays over the panel entrance.
  function showScreenLayout() {
    clearTimeout(screenExitTimer);
    screenExitTimer = null;
    cancelMenuInstant();
    if (expanded) setExpanded(false);
    voiceMode = 'screen';
    document.body.classList.remove('is-screen-closing');
    document.body.classList.add('is-screen');
    updateMenuMode();
    resizeOverlay(true);
    syncScreenCaption();
  }

  function cancelMenuInstant() {
    clearTimeout(menuClosingTimer);
    menuClosingTimer = null;
    menuOpen = false;
    menuClosing = false;
    menuBtn.classList.remove('active');
    menuBtn.setAttribute('aria-expanded', 'false');
    menuBtn.title = 'Open voice controls';
    document.body.classList.remove('is-menu-open', 'is-menu-closing');
    menuPanel.setAttribute('aria-hidden', 'true');
  }

  function exitScreenMode() {
    if (!screenActive()) return;
    stopScreenShare();
    togglePreviewPop(false);
    voiceMode = 'voice';
    document.body.classList.add('is-screen-closing');
    updateMenuMode();
    // One continuous motion: the window tween (260ms) and the panel fade
    // (280ms) run together while the orb fades back in (0.2s base transition).
    resizeOverlay(true);
    clearTimeout(screenExitTimer);
    screenExitTimer = setTimeout(() => {
      screenExitTimer = null;
      document.body.classList.remove('is-screen', 'is-screen-closing');
      updateMenuMode();
    }, 260);
  }

  async function setSharingMode(mode) {
    if (mode === 'off') {
      stopScreenShare('pause');
      updateMenuMode();
      return true;
    }
    if (!hasScreenSource()) {
      const ok = await startScreenShare();
      if (!ok) return false;
    }
    screenSharing = mode;
    setScreenTimer();
    // Refresh badge/chip (e.g. LIVE -> CONT) without touching the preview.
    if (hasScreenSource()) setPreviewState('live');
    updateMenuMode();
    broadcastScreenState();
    return true;
  }

  async function refreshNativePreview() {
    if (!nativeCapturing || screenSharing === 'off') return null;
    const frame = await bridge.captureScreenFrame();
    if (!frame || !frame.ok || !frame.image_b64) return null;
    if (screenNative) {
      screenPreview.classList.add('native');
      screenNative.src = 'data:image/jpeg;base64,' + frame.image_b64;
      screenNative.classList.add('native');
    }
    if (frame.source) screenSourceLabel = frame.source;
    if (frame.id && frame.id !== screenSourceId) screenSourceId = frame.id;
    return frame;
  }

  function startNativePreview() {
    if (nativePreviewTimer) return;
    nativePreviewTimer = setInterval(() => {
      refreshNativePreview().catch(() => {});
    }, 1000);
  }

  function stopNativePreview() {
    if (nativePreviewTimer) {
      clearInterval(nativePreviewTimer);
      nativePreviewTimer = null;
    }
    try { if (screenNative) screenNative.src = ''; } catch (_e) {}
    try {
      screenNative.classList.remove('native');
      screenPreview.classList.remove('native');
    } catch (_e) {}
  }

  async function startScreenShare(sourceId) {
    if (hasScreenSource()) return true;
    if (sourceId !== undefined && sourceId !== null) {
      screenSourceId = sourceId || '';
      try {
        if (screenSourceId) localStorage.setItem(SCREEN_SOURCE_KEY, screenSourceId);
        else localStorage.removeItem(SCREEN_SOURCE_KEY);
      } catch (_e) {}
    }
    screenBusy = true;
    setPreviewState('starting', 'Starting screen capture…');
    if (nativeCaptureAvailable()) {
      try {
        const sel = await bridge.selectScreenSource(screenSourceId);
        if (!sel || !sel.ok) throw new Error((sel && sel.error) || 'No screen selected');
        screenSourceId = sel.id;
        screenSourceLabel = sel.name || 'Screen';
        nativeCapturing = true;
        screenSharing = 'on';
        const first = await refreshNativePreview();
        if (!first) throw new Error('The first frame could not be captured');
        setPreviewState('live');
