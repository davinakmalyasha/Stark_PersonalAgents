name: template-validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render every template with sample vars
        run: |
          pip install --quiet jinja2
          python scripts/validate_templates.py
