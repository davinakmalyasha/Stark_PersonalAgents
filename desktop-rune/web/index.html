<!DOCTYPE html>
<!-- Stark Rune web shell (PWA). The wasm module below is generated by
     wasm-bindgen from the stark-rune-app cdylib (`--target web`); Rune
     appends its own canvas and opens the unified shell. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c0e" />
  <meta name="description" content="Stark — Multi-agent AI workspace, native Rust UI on every screen." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/pwa-192.png" />
  <title>Stark</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0c0c0e;
      overscroll-behavior: none;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #8a8a8a;
      font: 13px/1.4 Inter, system-ui, sans-serif;
      transition: opacity .3s ease;
    }
  </style>
</head>
<body>
  <div id="boot">Loading Stark…</div>
  <script type="module">
    import init from './pkg/stark_rune_web.js';
    try {
      await init();
      document.getElementById('boot')?.remove();
    } catch (err) {
      document.getElementById('boot').textContent =
        'Stark needs WebGPU in this browser. ' + err;
      console.error(err);
    }
  </script>
</body>
</html>
