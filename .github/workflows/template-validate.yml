name: template-validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render every template with sample vars (+ YAML-validate workflows)
        run: |
          pip install --quiet jinja2 pyyaml
          python scripts/validate_templates.py
      - name: Test suite
        # pytest, not tests/run_all.py. run_all.py is a zero-dependency runner
        # that cannot supply fixtures, so it SKIPs 23 fixture-based tests — and
        # before it was fixed it also failed 46 tests it could not import.
        # pytest is the runner that actually exercises everything.
        run: |
          pip install --quiet jinja2 pyyaml pytest
          python -m pytest tests/ -q
