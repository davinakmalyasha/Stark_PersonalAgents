# Builds the Linux deploy unit for the VPS runner: the stark-server binary
# (x86_64, glibc matched to the deploy OS) plus the frontend dist it serves.
# The VPS never compiles — it downloads this artifact and runs it.
#
# Trigger: manual, or pushes to master that touch backend/frontend.
# Runner matches the VPS OS (Ubuntu 26.04) so glibc is compatible.

name: build-linux

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backend-rs/**'
      - 'frontend/src/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/vite.config.*'
      - 'frontend/index.html'
      - '.github/workflows/build-linux.yml'

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (stable, per backend-rs/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs -> target

      - name: Contract sanity (frozen v4 tool contract)
        working-directory: backend-rs
        run: cargo test -p stark-contract

      - name: Build stark-server (release)
        working-directory: backend-rs
        run: cargo build --release -p stark-server

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend dist
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Package deploy unit
        run: |
          mkdir -p pkg/opt/stark pkg/opt/stark-frontend
          cp backend-rs/target/release/stark-server pkg/opt/stark/stark-server
          chmod +x pkg/opt/stark/stark-server
          cp -r frontend/dist/. pkg/opt/stark-frontend/
          tar -czf stark-linux-x86_64.tar.gz -C pkg opt
          tar -tzf stark-linux-x86_64.tar.gz | head -8
          ls -la stark-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: stark-linux-x86_64
          path: stark-linux-x86_64.tar.gz
          retention-days: 7
