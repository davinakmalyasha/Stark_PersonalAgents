[package]
name = "stark-rune-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
stark-rune-app = { path = "../stark-rune-app", features = ["rune-real"] }

[dependencies.rune]
git = "https://github.com/anomalyco/rune"
rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b"
package = "rune"
default-features = false
# Web has no system-font discovery: bundle Inter + Plex Mono.
features = ["embedded-fonts"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
