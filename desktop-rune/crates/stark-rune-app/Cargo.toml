[package]
name = "stark-rune-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "stark-rune"
path = "src/main.rs"

[lib]
crate-type = ["rlib"]

[dependencies]
stark-theme = { path = "../stark-theme" }
stark-kit = { path = "../stark-kit" }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["clock", "wasmbind"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
minisign-verify = "0.3"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "mp4", "flac", "vorbis", "wav"] }
base64 = "0.22"
# Backend-assisted dictation: stream captured PCM to `stark-server`'s
# `/api/voice/ws` (the pre-rewrite split). Pure Rust, works on GNU + MSVC.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# Hex's anti-aliased FFT resampler for 48k microphone blocks.
rubato = "5.0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = [
    "Blob",
    "Document",
    "Element",
    "File",
    "FileList",
    "FormData",
    "Headers",
    "History",
    "HtmlAnchorElement",
    "HtmlAudioElement",
    "HtmlElement",
    "HtmlMediaElement",
    "HtmlInputElement",
    "Location",
    "Node",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Storage",
    "Url",
    "Window",
] }

[features]
# Native browser app: the attach button opens the real picker. The web crate
# disables default features (Rune rejects `native-file-dialog` on wasm32).
default = ["native-file-dialog"]
# GPU-free and offline. Enable once the pinned `dev` checkout is fetched:
# `cargo test -p stark-rune-app --features rune-real`
rune-real = ["dep:rune", "dep:rune-kit"]
# Weak dependency feature: only reaches Rune when `rune-real` is on.
native-file-dialog = ["rune?/native-file-dialog"]

[dependencies.rune]
path = "../../vendor/rune/crates/rune"
package = "rune"
default-features = false
# embedded-fonts: web has no system-font discovery; bundle Inter + Plex Mono
# so glyphs render in the browser (native keeps working unchanged).
features = ["embedded-fonts"]
optional = true

# OpenCode's syntax scanners and diff engine, reused without its skin or block
# layout: Stark renders every margin/line box itself to match the reference layout exactly.
[dependencies.rune-kit]
path = "../../vendor/rune/crates/rune-kit"
package = "rune-kit"
default-features = false
optional = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Registry"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# Live-mode display sharing. Windows uses Windows Graphics Capture so the
# frame matches what the user sees, not a stale GDI copy.
xcap = { version = "0.9.8", features = ["wgc"] }

[build-dependencies]
embed-resource = "3.0"
