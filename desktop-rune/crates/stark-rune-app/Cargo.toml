[package]
name = "stark-rune-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "stark-rune"
path = "src/main.rs"

[lib]
crate-type = ["rlib"]

[dependencies]
stark-theme = { path = "../stark-theme" }
stark-kit = { path = "../stark-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = [
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Window",
] }

[features]
# Real Rune rendering. Off by default so headless goldens + unit tests stay
# GPU-free and offline. Enable once the pinned `dev` checkout is fetched:
# `cargo test -p stark-rune-app --features rune-real`
default = []
rune-real = ["dep:rune"]

[dependencies.rune]
git = "https://github.com/anomalyco/rune"
rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b"
package = "rune"
default-features = false
# embedded-fonts: web has no system-font discovery; bundle Inter + Plex Mono
# so glyphs render in the browser (native keeps working unchanged).
features = ["embedded-fonts"]
optional = true
