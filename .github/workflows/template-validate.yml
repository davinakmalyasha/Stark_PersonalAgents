name: template-validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render every template with sample vars (+ YAML-validate workflows)
        run: |
          pip install --quiet jinja2 pyyaml
          python scripts/validate_templates.py
      - name: Test suite
        # pytest, not tests/run_all.py. run_all.py is a zero-dependency runner
        # that cannot supply fixtures, so it SKIPs 23 fixture-based tests — and
        # before it was fixed it also failed 46 tests it could not import.
        #
        # The suite imports the REAL runtime (`tools` -> `agents` -> `llm`), so
        # a bare jinja2+pyyaml install cannot even collect it: it dies on
        # `No module named 'dotenv'`. requirements-test.txt is the runtime set
        # minus the voice stack, fastembed and tree-sitter-languages.
        run: |
          pip install --quiet -r requirements-test.txt
          python -m pytest tests/ -q
